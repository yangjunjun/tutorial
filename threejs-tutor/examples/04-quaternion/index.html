<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>欧拉角与四元数 / Euler &amp; Quaternion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:system-ui,sans-serif}
#app{width:100vw;height:100vh}
#info{position:absolute;top:12px;left:12px;z-index:10;color:#e0e0e0;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;max-width:430px;pointer-events:none}
#info b{color:#7fd1ff}
#info span{color:#ffd17f}
#info em{color:#ff7777;font-style:normal}
#matrixOverlay{position:absolute;top:12px;right:12px;z-index:10;color:#7fd1ff;background:rgba(0,0,0,.6);padding:10px 12px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre;pointer-events:none;min-width:240px}
#hint{position:absolute;bottom:12px;left:12px;z-index:10;color:#aaa;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:6px;font-size:12px}
.lil-gui{--background-color:#1f2440;--text-color:#e0e0e0;--title-background-color:#2a3050}
</style>
</head>
<body>
<div id="app"></div>
<div id="info">
  <b>欧拉角与四元数 / Euler &amp; Quaternion</b><br/>
  左：<em>欧拉立方体</em>（演示万向节锁） / Left: <em>Euler cube</em> (gimbal lock).<br/>
  右：<em>四元数立方体</em> slerp 平滑朝向鼠标 / Right: <em>quaternion cube</em> slerps toward mouse.<br/>
  <span>移动鼠标观察右侧立方体转向 / Move mouse to see right cube turn.</span>
</div>
<div id="matrixOverlay">loading...</div>
<div id="hint">拖拽旋转视角 / Drag to orbit · 移动鼠标 / Move mouse</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- 场景 / Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 14, 38);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(4, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(6, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
scene.add(grid);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x12142a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

// ====== 核心 / Core ======

// 欧拉立方体（左） / Euler cube (left) — 演示万向节锁
const eulerCube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xff7777, emissive: 0x331111, roughness: 0.4, metalness: 0.15 })
);
eulerCube.position.set(-2.2, 0.8, 0);
eulerCube.castShadow = true;
scene.add(eulerCube);
const eulerAxes = new THREE.AxesHelper(1.1);
eulerCube.add(eulerAxes);

// 四元数立方体（右） / Quaternion cube (right) — slerp 朝向鼠标
const quatCube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x113355, roughness: 0.4, metalness: 0.15 })
);
quatCube.position.set(2.2, 0.8, 0);
quatCube.castShadow = true;
scene.add(quatCube);
const quatAxes = new THREE.AxesHelper(1.1);
quatCube.add(quatAxes);

// 给四元数立方体加一个"箭头鼻子"指示正面 +Z / add a nose indicating +Z front
const nose = new THREE.Mesh(
  new THREE.ConeGeometry(0.18, 0.5, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd17f, emissive: 0x332200 })
);
nose.position.set(0, 0, 0.75);
nose.rotation.x = Math.PI / 2;
quatCube.add(nose);

// 鼠标目标标记 / mouse target marker
const mouseMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 20, 14),
  new THREE.MeshStandardMaterial({ color: 0xffd17f, emissive: 0x553300 })
);
mouseMarker.castShadow = true;
mouseMarker.visible = false;
scene.add(mouseMarker);

// 从 quatCube 到鼠标的连线 / line from quatCube to mouse
const aimLineMat = new THREE.LineDashedMaterial({ color: 0xffd17f, dashSize: 0.2, gapSize: 0.12 });
const aimLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const aimLine = new THREE.Line(aimLineGeo, aimLineMat);
scene.add(aimLine);

// 射线 / raycaster
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseHit = new THREE.Vector3();
let mouseActive = false;

renderer.domElement.addEventListener('pointermove', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  if (raycaster.ray.intersectPlane(groundPlane, mouseHit)) {
    mouseMarker.position.copy(mouseHit);
    mouseMarker.position.y = 0.16;
    mouseMarker.visible = true;
    mouseActive = true;
  }
});
renderer.domElement.addEventListener('pointerleave', () => { mouseActive = false; mouseMarker.visible = false; aimLine.visible = false; });

// ---- 参数 / Params ----
const params = {
  order: 'XYZ',          // 欧拉顺序 / Euler order
  ex: 0.4, ey: 1.2, ez: 0.2, // 欧拉三轴 / Euler axes (radians)
  gimbalDemo: false,     // 锁定 Y=90° 演示 / lock Y at 90° demo
  slerpFactor: 0.1,      // slerp 平滑系数 / slerp smoothing
};

const gui = new GUI();
gui.add(params, 'order', ['XYZ', 'YZX', 'ZXY', 'XZY', 'YXZ', 'ZYX']).name('欧拉顺序 order').onChange(v => eulerCube.rotation.order = v);
gui.add(params, 'ex', -Math.PI, Math.PI, 0.02).name('Euler X');
gui.add(params, 'ey', -Math.PI, Math.PI, 0.02).name('Euler Y');
gui.add(params, 'ez', -Math.PI, Math.PI, 0.02).name('Euler Z');
gui.add(params, 'gimbalDemo').name('万向锁演示 gimbal').onChange(v => {
  if (v) { params.ey = Math.PI / 2; gui.controllers.forEach(c => c.updateDisplay && c.updateDisplay()); }
});
gui.add(params, 'slerpFactor', 0.01, 0.5, 0.01).name('slerp 系数');

const overlay = document.getElementById('matrixOverlay');

// ---- 渲染循环 / Render loop ----
const clock = new THREE.Clock();
const targetQ = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // 欧拉立方体：直接设置三轴 / Euler cube: set 3 axes directly
  eulerCube.rotation.order = params.order;
  eulerCube.rotation.x = params.ex;
  eulerCube.rotation.y = params.gimbalDemo ? Math.PI / 2 : params.ey;
  eulerCube.rotation.z = params.ez;

  // 四元数立方体：slerp 朝向鼠标 / Quaternion cube: slerp toward mouse
  if (mouseActive) {
    const dir = mouseHit.clone().sub(quatCube.position).normalize();
    // 物体正面 +Z（鼻子方向），从 +Z 转到 dir / face +Z, rotate from +Z to dir
    targetQ.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    aimLineGeo.setFromPoints([quatCube.position.clone(), mouseHit.clone().setY(0.8)]);
    aimLine.computeLineDistances();
    aimLine.visible = true;
  }
  quatCube.quaternion.slerp(targetQ, params.slerpFactor);

  // 让鼻子轻微脉动 / pulse the nose
  nose.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.08);

  // 显示数值 / display values
  const eq = eulerCube.quaternion;
  const qq = quatCube.quaternion;
  overlay.textContent =
    `Euler cube (order ${params.order}):\n` +
    `  rot = (${params.ex.toFixed(2)}, ${params.ey.toFixed(2)}, ${params.ez.toFixed(2)})\n` +
    `  quat = (${eq.x.toFixed(3)}, ${eq.y.toFixed(3)}, ${eq.z.toFixed(3)}, ${eq.w.toFixed(3)})\n\n` +
    `Quaternion cube:\n` +
    `  quat = (${qq.x.toFixed(3)}, ${qq.y.toFixed(3)}, ${qq.z.toFixed(3)}, ${qq.w.toFixed(3)})\n` +
    `  slerp t = ${params.slerpFactor}\n` +
    `  ${params.gimbalDemo ? '⚠ GIMBAL LOCK (Y=90°)' : ''}`;

  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body></html>
