<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>glTF 工作流 / glTF Workflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
  #app { width: 100vw; height: 100vh; }
  #info {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 380px;
    pointer-events: none;
  }
  #info b { color: #7fd1ff; }
  .lil-g { z-index: 20 !important; }
  #tree {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    color: #cfe; background: rgba(0,0,0,0.6); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; line-height: 1.5; max-width: 280px;
    font-family: ui-monospace, monospace; max-height: 60vh; overflow: auto;
  }
  #tree b { color: #ffd479; }
  .tree-node { cursor: pointer; padding: 2px 0; }
  .tree-node:hover { color: #7fd1ff; }
  .tree-node.active { color: #ff9966; font-weight: 700; }
</style>
</head>
<body>
<div id="app"></div>
<div id="info">
  <b>glTF 工作流 / glTF Workflow</b><br/>
  程序化构建的机器人模型，模拟加载后的场景树管理 / Procedural robot mimicking a loaded scene graph: inspect nodes, highlight parts, reset transform, dispose resources.
</div>
<div id="tree"><b>节点树 / Node Tree</b><div id="tree-list"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- 场景 / Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// ---- 相机 / Camera ----
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(5, 4, 8);

// ---- 渲染器 / Renderer ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

// ---- 控制器 / Controls ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);

// ---- 灯光 / Lights ----
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(5, 10, 7);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -8; dir.shadow.camera.right = 8;
dir.shadow.camera.top = 8; dir.shadow.camera.bottom = -8;
scene.add(dir);
const rim = new THREE.DirectionalLight(0x6688ff, 0.4);
rim.position.set(-6, 4, -5);
scene.add(rim);

// ---- 网格地面 / Grid floor ----
const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
scene.add(grid);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x223044, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ====== 核心：程序化构建机器人 / Core: procedural robot ======
function buildRobot() {
  const root = new THREE.Group();
  root.name = 'Robot';

  const make = (geo, color, name) => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: 0.5 }));
    m.name = name;
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  };

  // 身体 / Body
  const body = make(new THREE.BoxGeometry(1.4, 1.8, 0.9), 0x4fa8ff, 'Body');
  body.position.y = 1.5;
  root.add(body);

  // 头部 / Head
  const head = make(new THREE.BoxGeometry(0.85, 0.85, 0.85), 0xffcc66, 'Head');
  head.position.y = 2.55;
  root.add(head);

  // 眼睛 / Eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x223, emissive: 0x66ddff, emissiveIntensity: 1.2 });
  const eyeGeo = new THREE.SphereGeometry(0.08, 12, 12);
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.name = 'LeftEye';
  leftEye.position.set(-0.2, 2.6, 0.43);
  root.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat.clone()); rightEye.name = 'RightEye';
  rightEye.position.set(0.2, 2.6, 0.43);
  root.add(rightEye);

  // 手臂（作为关节子节点）/ Arms as jointed children
  const armGeo = new THREE.CylinderGeometry(0.16, 0.16, 1.3, 14);
  const leftArm = make(armGeo, 0x88ddaa, 'LeftArm');
  leftArm.position.set(-0.9, 1.95, 0);
  leftArm.rotation.z = 0.25;
  root.add(leftArm);
  const rightArm = make(armGeo, 0x88ddaa, 'RightArm');
  rightArm.position.set(0.9, 1.95, 0);
  rightArm.rotation.z = -0.25;
  root.add(rightArm);

  // 腿 / Legs
  const legGeo = new THREE.CylinderGeometry(0.2, 0.18, 1.4, 14);
  const leftLeg = make(legGeo, 0x556677, 'LeftLeg');
  leftLeg.position.set(-0.35, 0.7, 0);
  root.add(leftLeg);
  const rightLeg = make(legGeo, 0x556677, 'RightLeg');
  rightLeg.position.set(0.35, 0.7, 0);
  root.add(rightLeg);

  return root;
}

let robot = buildRobot();
scene.add(robot);

// 保存原始材质与变换 / Save original materials & transform
const originalMaterials = new Map();
robot.traverse((n) => {
  if (n.isMesh) originalMaterials.set(n, n.material);
});
const originalRotation = robot.rotation.clone();
const originalPosition = robot.position.clone();
const originalScale = robot.scale.clone();

// ---- 节点树 UI / Node tree UI ----
const treeList = document.getElementById('tree-list');
let selectedNode = null;
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xff7755, wireframe: true });

function renderTree() {
  treeList.innerHTML = '';
  const walk = (obj, depth) => {
    const div = document.createElement('div');
    div.className = 'tree-node';
    div.style.paddingLeft = (depth * 12) + 'px';
    div.textContent = `${obj.name || '(unnamed)'} · ${obj.type}`;
    div.onclick = () => selectNode(obj);
    if (obj === selectedNode) div.classList.add('active');
    treeList.appendChild(div);
    obj.children.forEach((c) => walk(c, depth + 1));
  };
  walk(robot, 0);
}

let highlightHelper = null;
function selectNode(obj) {
  // 移除上一次高亮 / Remove previous highlight
  if (highlightHelper) {
    scene.remove(highlightHelper);
    highlightHelper.geometry?.dispose();
    highlightHelper = null;
  }
  selectedNode = obj;
  if (obj.isMesh) {
    highlightHelper = new THREE.Mesh(obj.geometry, highlightMat);
    obj.getWorldPosition(highlightHelper.position);
    obj.getWorldQuaternion(highlightHelper.quaternion);
    obj.getWorldScale(highlightHelper.scale);
    scene.add(highlightHelper);
  }
  renderTree();
  // 同步 GUI 显示 / Refresh GUI label
  if (guiSelected) guiSelected.setValue(obj.name || obj.type);
}
renderTree();

// ---- 包围盒辅助 / Bounding box helper ----
let boxHelper = null;

// ---- GUI 调试面板 / Debug panel ----
const gui = new GUI();
const params = {
  recursive: true,
  showBox: false,
  selected: robot.name,
  resetTransform: () => {
    robot.rotation.copy(originalRotation);
    robot.position.copy(originalPosition);
    robot.scale.copy(originalScale);
  },
  normalizeSize: () => {
    const box = new THREE.Box3().setFromObject(robot);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 4 / maxDim;
    robot.scale.setScalar(scale);
    box.setFromObject(robot);
    const center = box.getCenter(new THREE.Vector3());
    robot.position.sub(center);
    if (boxHelper) boxHelper.setFromObject(robot);
  },
  recenter: () => {
    const box = new THREE.Box3().setFromObject(robot);
    const center = box.getCenter(new THREE.Vector3());
    robot.position.sub(center);
    if (boxHelper) boxHelper.setFromObject(robot);
  },
  disposeAndRebuild: () => {
    // 演示资源释放 / Demonstrate resource disposal
    if (highlightHelper) { scene.remove(highlightHelper); highlightHelper.geometry?.dispose(); highlightHelper = null; }
    if (boxHelper) { scene.remove(boxHelper); boxHelper.geometry?.dispose(); boxHelper = null; params.showBox = false; gui.controllers.forEach(c => c.updateDisplay()); }
    robot.traverse((n) => {
      if (n.isMesh) {
        n.geometry?.dispose();
        const m = n.material;
        (Array.isArray(m) ? m : [m]).forEach((mat) => {
          for (const k in mat) if (mat[k]?.isTexture) mat[k].dispose();
          mat.dispose();
        });
      }
    });
    scene.remove(robot);
    originalMaterials.clear();
    selectedNode = null;
    // 重建 / Rebuild
    robot = buildRobot();
    scene.add(robot);
    robot.traverse((n) => { if (n.isMesh) originalMaterials.set(n, n.material); });
    renderTree();
    console.log('模型已重建，旧资源已释放 / Model rebuilt, old resources disposed. renderer.info:', renderer.info);
  }
};

gui.add(params, 'recursive').name('递归遍历 / Recursive');
const guiSelected = gui.add(params, 'selected').name('选中节点 / Selected').listen();
gui.add(params, 'showBox').name('显示包围盒 / BBox').onChange((v) => {
  if (v) {
    boxHelper = new THREE.Box3Helper(new THREE.Box3().setFromObject(robot), 0xffff44);
    scene.add(boxHelper);
  } else if (boxHelper) {
    scene.remove(boxHelper);
    boxHelper.geometry?.dispose();
    boxHelper = null;
  }
});
gui.add(params, 'resetTransform').name('重置变换 / Reset Transform');
gui.add(params, 'normalizeSize').name('归一化尺寸 / Normalize');
gui.add(params, 'recenter').name('居中 / Recenter');
gui.add(params, 'disposeAndRebuild').name('释放并重建 / Dispose & Rebuild');

// 更新包围盒 / Update bounding box on change
const origNormalize = params.normalizeSize;
gui.controllers.forEach((c) => {
  if (c.property === 'normalizeSize' || c.property === 'recenter' || c.property === 'resetTransform') {
    c.onChange(() => { if (boxHelper) boxHelper.box.setFromObject(robot); });
  }
});

// ---- 控制台输出节点树 / Console log node tree ----
console.log('=== 节点树 / Node Tree ===');
function logTree(obj, depth = 0) {
  const info = obj.isMesh ? ` [Mesh, ${(obj.geometry.attributes.position?.count || 0)} verts]` : '';
  console.log(`${'  '.repeat(depth)}${obj.name || '(unnamed)'} · ${obj.type}${info}`);
  obj.children.forEach((c) => logTree(c, depth + 1));
}
logTree(robot);
console.log('renderer.info:', renderer.info);

// ---- 渲染循环 / Render loop ----
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();
  const t = clock.getElapsedTime();
  // 轻微呼吸动画 / Subtle breathing
  if (robot) {
    robot.getObjectByName('Head')?.position.setY(2.55 + Math.sin(t * 1.5) * 0.03);
  }
  // 同步高亮位置 / Sync highlight position
  if (highlightHelper && selectedNode?.isMesh) {
    selectedNode.getWorldPosition(highlightHelper.position);
    selectedNode.getWorldQuaternion(highlightHelper.quaternion);
    selectedNode.getWorldScale(highlightHelper.scale);
  }
  controls.update();
  renderer.render(scene, camera);
});

// ---- 自适应 / Resize ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
