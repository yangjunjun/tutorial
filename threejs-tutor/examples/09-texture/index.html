<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纹理与采样 / Texture & Sampling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 400px;
      pointer-events: none;
    }
    #info b { color: #7fd1ff; }
    #info code { color: #ffd479; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="info">
    <b>纹理与采样 / Texture & Sampling</b><br />
    UV 棋盘纹理 + 动态 CanvasTexture。<br />
    UV-checker + dynamic CanvasTexture.<br />
    实时调整 repeat / offset / rotation / wrap / filter / anisotropy。
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    // ---- 场景 / Scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12121e);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(2.5, 3, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('app').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ---- 灯光 / Lights ----
    scene.add(new THREE.AmbientLight(0x666677, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(3, 5, 4);
    scene.add(dir);

    // ---- 网格辅助 / Grid ----
    const grid = new THREE.GridHelper(20, 20, 0x334466, 0x222238);
    grid.position.y = -1.01;
    scene.add(grid);

    // ====== UV 棋盘纹理 / UV checker texture ======
    function makeCheckerTexture(size = 512, cells = 8) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const cell = size / cells;
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          const even = (x + y) % 2 === 0;
          ctx.fillStyle = even ? '#dddddd' : '#4455aa';
          ctx.fillRect(x * cell, y * cell, cell, cell);
          // 中心标记 / center marker
          ctx.fillStyle = even ? '#4455aa' : '#dddddd';
          ctx.font = `${cell * 0.3}px monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${x},${y}`, x * cell + cell / 2, y * cell + cell / 2);
        }
      }
      // 左下角红色标记 / red corner marker for orientation
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(0, 0, cell, cell * 0.3);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    const checkerTex = makeCheckerTexture();
    const planeGeo = new THREE.PlaneGeometry(4, 4, 1, 1);
    const planeMat = new THREE.MeshStandardMaterial({
      map: checkerTex, side: THREE.DoubleSide, roughness: 0.8
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    scene.add(plane);

    // ====== 动态 CanvasTexture / Dynamic CanvasTexture ======
    const dynCanvas = document.createElement('canvas');
    dynCanvas.width = dynCanvas.height = 256;
    const dynCtx = dynCanvas.getContext('2d');
    const dynTex = new THREE.CanvasTexture(dynCanvas);
    dynTex.colorSpace = THREE.SRGBColorSpace;
    const dynPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshStandardMaterial({ map: dynTex, side: THREE.DoubleSide, emissive: 0x222222, emissiveMap: dynTex, emissiveIntensity: 0.3 })
    );
    dynPlane.position.set(0, 1, -1.5);
    scene.add(dynPlane);

    let dynTime = 0;
    function updateDynamicCanvas(dt) {
      dynTime += dt;
      const c = dynCtx;
      // 背景 / background
      const grad = c.createLinearGradient(0, 0, 256, 256);
      grad.addColorStop(0, '#1a1a3e');
      grad.addColorStop(1, '#3a1a3e');
      c.fillStyle = grad;
      c.fillRect(0, 0, 256, 256);
      // 动态圆环 / animated rings
      for (let i = 0; i < 5; i++) {
        const r = 30 + i * 20 + (dynTime * 30) % 20;
        c.strokeStyle = `hsla(${(dynTime * 60 + i * 60) % 360}, 80%, 60%, 0.8)`;
        c.lineWidth = 3;
        c.beginPath();
        c.arc(128, 128, r, 0, Math.PI * 2);
        c.stroke();
      }
      // 文字 / text
      c.fillStyle = '#ffffff';
      c.font = 'bold 20px monospace';
      c.textAlign = 'center';
      c.fillText(`t = ${dynTime.toFixed(2)}s`, 128, 240);
      dynTex.needsUpdate = true;
    }

    // ====== GUI / Debug panel ======
    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const p = {
      repeatX: 1, repeatY: 1,
      offsetX: 0, offsetY: 0,
      rotation: 0,
      wrap: 'Repeat',
      magFilter: 'Linear',
      anisotropy: maxAniso,
      showDynamic: true,
    };

    const gui = new GUI();
    const fRepeat = gui.addFolder('重复与偏移 / Repeat & Offset');
    fRepeat.add(p, 'repeatX', 1, 8, 0.5).name('重复X / RepeatX').onChange(applyTex);
    fRepeat.add(p, 'repeatY', 1, 8, 0.5).name('重复Y / RepeatY').onChange(applyTex);
    fRepeat.add(p, 'offsetX', 0, 1, 0.01).name('偏移X / OffsetX').onChange(applyTex);
    fRepeat.add(p, 'offsetY', 0, 1, 0.01).name('偏移Y / OffsetY').onChange(applyTex);
    fRepeat.add(p, 'rotation', 0, 360, 1).name('旋转° / Rotation').onChange(applyTex);

    const fFilter = gui.addFolder('过滤与包裹 / Filter & Wrap');
    fFilter.add(p, 'wrap', ['Repeat', 'ClampToEdge', 'MirroredRepeat']).name('包裹 / Wrap').onChange(applyTex);
    fFilter.add(p, 'magFilter', ['Linear', 'Nearest']).name('放大过滤 / Mag').onChange(applyTex);
    fFilter.add(p, 'anisotropy', 1, maxAniso, 1).name('各向异性 / Aniso').onChange(applyTex);
    fFilter.add(p, 'showDynamic').name('动态画布 / Dynamic').onChange(v => { dynPlane.visible = v; });

    function applyTex() {
      checkerTex.repeat.set(p.repeatX, p.repeatY);
      checkerTex.offset.set(p.offsetX, p.offsetY);
      checkerTex.rotation = THREE.MathUtils.degToRad(p.rotation);
      const wrapVal = THREE[p.wrap + 'Wrapping'];
      checkerTex.wrapS = checkerTex.wrapT = wrapVal;
      checkerTex.magFilter = p.magFilter === 'Linear' ? THREE.LinearFilter : THREE.NearestFilter;
      checkerTex.anisotropy = p.anisotropy;
      checkerTex.needsUpdate = true;
    }
    applyTex();

    // ---- 渲染循环 / Render loop ----
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (p.showDynamic) updateDynamicCanvas(dt);
      controls.update();
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
