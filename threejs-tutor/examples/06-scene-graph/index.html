<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>场景图与 Object3D 层级 / Scene Graph & Object3D Hierarchy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 400px;
      pointer-events: none;
    }
    #info b { color: #7fd1ff; }
    #info code { color: #ffd479; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="info">
    <b>场景图 / Scene Graph</b><br />
    太阳系层级：Scene→Sun→EarthOrbit→Earth→MoonOrbit→Moon<br />
    Solar-system hierarchy using parent-child transforms.<br />
    <code>earthOrbit.rotation.y += speed * dt</code> 自动驱动地球与月球。
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    // ---- 场景 / Scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b1a);

    // 星空背景 / starfield background
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 2000; i++) {
      const r = 80 + Math.random() * 40;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      starPos.push(r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x888899, size: 0.4, sizeAttenuation: true })));

    // ---- 相机 / Camera ----
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 8, 16);

    // ---- 渲染器 / Renderer ----
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('app').appendChild(renderer.domElement);

    // ---- 控制器 / Controls ----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 60;

    // ---- 灯光 / Lights ----
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    const sunLight = new THREE.PointLight(0xffeecc, 2.5, 100, 1.2);
    scene.add(sunLight);

    // ====== 核心：太阳系层级 / Solar system hierarchy ======

    // 太阳 / Sun
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(1.3, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffaa33 })
    );
    scene.add(sun);

    // 太阳光晕 / sun glow sprite
    const glowTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d').createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255,200,80,0.9)');
      g.addColorStop(1, 'rgba(255,200,80,0)');
      const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.set(5, 5, 1);
    sun.add(glow);

    // 地球轨道枢轴 / Earth orbit pivot (child of Sun)
    const earthOrbit = new THREE.Group();
    earthOrbit.name = 'EarthOrbit';
    sun.add(earthOrbit);

    // 地球 / Earth
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 40, 40),
      new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.75, metalness: 0.1 })
    );
    earth.position.set(6, 0, 0);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthOrbit.add(earth);

    // 月球轨道枢轴 / Moon orbit pivot (child of Earth)
    const moonOrbit = new THREE.Group();
    moonOrbit.name = 'MoonOrbit';
    earth.add(moonOrbit);

    // 月球 / Moon
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 28, 28),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.95 })
    );
    moon.position.set(1.5, 0, 0);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonOrbit.add(moon);

    // 轨道辅助线函数 / orbit ring helper
    function orbitRing(r, color = 0x446688) {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 })
      );
      line.layers.set(1); // 放到 layer 1，可单独控制 / put on layer 1 for separate control
      return line;
    }
    const earthRing = orbitRing(6, 0x446688);
    sun.add(earthRing);
    const moonRing = orbitRing(1.5, 0x886644);
    earth.add(moonRing);
    const orbitLines = [earthRing, moonRing];

    // 局部坐标轴辅助 / local axes helper on Earth
    const earthAxes = new THREE.AxesHelper(1.2);
    earthAxes.layers.set(1);
    earth.add(earthAxes);

    // ---- GUI 调试面板 / Debug panel ----
    const params = {
      orbitSpeed: 1.0,
      moonSpeed: 1.0,
      showOrbits: true,
      showAxes: false,
      sunSelfRotation: true,
      layerHelper: false,
    };

    const gui = new GUI();
    gui.add(params, 'orbitSpeed', 0, 3, 0.01).name('地球公转 / Earth Orbit');
    gui.add(params, 'moonSpeed', 0, 5, 0.01).name('月球公转 / Moon Orbit');
    gui.add(params, 'showOrbits').name('显示轨道 / Orbits').onChange(v => {
      orbitLines.forEach(l => l.visible = v);
    });
    gui.add(params, 'showAxes').name('局部坐标轴 / Axes').onChange(v => {
      earthAxes.visible = v;
    });
    gui.add(params, 'sunSelfRotation').name('太阳自转 / Sun Spin');
    gui.add(params, 'layerHelper').name('仅看辅助层 / Helper Layer').onChange(v => {
      // 用 layers 切换：只看 layer 1 = 只看辅助 / only layer 1 = helpers only
      if (v) {
        camera.layers.set(1);
      } else {
        camera.layers.enableAll();
      }
    });

    // 初始状态 / initial state
    earthAxes.visible = false;

    // ---- 渲染循环 / Render loop ----
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      // 帧率无关动画 / frame-rate independent
      earthOrbit.rotation.y += 0.3 * params.orbitSpeed * dt;
      moonOrbit.rotation.y  += 1.8 * params.moonSpeed * dt;
      if (params.sunSelfRotation) sun.rotation.y += 0.15 * dt;
      earth.rotation.y += 0.5 * dt;   // 地球自转 / Earth self-rotation

      controls.update();
      renderer.render(scene, camera);
    });

    // ---- 自适应 / Resize ----
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
