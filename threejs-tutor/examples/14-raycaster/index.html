<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raycaster 交互 / Raycaster Interaction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
  #app { width: 100vw; height: 100vh; cursor: crosshair; }
  #info {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 380px;
    pointer-events: none;
  }
  #info b { color: #7fd1ff; }
  #info code { color: #ffd479; }
  .lil-g { z-index: 20 !important; }
  #status {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    color: #cfe; background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 8px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  #status b { color: #7fd1ff; }
</style>
</head>
<body>
<div id="app"></div>
<div id="info">
  <b>Raycaster 交互 / Raycaster Interaction</b><br/>
  hover 高亮（emissive）· 点击选择（描边）· 地面拖拽移动。<br/>
  Hover = emissive highlight, Click = outline select, Drag = move on ground plane.
</div>
<div id="status"><b>hover:</b> <span id="h">—</span> &nbsp;|&nbsp; <b>selected:</b> <span id="s">—</span> &nbsp;|&nbsp; <b>hits:</b> <span id="n">0</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- 场景 / Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---- 灯光 / Lights ----
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(5, 10, 7);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
scene.add(dir);

// ---- 网格地面 / Grid floor ----
const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
scene.add(grid);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x223044, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ====== 核心：可交互的彩色盒子 / Core: interactive colored boxes ======
const boxes = [];
const palette = [0xff5566, 0x66ff88, 0x6688ff, 0xffcc44, 0xcc66ff, 0x44dddd];
for (let i = 0; i < 6; i++) {
  const size = 0.8 + Math.random() * 0.6;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(size, size, size),
    new THREE.MeshStandardMaterial({ color: palette[i], roughness: 0.5, metalness: 0.1 })
  );
  mesh.position.set((i - 2.5) * 1.8, size / 2, (Math.random() - 0.5) * 2);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.baseColor = palette[i];
  mesh.userData.name = `Box-${i}`;
  scene.add(mesh);
  boxes.push(mesh);
}

// ---- 选择描边 / Selection outline ----
const outlineMat = new THREE.LineBasicMaterial({ color: 0xffff44, linewidth: 2 });
let outlineHelper = null;

function setOutline(mesh) {
  if (outlineHelper) {
    scene.remove(outlineHelper);
    outlineHelper.geometry.dispose();
  }
  if (!mesh) { outlineHelper = null; return; }
  const edges = new THREE.EdgesGeometry(mesh.geometry);
  outlineHelper = new THREE.LineSegments(edges, outlineMat);
  mesh.add(outlineHelper); // 作为子节点跟随 / child to follow transform
}

// ---- 射线交互状态 / Ray interaction state ----
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();

let hovered = null;
let selected = null;
let dragging = null;
const dragOffset = new THREE.Vector3();
let downXY = null;

const params = {
  recursive: true,
  showRay: false,
  hoverEmissive: true,
};

function setPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

// ---- 射线可视化 / Ray visualization ----
let rayArrow = null;
function updateRayVisual() {
  if (!params.showRay) {
    if (rayArrow) { scene.remove(rayArrow); rayArrow.dispose(); rayArrow = null; }
    return;
  }
  raycaster.setFromCamera(pointer, camera);
  if (!rayArrow) {
    rayArrow = new THREE.ArrowHelper(
      raycaster.ray.direction.clone().normalize(),
      raycaster.ray.origin.clone(),
      15, 0xff00ff, 0.6, 0.4
    );
    scene.add(rayArrow);
  } else {
    rayArrow.position.copy(raycaster.ray.origin);
    rayArrow.setDirection(raycaster.ray.direction.clone().normalize());
  }
}

// ---- 鼠标事件 / Mouse events ----
const canvas = renderer.domElement;

canvas.addEventListener('pointermove', e => {
  setPointer(e);
  if (dragging) {
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
      dragging.position.x = hitPoint.x + dragOffset.x;
      dragging.position.z = hitPoint.z + dragOffset.z;
    }
  }
});

canvas.addEventListener('pointerdown', e => {
  setPointer(e);
  downXY = { x: e.clientX, y: e.clientY };
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boxes, params.recursive);
  if (hits.length) {
    selected = hits[0].object;
    setOutline(selected);
    // 计算抓取偏移（只在地面平面上）/ grab offset on ground plane
    raycaster.ray.intersectPlane(groundPlane, hitPoint);
    dragOffset.set(selected.position.x - hitPoint.x, 0, selected.position.z - hitPoint.z);
    dragging = selected;
    controls.enabled = false;
  }
});

canvas.addEventListener('pointerup', e => {
  const moved = downXY ? Math.hypot(e.clientX - downXY.x, e.clientY - downXY.y) : 0;
  const wasDragging = dragging;
  dragging = null;
  controls.enabled = true;
  // 纯点击（位移小）才更新 hover 状态显示 / pure click updates status
  if (moved < 4) {
    // 是点击：保持当前选择 / it's a click: keep selection
  } else {
    // 是拖拽：保持选择不变 / it's a drag: keep selection
  }
  downXY = null;
  updateStatus();
});

// 空白处点击取消选择 / click empty space to deselect
canvas.addEventListener('click', e => {
  // 已在 pointerup 处理选择，这里只处理取消 / selection handled in pointerup; here just deselect on empty
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boxes, params.recursive);
  if (!hits.length) { selected = null; setOutline(null); }
});

// ---- hover 检测（每帧）/ hover detection per frame ----
function updateHover() {
  if (dragging) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(boxes, params.recursive);
  const obj = hits.length ? hits[0].object : null;

  if (obj !== hovered) {
    if (hovered) hovered.material.emissive.setHex(0x000000);
    hovered = obj;
    if (hovered && params.hoverEmissive) hovered.material.emissive.setHex(0x553311);
    canvas.style.cursor = hovered ? 'pointer' : 'crosshair';
    updateStatus();
  }
  document.getElementById('n').textContent = hits.length;
}

// ---- 状态显示 / Status ----
function updateStatus() {
  document.getElementById('h').textContent = hovered ? hovered.userData.name : '—';
  document.getElementById('s').textContent = selected ? selected.userData.name : '—';
}
updateStatus();

// ---- GUI / Debug panel ----
const gui = new GUI();
gui.add(params, 'recursive').name('递归求交 / Recursive');
gui.add(params, 'showRay').name('显示射线 / Show Ray');
gui.add(params, 'hoverEmissive').name('hover 高亮 / Hover Emissive').onChange(v => {
  if (!v && hovered) hovered.material.emissive.setHex(0x000000);
});
gui.add({ reset: () => {
  boxes.forEach((b, i) => { b.position.set((i - 2.5) * 1.8, b.geometry.parameters.height / 2, 0); });
  selected = null; setOutline(null);
}}, 'reset').name('重置位置 / Reset');

// ---- 渲染循环 / Render loop ----
renderer.setAnimationLoop(() => {
  updateHover();
  updateRayVisual();
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
