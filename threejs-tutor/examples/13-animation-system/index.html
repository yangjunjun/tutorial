<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动画系统 / Animation System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
  #app { width: 100vw; height: 100vh; }
  #info {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 380px;
    pointer-events: none;
  }
  #info b { color: #7fd1ff; }
  #info code { color: #ffd479; }
  .lil-g { z-index: 20 !important; }
  #status {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    color: #cfe; background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 8px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  #status b { color: #7fd1ff; }
</style>
</head>
<body>
<div id="app"></div>
<div id="info">
  <b>动画系统 / Animation System</b><br/>
  手写 AnimationClip（idle / walk），演示播放、淡入淡出、切换与混合。<br/>
  Hand-authored clips with fade in/out, switching and weight blending.
</div>
<div id="status"><b>mixer.time:</b> <span id="t">0.00</span>s &nbsp;|&nbsp; <b>action:</b> <span id="a">Idle</span> &nbsp;|&nbsp; <b>walk weight:</b> <span id="w">0.00</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- 场景 / Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(4, 3.5, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);

// ---- 灯光 / Lights ----
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(5, 10, 7);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -5; dir.shadow.camera.right = 5;
dir.shadow.camera.top = 6; dir.shadow.camera.bottom = -2;
scene.add(dir);

// ---- 地面 / Ground ----
const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
scene.add(grid);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x223044, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ====== 核心：程序化绑骨角色 / Core: procedural rigged character ======
// 用 Group 模拟骨骼层级，命名节点供 track 定位 / Groups as bones, named for track lookup
function buildCharacter() {
  const root = new THREE.Group();
  root.name = 'Character';

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4fa8ff, metalness: 0.3, roughness: 0.5 });
  const limbMat = new THREE.MeshStandardMaterial({ color: 0x88ddaa, roughness: 0.6 });
  const legMat  = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.7 });

  // 身体（pivot 在胯部，方便呼吸浮动）/ Body pivot at hip
  const body = new THREE.Group(); body.name = 'Body';
  body.position.set(0, 1.5, 0);
  const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.6), bodyMat);
  bodyMesh.position.y = 0.7;
  bodyMesh.castShadow = true;
  body.add(bodyMesh);
  root.add(body);

  // 头 / Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), bodyMat);
  head.name = 'Head'; head.position.set(0, 2.5, 0); head.castShadow = true;
  root.add(head);

  // 手臂（pivot 在肩部）/ Arms pivot at shoulder
  function makeLimb(name, mat, x, y) {
    const g = new THREE.Group(); g.name = name;
    g.position.set(x, y, 0);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.0, 12), mat);
    mesh.position.y = -0.5; mesh.castShadow = true;
    g.add(mesh);
    return g;
  }
  const leftArm  = makeLimb('LeftArm',  limbMat, -0.65, 2.1);
  const rightArm = makeLimb('RightArm', limbMat,  0.65, 2.1);
  body.add(leftArm, rightArm);

  // 腿（pivot 在胯部）/ Legs pivot at hip
  const leftLeg  = makeLimb('LeftLeg',  legMat, -0.25, 1.4);
  const rightLeg = makeLimb('RightLeg', legMat,  0.25, 1.4);
  body.add(leftLeg, rightLeg);

  return root;
}

const character = buildCharacter();
scene.add(character);

// ====== 手写 AnimationClip / Hand-author clips ======
function buildClips() {
  // idle：Body 上下呼吸 + 微微左右晃 / idle: breathing bob + slight sway
  const idleBodyY = new THREE.NumberKeyframeTrack(
    'Body.position', [0, 0.75, 1.5, 2.25, 3],
    [1.5, 1.56, 1.5, 1.44, 1.5]
  );
  const idleBodyZ = new THREE.NumberKeyframeTrack(
    'Body.rotation[z]', [0, 1.5, 3],
    [0, 0.04, 0]
  );
  const idle = new THREE.AnimationClip('Idle', 3, [idleBodyY, idleBodyZ]);

  // walk：腿交替摆 + 手臂反相 / walk: legs alternate, arms counter-swing
  const times = [0, 0.25, 0.5, 0.75, 1];
  const leftLeg  = new THREE.NumberKeyframeTrack('LeftLeg.rotation[x]',  times, [ 0.5,-0.5, 0.5,-0.5, 0.5]);
  const rightLeg = new THREE.NumberKeyframeTrack('RightLeg.rotation[x]', times, [-0.5, 0.5,-0.5, 0.5,-0.5]);
  const leftArm  = new THREE.NumberKeyframeTrack('LeftArm.rotation[x]',  times, [-0.4, 0.4,-0.4, 0.4,-0.4]);
  const rightArm = new THREE.NumberKeyframeTrack('RightArm.rotation[x]', times, [ 0.4,-0.4, 0.4,-0.4, 0.4]);
  const walkBodyY = new THREE.NumberKeyframeTrack('Body.position', times, [1.5, 1.46, 1.5, 1.46, 1.5]);
  const walk = new THREE.AnimationClip('Walk', 1, [leftLeg, rightLeg, leftArm, rightArm, walkBodyY]);

  // wave：右臂高举挥动 / wave: right arm raised waving
  const waveTimes = [0, 0.2, 0.4, 0.6, 0.8, 1];
  const waveArm = new THREE.NumberKeyframeTrack('RightArm.rotation[z]', waveTimes, [-2.4, -2.1, -2.4, -2.1, -2.4, -2.1]);
  const wave = new THREE.AnimationClip('Wave', 1, [waveArm]);

  return { idle, walk, wave };
}

const clips = buildClips();
const mixer = new THREE.AnimationMixer(character);

const actions = {
  idle: mixer.clipAction(clips.idle),
  walk: mixer.clipAction(clips.walk),
  wave: mixer.clipAction(clips.wave),
};
Object.values(actions).forEach(a => a.setLoop(THREE.LoopRepeat, Infinity));

let current = actions.idle;
current.play();
actions.wave.setEffectiveWeight(0); // wave 默认权重 0，用于混合演示 / wave weight 0 for blend demo
actions.wave.play();

function switchTo(name, fade = 0.3) {
  const next = actions[name];
  if (next === current) return;
  current.fadeOut(fade);
  next.reset().fadeIn(fade).play();
  current = next;
}

// ---- GUI / Debug panel ----
const gui = new GUI();
const params = {
  fadeDuration: 0.3,
  playIdle: () => switchTo('idle', params.fadeDuration),
  playWalk: () => switchTo('walk', params.fadeDuration),
  waveBlend: 0.0,
  timeScale: 1.0,
  paused: false,
  scrub: 0,
};
gui.add(params, 'fadeDuration', 0, 1, 0.05).name('淡入时长 / Fade');
const actFolder = gui.addFolder('动作切换 / Actions');
actFolder.add(params, 'playIdle').name('▶ Idle');
actFolder.add(params, 'playWalk').name('▶ Walk');
actFolder.add(params, 'waveBlend', 0, 1, 0.05).name('挥手权重 / Wave Weight').onChange(v => actions.wave.setEffectiveWeight(v));
actFolder.open();
const mixFolder = gui.addFolder('混合器 / Mixer');
mixFolder.add(params, 'timeScale', 0, 2, 0.05).name('时间缩放 / TimeScale').onChange(v => mixer.timeScale = v);
mixFolder.add(params, 'paused').name('暂停 / Paused').onChange(v => { Object.values(actions).forEach(a => a.paused = v); });
mixFolder.open();

// 监听循环事件 / Listen for loop events
mixer.addEventListener('loop', (e) => { /* 可用于触发脚步声 / useful for footstep sounds */ });

// ---- 状态显示 / Status display ----
const tEl = document.getElementById('t');
const aEl = document.getElementById('a');
const wEl = document.getElementById('w');

// ---- 渲染循环 / Render loop ----
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const delta = Math.min(clock.getDelta(), 0.1);
  mixer.update(delta);
  controls.update();
  // 更新状态 / update status
  tEl.textContent = mixer.time.toFixed(2);
  aEl.textContent = current === actions.idle ? 'Idle' : current === actions.walk ? 'Walk' : 'Wave';
  wEl.textContent = actions.wave.getEffectiveWeight().toFixed(2);
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
