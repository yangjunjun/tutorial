<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{Title} / {English Title}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: #e0e0e0; background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 360px;
      pointer-events: none;
    }
    #info b { color: #7fd1ff; }
    a { color: #7fd1ff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="info">
    <b>{Title}</b><br />
    {Short description CN} / {Short description EN}
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    // ---- 场景 / Scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // ---- 相机 / Camera ----
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(5, 4, 8);

    // ---- 渲染器 / Renderer ----
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('app').appendChild(renderer.domElement);

    // ---- 控制器 / Controls ----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ---- 灯光 / Lights ----
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 10, 7);
    dir.castShadow = true;
    scene.add(dir);

    // ---- 网格辅助 / Grid helper ----
    const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
    scene.add(grid);

    // ====== 核心示例代码 / Core example code ======
    // {Replace with the lesson's specific demo}

    // ---- GUI 调试面板 / Debug panel ----
    const gui = new GUI();
    // gui.add(params, 'key');

    // ---- 渲染循环 / Render loop ----
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
    });

    // ---- 自适应 / Resize ----
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
