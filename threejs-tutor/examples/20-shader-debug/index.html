<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shader 调试 / Shader Debugging</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:system-ui,sans-serif}
#app{width:100vw;height:100vh}
#info{position:absolute;top:12px;left:12px;z-index:10;color:#e0e0e0;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;max-width:420px;pointer-events:none}
#info b{color:#7fd1ff}
#channel{position:absolute;bottom:12px;left:12px;z-index:10;color:#cfe6ff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;font-family:ui-monospace,monospace}
</style>
</head><body><div id="app"></div>
<div id="info"><b>Shader 调试 / Shader Debugging</b><br/>
噪声地形试验场。切换调试通道，把法线/UV/深度/位置/高度映射成颜色观察。<br/>
Noise-terrain testbed. Switch debug channels to see normals/UV/depth/position/height as color.</div>
<div id="channel">DEBUG = final</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c16);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 2.0, 2.6);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ── 噪声地形 Shader / noise terrain shader ─────────────────
const vertexShader = /* glsl */`
  varying vec3 vNormal;
  varying vec2 vUv;
  varying vec3 vWorldPos;
  varying vec3 vViewPos;
  varying float vHeight;
  uniform float uTime;
  uniform float uAmp;

  // hash + value noise
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p); vec2 f = fract(p);
    float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }

  void main() {
    vUv = uv;
    // 高度 / height
    float h = vnoise(uv * 4.0 + uTime * 0.1) * uAmp;
    h += vnoise(uv * 9.0) * uAmp * 0.4;
    vHeight = h;
    vec3 p = position;
    p.y += h;
    // 法线：用相邻采样差分 / normal via finite differences
    float e = 0.01;
    float hx = vnoise((uv+vec2(e,0.0)) * 4.0 + uTime*0.1) * uAmp;
    float hy = vnoise((uv+vec2(0.0,e)) * 4.0 + uTime*0.1) * uAmp;
    vec3 n = normalize(vec3(h - hx, e, h - hy));
    vNormal = normalize(mat3(modelMatrix) * n);
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vWorldPos = wp.xyz;
    vViewPos = (viewMatrix * wp).xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const fragmentShader = /* glsl */`
  precision highp float;
  varying vec3 vNormal;
  varying vec2 vUv;
  varying vec3 vWorldPos;
  varying vec3 vViewPos;
  varying float vHeight;
  uniform int uDebug;        // 0:final 1:normal 2:uv 3:depth 4:position 5:height 6:dbgRed
  uniform vec3 uLightDir;

  void main() {
    vec3 N = normalize(vNormal);
    vec3 c;
    if (uDebug == 0) {
      // 真实效果：兰伯特 + 高度色 / final: lambert + height tint
      float diff = max(dot(N, normalize(uLightDir)), 0.0);
      vec3 base = mix(vec3(0.15,0.35,0.12), vec3(0.9,0.8,0.6), smoothstep(-0.1,0.3,vHeight));
      c = base * (0.3 + 0.7 * diff);
    } else if (uDebug == 1) {
      c = N * 0.5 + 0.5;                         // 法线 / normal
    } else if (uDebug == 2) {
      c = vec3(vUv, 0.0);                        // UV
    } else if (uDebug == 3) {
      c = vec3(gl_FragCoord.z * 6.0);            // 深度放大 / depth scaled
    } else if (uDebug == 4) {
      c = vWorldPos * 0.4 + 0.5;                 // 位置 / position
    } else if (uDebug == 5) {
      c = vec3(vHeight * 1.5 + 0.5);             // 高度灰度 / height gray
    } else {
      c = vec3(vHeight, 0.0, 0.0);               // 单通道红 / red channel
    }
    gl_FragColor = vec4(c, 1.0);
  }
`;

const uniforms = {
  uTime:    { value: 0 },
  uAmp:     { value: 0.4 },
  uDebug:   { value: 0 },
  uLightDir:{ value: new THREE.Vector3(0.6, 1.0, 0.4) },
};
const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });

const geo = new THREE.PlaneGeometry(3, 3, 120, 120);
const mesh = new THREE.Mesh(geo, mat);
mesh.rotation.x = -Math.PI / 2;
scene.add(mesh);

const grid = new THREE.GridHelper(8, 16, 0x2a2a44, 0x1a1a30);
scene.add(grid);

// ── GUI ────────────────────────────────────────────────────
const gui = new GUI();
const params = {
  debug: 0,
  amp: 0.4,
  speed: 0.6,
  lightX: 0.6,
  lightY: 1.0,
  wire: false,
};
const dbgMap = {
  '0 真实效果 Final': 0,
  '1 法线 Normal': 1,
  '2 UV': 2,
  '3 深度 Depth': 3,
  '4 位置 Position': 4,
  '5 高度 Height': 5,
  '6 红通道 RedOnly': 6,
};
const chEl = document.getElementById('channel');
const modeDesc = [
  'final  → Lambert 光照 + 高度着色',
  'normal → N*0.5+0.5  (+X红 +Y绿 +Z蓝)',
  'uv     → vUv 直接显示 (红=x 绿=y)',
  'depth  → gl_FragCoord.z 放大6×',
  'position→ worldPos 映射',
  'height → vHeight 灰度',
  'redOnly→ 只看高度的红通道',
];
gui.add(params, 'debug', dbgMap).name('调试通道 Channel').onChange(v => {
  uniforms.uDebug.value = Number(v);
  chEl.textContent = 'DEBUG = ' + modeDesc[Number(v)];
});
chEl.textContent = 'DEBUG = ' + modeDesc[0];
gui.add(params, 'amp', 0, 0.8, 0.01).name('振幅 Amp').onChange(v => uniforms.uAmp.value = v);
gui.add(params, 'speed', 0, 3, 0.01).name('速度 Speed');
gui.add(params, 'lightX', -1, 1, 0.01).name('光向X').onChange(v => uniforms.uLightDir.value.x = v);
gui.add(params, 'lightY', 0, 2, 0.01).name('光向Y').onChange(v => uniforms.uLightDir.value.y = v);
gui.add(params, 'wire', false).name('线框 Wireframe').onChange(v => mat.wireframe = v);

// 等值线提示 / contour hint
const hintEl = document.getElementById('channel');

// ── 渲染循环 / Render loop ─────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  uniforms.uTime.value = clock.getElapsedTime() * params.speed;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script></body></html>
