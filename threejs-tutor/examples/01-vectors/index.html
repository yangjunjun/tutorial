<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>坐标和向量 / Coordinates &amp; Vectors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:system-ui,sans-serif}
#app{width:100vw;height:100vh}
#info{position:absolute;top:12px;left:12px;z-index:10;color:#e0e0e0;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;max-width:400px;pointer-events:none}
#info b{color:#7fd1ff}
#info span{color:#ffd17f}
#hint{position:absolute;bottom:12px;left:12px;z-index:10;color:#aaa;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:6px;font-size:12px}
.lil-gui{--background-color:#1f2440;--text-color:#e0e0e0;--title-background-color:#2a3050}
</style>
</head>
<body>
<div id="app"></div>
<div id="info">
  <b>坐标和向量 / Coordinates &amp; Vectors</b><br/>
  小球在两点间匀速往返，箭头显示速度方向。 / A sphere moves between two points at constant speed; arrows show velocity &amp; direction.<br/>
  <span>点击地面投影标记 / Click ground to project a marker.</span><br/>
  <span id="dotInfo">点积 dot = — / dot = —</span>
</div>
<div id="hint">拖拽旋转视角 / Drag to orbit · 滚轮缩放 / Scroll to zoom</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ---- 场景 / Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 18, 40);

// ---- 相机 / Camera ----
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(6, 5, 9);

// ---- 渲染器 / Renderer ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

// ---- 控制器 / Controls ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

// ---- 灯光 / Lights ----
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(6, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = -12;
dirLight.shadow.camera.right = 12;
dirLight.shadow.camera.top = 12;
dirLight.shadow.camera.bottom = -12;
scene.add(dirLight);

// ---- 网格地面 / Grid ground ----
const grid = new THREE.GridHelper(20, 20, 0x4488ff, 0x2a3a5a);
scene.add(grid);
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x12142a, roughness: 0.95, metalness: 0.05 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

// ====== 核心示例 / Core demo ======

// 端点 A、B / endpoints
const A = new THREE.Vector3(-3, 0.5, 0);
const B = new THREE.Vector3(3, 0.5, 0);

// 端点标记球 / endpoint markers
const endpointMat = new THREE.MeshStandardMaterial({ color: 0xff5577, emissive: 0x331018 });
const sphereGeo = new THREE.SphereGeometry(0.18, 24, 16);
const markerA = new THREE.Mesh(sphereGeo, endpointMat);
markerA.position.copy(A);
const markerB = new THREE.Mesh(sphereGeo, endpointMat);
markerB.position.copy(B);
markerA.castShadow = markerB.castShadow = true;
scene.add(markerA, markerB);

// 移动的小球 / moving sphere
const mover = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 32, 24),
  new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x113355, roughness: 0.35, metalness: 0.2 })
);
mover.castShadow = true;
scene.add(mover);

// 连线 A-B / connecting line
const lineMat = new THREE.LineBasicMaterial({ color: 0x445577 });
const lineGeo = new THREE.BufferGeometry().setFromPoints([A, B]);
const abLine = new THREE.Line(lineGeo, lineMat);
scene.add(abLine);

// 速度箭头 / velocity arrow (yellow)
const velArrow = new THREE.ArrowHelper(
  new THREE.Vector3(1, 0, 0), A.clone(), 1.2, 0xffd17f, 0.28, 0.14
);
scene.add(velArrow);

// 方向箭头(单位向量) / direction arrow (cyan)
const dirArrow = new THREE.ArrowHelper(
  new THREE.Vector3(1, 0, 0), A.clone(), 1.6, 0x7fd1ff, 0.25, 0.12
);
scene.add(dirArrow);

// 点积可视化：forward 向量 / forward vector
const forwardVec = new THREE.Vector3(1, 0, 0); // B 方向 / toward B
const forwardArrow = new THREE.ArrowHelper(forwardVec, B.clone(), 1.4, 0x55ff88, 0.25, 0.12);
scene.add(forwardArrow);

// 叉积可视化：forward × up = right / cross product visualization
const upVec = new THREE.Vector3(0, 1, 0);
const rightVec = new THREE.Vector3().crossVectors(forwardVec, upVec).normalize();
const rightArrow = new THREE.ArrowHelper(rightVec, B.clone(), 1.2, 0xff77ff, 0.22, 0.11);
scene.add(rightArrow);
rightArrow.visible = false; // 默认隐藏 / hidden by default

// 叉积第二个向量 up / up vector
const upArrow = new THREE.ArrowHelper(upVec, B.clone(), 1.2, 0x77aaff, 0.22, 0.11);
scene.add(upArrow);
upArrow.visible = false;

// 点击投影标记 / click projection marker
const clickMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xffd17f, emissive: 0x553300 })
);
clickMarker.castShadow = true;
clickMarker.visible = false;
scene.add(clickMarker);

// 投影线：从相机到点击点 / projection line from camera origin area to hit
const projLineMat = new THREE.LineDashedMaterial({ color: 0xffd17f, dashSize: 0.2, gapSize: 0.12 });
const projLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const projLine = new THREE.Line(projLineGeo, projLineMat);
projLine.visible = false;
scene.add(projLine);

// 射线投射 / raycaster
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return; // 仅左键 / left button only
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
    clickMarker.position.copy(hitPoint);
    clickMarker.position.y = 0.22;
    clickMarker.visible = true;

    // 画一条从相机附近到交点的投影线 / draw projection line
    const camGround = camera.position.clone();
    camGround.y = 0.22;
    projLineGeo.setFromPoints([camGround, clickMarker.position.clone()]);
    projLine.computeLineDistances();
    projLine.visible = true;
  }
});

// ---- 参数 / Params ----
const params = {
  speed: 2.5,            // m/s
  showDirArrow: true,
  showVelArrow: true,
  showDot: true,
  showCross: false,      // 显示叉积向量 / show cross vectors
};

// 运动状态 / motion state
let moving = A.clone();
let direction = B.clone().sub(A).normalize(); // A→B

const dotInfoEl = document.getElementById('dotInfo');

// ---- GUI ----
const gui = new GUI();
gui.add(params, 'speed', 0.2, 6, 0.1).name('速度 speed');
gui.add(params, 'showDirArrow').name('方向箭头 direction').onChange(v => dirArrow.visible = v);
gui.add(params, 'showVelArrow').name('速度箭头 velocity').onChange(v => velArrow.visible = v);
gui.add(params, 'showDot').name('点积 forward');
gui.add(params, 'showCross').name('叉积 cross').onChange(v => {
  upArrow.visible = v; rightArrow.visible = v;
});

// ---- 渲染循环 / Render loop ----
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const delta = Math.min(clock.getDelta(), 0.05); // 防止切后台后大跳 / clamp delta
  const elapsed = clock.getElapsedTime();

  // 匀速运动：newPos = oldPos + unitDir × distance / uniform motion
  const distance = params.speed * delta;
  moving.add(direction.clone().multiplyScalar(distance));

  // 到达端点翻转方向 / flip at endpoints
  if (moving.distanceTo(B) < 0.08) {
    direction.negate();
  } else if (moving.distanceTo(A) < 0.08) {
    direction.negate();
  }

  mover.position.copy(moving);

  // 更新箭头位置与方向 / update arrows
  velArrow.position.copy(moving);
  velArrow.setDirection(direction);
  velArrow.setLength(Math.max(0.4, params.speed * 0.5), 0.28, 0.14);

  dirArrow.position.copy(moving);
  dirArrow.setDirection(direction);

  // 点积：判断小球相对于 B 的前后 / dot: front/back of B
  if (params.showDot) {
    const toMover = moving.clone().sub(B).normalize();
    const dot = forwardVec.dot(toMover);
    dotInfoEl.textContent = `点积 dot = ${dot.toFixed(3)}  ${dot > 0 ? '(B 前方 / front)' : '(B 后方 / behind)'}`;
    forwardArrow.visible = true;
    // 颜色随点积变化 / color by dot
    const c = dot > 0 ? 0x55ff88 : 0xff5577;
    forwardArrow.setColor(new THREE.Color(c));
  } else {
    forwardArrow.visible = false;
    dotInfoEl.textContent = '点积 dot = — (已关闭 / off)';
  }

  // 小球轻微上下浮动 / subtle bobbing
  mover.position.y = 0.5 + Math.sin(elapsed * 3) * 0.08;

  controls.update();
  renderer.render(scene, camera);
});

// ---- 自适应 / Resize ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body></html>
