# ============================================================
# GitHub Actions — 部署到 GitHub Pages
#
# 触发条件：推送到 main 分支时自动部署
# 前提：在仓库 Settings → Pages 中选择 "GitHub Actions" 作为 Source
# ============================================================

name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时触发
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# 权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制 — 同时只允许一个部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ========== 构建任务 ==========
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建项目
      - name: Build with Astro
        run: npm run build
        env:
          # 如果需要环境变量，在这里配置
          # PUBLIC_SITE_URL: https://username.github.io/repo-name
          NODE_ENV: production

      # 5. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ========== 部署任务 ==========
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
