# ============================================================
# Cloudflare Pages 配置 (Wrangler)
#
# 文档：https://developers.cloudflare.com/pages/configuration/
# ============================================================

# 项目名称
name = "my-astro-blog"

# 兼容性日期 — 确定 Workers 运行时的版本
compatibility_date = "2024-01-01"

# Pages 构建输出目录
pages_build_output_dir = "./dist"

# 可选：绑定 KV 命名空间（用于缓存或数据存储）
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-namespace-id"

# 可选：绑定 R2 存储桶（用于文件存储）
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-blog-assets"

# 可选：绑定 D1 数据库
# [[d1_databases]]
# binding = "DB"
# database_name = "my-blog-db"
# database_id = "your-database-id"

# 环境变量（生产环境）
# [vars]
# PUBLIC_SITE_URL = "https://my-astro-blog.pages.dev"
