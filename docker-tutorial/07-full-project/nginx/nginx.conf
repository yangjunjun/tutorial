# =============================================================================
# Nginx 反向代理配置
# =============================================================================
# 功能：
#   - 前端静态资源服务
#   - 后端 API 反向代理
#   - SSL/TLS 配置（预留证书路径）
#   - Gzip 压缩
#   - 安全响应头
#   - 缓存策略
#   - WebSocket 支持
# =============================================================================

# 工作进程数（auto = CPU 核心数）
worker_processes auto;

# 错误日志
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# 最大文件描述符
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ──────────────────────────────────────────────────────────────────────────
    # 基础配置
    # ──────────────────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    server_tokens off;  # 隐藏 Nginx 版本号

    # ──────────────────────────────────────────────────────────────────────────
    # Gzip 压缩
    # ──────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # ──────────────────────────────────────────────────────────────────────────
    # 上游服务定义
    # ──────────────────────────────────────────────────────────────────────────

    # 后端 API 服务（支持多实例负载均衡）
    upstream backend_api {
        least_conn;  # 最少连接数算法
        server backend:3000;
        # 扩容时可添加更多实例：
        # server backend:3001;
        # server backend:3002;
        keepalive 32;  # 保持长连接
    }

    # 前端服务
    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTP -> HTTPS 重定向（生产环境启用）
    # ──────────────────────────────────────────────────────────────────────────
    # 注意：开发环境可注释掉此 server 块，直接使用 80 端口
    # server {
    #     listen 80;
    #     server_name example.com www.example.com;
    #
    #     # ACME 验证路径（Let's Encrypt 证书申请）
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #
    #     # 其余请求重定向到 HTTPS
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }

    # ──────────────────────────────────────────────────────────────────────────
    # 主服务器配置（HTTP 模式 / 开发环境）
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;  # 匹配所有域名（开发环境）
        # 生产环境替换为：server_name example.com www.example.com;

        # ── SSL 配置（生产环境取消注释）──────────────────────────────────────
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        #
        # # SSL 安全配置
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;
        # ssl_session_tickets off;
        #
        # # HSTS（强制 HTTPS）
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── 安全响应头 ───────────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Content-Security-Policy（按需调整）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;

        # ── Nginx 健康检查端点 ───────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── 后端 API 反向代理 ────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # 代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            # 连接优化
            proxy_set_header Connection "";
            proxy_buffering off;

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 错误处理
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ── WebSocket 支持 ───────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;  # WebSocket 长连接超时 24 小时
        }

        # ── 前端静态资源（API 代理到前端容器）────────────────────────────────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 静态资源缓存（由前端 Nginx 处理，此处透传）
            proxy_cache_valid 200 5m;
        }

        # ── 静态资源直接缓存配置（如果由 Nginx 直接托管静态文件）─────────────
        # 注意：当前架构中静态文件由前端容器内的 Nginx 托管，
        # 如果需要在此处直接托管，取消以下注释：
        #
        # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        #     proxy_pass http://frontend_app;
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        #     access_log off;
        # }

        # ── 禁止访问隐藏文件 ────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── 自定义错误页面 ───────────────────────────────────────────────────
        error_page 404 /index.html;  # SPA 路由兼容
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 限流配置（防 DDoS / 暴力破解）
    # ──────────────────────────────────────────────────────────────────────────
    # 定义限流区域（在 http 块中声明）
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    #
    # 在 location 中使用：
    # location /api/ {
    #     limit_req zone=api_limit burst=20 nodelay;
    #     ...
    # }
}
