# =============================================================================
# 全栈应用 Docker Compose 配置（生产环境）
# =============================================================================
# 用法：
#   生产环境：docker compose --profile production up -d
#   开发环境：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# 网络定义（前后端隔离）
# ──────────────────────────────────────────────────────────────────────────────
networks:
  frontend-net:
    driver: bridge
    name: fullstack-frontend
  backend-net:
    driver: bridge
    name: fullstack-backend

# ──────────────────────────────────────────────────────────────────────────────
# 数据卷（持久化存储）
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
    name: fullstack-postgres-data
  redis-data:
    driver: local
    name: fullstack-redis-data
  nginx-logs:
    driver: local
    name: fullstack-nginx-logs

# ──────────────────────────────────────────────────────────────────────────────
# 服务定义
# ──────────────────────────────────────────────────────────────────────────────
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 数据库
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fullstack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fullstack_db}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    ports:
      - "${DB_EXPOSE_PORT:-127.0.0.1:5432}:5432"  # 仅本地访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-fullstack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - production
      - dev

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    profiles:
      - production
      - dev

  # ---------------------------------------------------------------------------
  # Node.js/Express 后端 API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: fullstack-backend:${IMAGE_TAG:-latest}
    container_name: fullstack-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fullstack_db}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET 环境变量}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    profiles:
      - production

  # ---------------------------------------------------------------------------
  # React 前端（多阶段构建，Nginx 托管静态资源）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_VERSION: ${IMAGE_TAG:-latest}
    image: fullstack-frontend:${IMAGE_TAG:-latest}
    container_name: fullstack-frontend
    restart: unless-stopped
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M
    profiles:
      - production

  # ---------------------------------------------------------------------------
  # Nginx 反向代理和 SSL 终端
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: fullstack-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # SSL 证书（生产环境）
      - nginx-logs:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    profiles:
      - production
