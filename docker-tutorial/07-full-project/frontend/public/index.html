<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="全栈应用 Docker 部署实战教程 - 前端演示" />
    <title>全栈应用 - Docker 部署演示</title>
    <style>
      /* 基础重置样式 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
        color: #333;
      }
      /* 加载动画（在 React 挂载前显示） */
      #loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #666;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0e0e0;
        border-top-color: #1a73e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>请启用 JavaScript 以运行本应用。</noscript>

    <!-- React 挂载点 -->
    <div id="root">
      <!-- React 渲染前的加载占位 -->
      <div id="loading">
        <div class="spinner"></div>
        <span>应用加载中...</span>
      </div>
    </div>
  </body>
</html>
