# Docker 网络架构示例：前后端分离部署
#
# 网络拓扑：
#
#   客户端 (浏览器)
#        │
#        ▼  宿主机端口 80/443
#   ┌─────────────────────────────────────────┐
#   │           frontend-network              │
#   │                                         │
#   │   ┌──────────┐                          │
#   │   │  Nginx   │ ← 反向代理 + 静态资源     │
#   │   │ (网关)    │                          │
#   │   └────┬─────┘                          │
#   └────────┼────────────────────────────────┘
#            │  (同时连接两个网络)
#   ┌────────┼────────────────────────────────┐
#   │        ▼    backend-network             │
#   │                                         │
#   │   ┌──────────┐    ┌──────────┐          │
#   │   │ Web App  │    │  Redis   │          │
#   │   │ (API)    │    │ (缓存)    │          │
#   │   └────┬─────┘    └──────────┘          │
#   │        │                                 │
#   │   ┌────┴─────┐                          │
#   │   │ PostgreSQL│                          │
#   │   │ (数据库)  │ ← 仅在后端网络，完全隔离  │
#   │   └──────────┘                          │
#   └─────────────────────────────────────────┘
#
# 启动命令：docker compose up -d
# 停止命令：docker compose down -v

# ============================================================
# 服务定义
# ============================================================

services:

  # ----------------------------------------------------------
  # Nginx 反向代理
  # 网络：frontend-network + backend-network
  # 作用：接收外部请求，转发到后端 Web 应用
  # ----------------------------------------------------------
  nginx:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: tutorial-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    networks:
      - frontend-network
      - backend-network
    depends_on:
      webapp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # Web 应用（API 服务）
  # 网络：backend-network
  # 作用：处理业务逻辑，访问数据库和缓存
  # ----------------------------------------------------------
  webapp:
    image: ${WEBAPP_IMAGE:-node:20-alpine}
    container_name: tutorial-webapp
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      NODE_ENV: ${APP_ENV:-production}
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-appuser}:${DB_PASSWORD:-apppass}@postgres:${DB_PORT:-5432}/${DB_NAME:-myapp}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
    volumes:
      - ./webapp:/app
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-3000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # PostgreSQL 数据库
  # 网络：backend-network（仅内部访问，不暴露端口到宿主机）
  # 作用：持久化存储业务数据
  # ----------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: tutorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-myapp}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    # 注意：没有 ports 映射，外部无法直接访问数据库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-myapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Redis 缓存
  # 网络：backend-network（仅内部访问）
  # 作用：会话缓存、队列、临时数据存储
  # ----------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: tutorial-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-128mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    # 注意：没有 ports 映射，外部无法直接访问 Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# ============================================================
# 网络定义
# ============================================================

networks:
  # 前端网络：面向外部用户
  # Nginx 在此网络上接收来自客户端的请求
  frontend-network:
    name: ${COMPOSE_PROJECT_NAME:-tutorial}-frontend
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  # 后端网络：面向内部服务
  # Web 应用、数据库、缓存在此网络内通信
  # Nginx 也连接到此网络，以便将请求转发给 Web 应用
  backend-network:
    name: ${COMPOSE_PROJECT_NAME:-tutorial}-backend
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

# ============================================================
# 数据卷定义
# ============================================================

volumes:
  # PostgreSQL 持久化数据
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-tutorial}-postgres-data
    driver: local

  # Redis 持久化数据
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-tutorial}-redis-data
    driver: local

  # Nginx 日志
  nginx-logs:
    name: ${COMPOSE_PROJECT_NAME:-tutorial}-nginx-logs
    driver: local
