# ============================================================
# Nginx 反向代理配置 - 博客系统生产环境
# ============================================================
#
# 功能：
#   - 反向代理：将外部请求转发到 Spring Boot 应用
#   - 负载均衡：支持多实例部署（upstream 配置）
#   - Gzip 压缩：减少传输体积，提高加载速度
#   - 限流防护：防止 API 被恶意调用
#   - 静态资源缓存：减少后端压力
#   - HTTPS 支持（可选，需配置 SSL 证书）
#   - 安全头：防止常见的 Web 攻击
#
# 使用方式：
#   此文件由 docker-compose.prod.yml 自动挂载到 Nginx 容器
#   路径：/etc/nginx/nginx.conf
#
# ============================================================

# 工作进程数（auto = CPU 核心数）
worker_processes auto;

# 错误日志路径和级别
error_log /var/log/nginx/error.log warn;

# PID 文件路径
pid /var/run/nginx.pid;

# ============================================================
# Events 模块
# ============================================================
events {
    # 每个工作进程的最大连接数
    worker_connections 1024;
    # 使用 epoll 事件模型（Linux 推荐）
    use epoll;
    # 允许一个工作进程同时处理多个请求
    multi_accept on;
}

# ============================================================
# HTTP 模块
# ============================================================
http {
    # 引入 MIME 类型映射文件
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==================== 日志格式 ====================

    # 自定义日志格式，包含更多有用信息
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    # 访问日志路径和格式
    access_log /var/log/nginx/access.log main;

    # ==================== 性能优化 ====================

    # 使用 sendfile 系统调用（零拷贝，提高文件传输效率）
    sendfile on;

    # 配合 sendfile 使用，避免 TCP 粘包
    tcp_nopush on;
    tcp_nodelay on;

    # 长连接超时时间（秒）
    keepalive_timeout 65;

    # MIME 类型哈希表大小
    types_hash_max_size 2048;

    # 允许的最大请求体大小（文件上传限制）
    client_max_body_size 20M;

    # 请求头缓冲区
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ==================== Gzip 压缩 ====================
    # 对文本类型的响应进行 Gzip 压缩，减少传输体积

    gzip on;
    # 添加 Vary: Accept-Encoding 响应头
    gzip_vary on;
    # 对所有代理的响应也进行压缩
    gzip_proxied any;
    # 压缩级别（1-9，越高压缩越好但 CPU 消耗越大）
    gzip_comp_level 6;
    # 小于 1KB 的响应不压缩（压缩收益太低）
    gzip_min_length 1024;
    # 需要压缩的 MIME 类型
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/json
        image/svg+xml;

    # ==================== 限流配置 ====================
    # 基于客户端 IP 地址进行限流

    # API 通用限流：每秒 30 个请求
    # zone=api_limit: 限流区域名称
    # 10m: 共享内存大小（约 16 万个 IP）
    # rate=30r/s: 每秒 30 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # 登录接口限流：每分钟 5 个请求（防暴力破解）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # 注册接口限流：每分钟 3 个请求
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;

    # 限流返回的状态码
    limit_req_status 429;

    # ==================== 安全头 ====================
    # 添加通用的安全响应头（通过 map 实现）

    # ==================== 上游服务定义 ====================
    # Spring Boot 应用后端

    upstream blog_backend {
        # 博客应用的容器地址和端口
        server blog-app:8080;

        # 如果有多个应用实例，可以添加更多 server 行实现负载均衡：
        # server blog-app-2:8080;
        # server blog-app-3:8080;

        # 长连接池（减少 TCP 握手开销）
        keepalive 32;
    }

    # ==================== HTTP 服务 ====================
    server {
        # 监听 80 端口
        listen 80;
        # 域名配置（部署时修改为实际域名）
        server_name your-domain.com www.your-domain.com localhost;

        # ---- 通用安全头 ----
        # 防止点击劫持
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 防止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;
        # 启用 XSS 过滤
        add_header X-XSS-Protection "1; mode=block" always;
        # 隐藏 Nginx 版本号
        server_tokens off;

        # ---- API 请求代理 ----
        # 将所有 /api/ 开头的请求转发到 Spring Boot 应用
        location /api/ {
            # 应用 API 限流
            limit_req zone=api_limit burst=20 nodelay;

            # 转发到上游服务
            proxy_pass http://blog_backend;

            # 传递真实客户端信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 使用 HTTP/1.1 协议（支持长连接）
            proxy_http_version 1.1;
            # 清除 Connection 头（启用长连接）
            proxy_set_header Connection "";

            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 代理缓冲区配置
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
        }

        # ---- 登录接口（额外限流）----
        # 单独为登录接口设置更严格的限流策略
        location = /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://blog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---- 注册接口（额外限流）----
        location = /api/auth/register {
            limit_req zone=register_limit burst=2 nodelay;

            proxy_pass http://blog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---- 上传文件访问 ----
        # 为上传的文件设置较长的缓存时间
        location /uploads/ {
            proxy_pass http://blog_backend;
            proxy_set_header Host $host;

            # 静态资源缓存 7 天
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---- 健康检查端点 ----
        # 不限流，用于 Docker 健康检查和负载均衡器探测
        location = /actuator/health {
            proxy_pass http://blog_backend;
            proxy_set_header Host $host;
            # 不记录健康检查日志（减少日志噪音）
            access_log off;
        }

        # ---- 根路径 ----
        # 可以返回一个简单的欢迎页面或重定向
        location = / {
            # 如果部署了前端应用，可以指向前端静态文件
            # root /usr/share/nginx/html;
            # try_files $uri $uri/ /index.html;

            # 或者重定向到 API 文档
            proxy_pass http://blog_backend;
            proxy_set_header Host $host;
        }

        # ---- 禁止访问隐藏文件 ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---- 错误页面 ----
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ==================== HTTPS 服务（可选） ====================
    # 如需启用 HTTPS，取消下面的注释并配置 SSL 证书
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com www.your-domain.com;
    #
    #     # SSL 证书配置
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     # SSL 协议和加密套件（安全配置）
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS（强制浏览器使用 HTTPS）
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... 与上面 HTTP server 相同的 location 配置 ...
    # }
    #
    # # HTTP 到 HTTPS 重定向
    # server {
    #     listen 80;
    #     server_name your-domain.com www.your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
