# ============================================================
# 生产环境配置 - Spring Boot 博客系统
# ============================================================
#
# 激活方式：
#   - 环境变量：SPRING_PROFILES_ACTIVE=prod
#   - 启动参数：--spring.profiles.active=prod
#
# 设计原则：
#   1. 所有敏感信息通过环境变量注入，不硬编码
#   2. 性能参数经过生产环境调优
#   3. 日志级别适当收紧，避免磁盘写满
#   4. 安全配置加固
#
# 环境变量命名约定：
#   Spring Boot 自动将 SPRING_DATASOURCE_URL 映射到 spring.datasource.url
#   规则：全大写 + 下划线分隔 + SPRING_ 前缀
#
# ============================================================

# ==================== 服务器配置 ====================
server:
  port: 8080
  # Tomcat 线程池配置
  tomcat:
    # 最大工作线程数
    max-threads: 200
    # 最小空闲线程数
    min-spare-threads: 20
    # 最大连接数
    max-connections: 10000
    # 等待队列长度
    accept-count: 100
    # URI 编码
    uri-encoding: UTF-8
  # 优雅停机：收到关闭信号后等待请求完成
  shutdown: graceful

# ==================== Spring 核心配置 ====================
spring:

  # ---------- 数据源配置（Druid 连接池）----------
  datasource:
    # 以下三个关键变量从环境变量读取
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid 连接池参数
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 50
      # 获取连接最大等待时间（毫秒）
      max-wait: 60000
      # 检测空闲连接的间隔时间（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接最小空闲时间（毫秒），超过则回收
      min-evictable-idle-time-millis: 300000
      # 连接有效性检测 SQL
      validation-query: SELECT 1
      # 空闲时检测连接有效性
      test-while-idle: true
      # 获取连接时不检测（提升性能）
      test-on-borrow: false
      # 归还连接时不检测
      test-on-return: false
      # 开启 PreparedStatement 缓存
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # Druid 监控（生产环境可关闭或限制访问）
      filters: stat,wall
      stat-view-servlet:
        enabled: false  # 生产环境关闭 Druid 监控页面
      web-stat-filter:
        enabled: false

  # ---------- Redis 配置 ----------
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      # 数据库编号（0-15）
      database: 0
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 20
          # 最大空闲连接数
          max-idle: 10
          # 最小空闲连接数
          min-idle: 5
          # 获取连接最大等待时间
          max-wait: 3000ms
        # 关闭超时时间
        shutdown-timeout: 200ms
      # 连接超时
      timeout: 3000ms

  # ---------- Jackson JSON 配置 ----------
  jackson:
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: Asia/Shanghai
    serialization:
      # 不使用时间戳格式
      write-dates-as-timestamps: false
      # 空值不序列化
      write-null-map-values: false
    deserialization:
      # 忽略未知属性
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # ---------- 文件上传配置 ----------
  servlet:
    multipart:
      # 单个文件最大 10MB
      max-file-size: 10MB
      # 单次请求最大 20MB
      max-request-size: 20MB
      # 临时文件目录
      file-size-threshold: 2MB

  # ---------- 优雅停机 ----------
  lifecycle:
    # 等待请求完成的最大时间
    timeout-per-shutdown-phase: 30s

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  configuration:
    # 数据库下划线命名自动映射为 Java 驼峰命名
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志输出（减少 I/O 开销）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 关闭一级缓存（避免脏读问题，分布式环境下更安全）
    local-cache-scope: statement
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 关闭 Banner 打印
    banner: false

# ==================== JWT 配置 ====================
jwt:
  # 密钥从环境变量读取（生产环境必须设置强密钥）
  secret: ${JWT_SECRET}
  # Token 过期时间（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}

# ==================== 文件存储配置 ====================
file:
  # 上传文件存储目录（映射到 Docker 数据卷）
  upload-dir: /app/uploads
  # 文件访问路径前缀
  access-prefix: /uploads/
  # 允许的文件类型
  allowed-types: jpg,jpeg,png,gif,webp,pdf,doc,docx
  # 单个文件最大大小（与 spring.servlet.multipart 保持一致）
  max-size: 10485760

# ==================== Spring Security 配置 ====================
security:
  # CORS 配置
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# ==================== Spring Actuator（健康检查和监控）====================
management:
  endpoints:
    web:
      exposure:
        # 仅暴露必要的端点（安全考虑）
        include: health,info
  endpoint:
    health:
      # 显示详细健康信息
      show-details: when-authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    # 根日志级别
    root: WARN
    # 应用代码日志级别
    com.example.blog: INFO
    # Spring Security（生产环境收紧）
    org.springframework.security: WARN
    # MyBatis（生产环境关闭）
    com.baomidou.mybatisplus: WARN
    # Druid 连接池
    com.alibaba.druid: WARN
    # Hibernate（如果有）
    org.hibernate: WARN
    # Tomcat
    org.apache.catalina: WARN
    # Spring 框架
    org.springframework: WARN
  # 日志文件配置
  file:
    name: /app/logs/blog-app.log
  logback:
    rollingpolicy:
      # 单个日志文件最大 50MB
      max-file-size: 50MB
      # 保留最近 30 天的日志
      max-history: 30
      # 所有日志文件总大小不超过 1GB
      total-size-cap: 1GB
  # 日志模式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{50} - %msg%n"
