# ============================================
# Spring Boot 应用基础配置
# ============================================
# 配置文件格式为 YAML，使用缩进表示层级关系
# 注意：缩进只能使用空格，不能使用 Tab 键
# ============================================

spring:
  application:
    # 应用名称
    # - 会在启动日志中显示
    # - 在微服务架构中用于服务注册与发现
    # - 建议与 artifactId 保持一致
    name: blog-api

# ============================================
# 服务器配置
# ============================================
server:
  # 应用监听端口
  # - 默认值为 8080
  # - 如果端口被占用，可以修改为其他端口（如 8081, 9090 等）
  # - 也可以通过命令行参数覆盖：java -jar app.jar --server.port=9090
  port: 8080
