<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 / Contact - MyPortfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">首页 Home</a></li>
                <li><a href="about.html">关于 About</a></li>
                <li><a href="contact.html">联系 Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-section">
            <h2>联系我 / Contact Me</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">姓名 / Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱 / Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">留言 / Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">发送 Send</button>
            </form>
            <div class="social-links">
                <h3>社交媒体 / Social Media</h3>
                <p>GitHub: <a href="#">github.com/xiaoming</a></p>
                <p>LinkedIn: <a href="#">linkedin.com/in/xiaoming</a></p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 MyPortfolio. All rights reserved.</p>
    </footer>
</body>
</html>
