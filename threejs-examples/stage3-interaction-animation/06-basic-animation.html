<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基础动画 / Basic Animation - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: none; min-width: 260px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #ce93d8; }
    #info .time { color: #aaa; font-size: 12px; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
    #info .obj { margin-top: 2px; font-size: 12px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>基础动画 / Basic Animation</h2>
    <div class="obj">立方体旋转 / Cube: Rotating on all axes</div>
    <div class="obj">球体弹跳 / Sphere: Bouncing (sin wave)</div>
    <div class="obj">圆环公转 / Torus: Orbiting (cos/sin)</div>
    <div class="obj">圆柱脉冲 / Cylinder: Pulsing scale</div>
    <div class="time" id="timeInfo">
      deltaTime: --<br>elapsed: --
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(8, 6, 10);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ===== 轨道控制器 / OrbitControls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // ===== 灯光 / Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ===== 地面 / Ground =====
    scene.add(new THREE.GridHelper(20, 20, 0x444466, 0x222244));

    // ===== 创建立方体 - 旋转动画 / Create cube - rotation animation =====
    // 绕所有轴持续旋转 / Continuously rotate on all axes
    const cubeGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.3, metalness: 0.4 });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.set(-4, 1.5, 0);
    cube.castShadow = true;
    scene.add(cube);

    // ===== 创建球体 - 弹跳动画 / Create sphere - bounce animation =====
    // 使用sin波上下弹跳 / Bounce up and down using sin wave
    const sphereGeo = new THREE.SphereGeometry(0.7, 32, 32);
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.25, metalness: 0.5 });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.set(-1.5, 1.5, 0);
    sphere.castShadow = true;
    scene.add(sphere);

    // ===== 创建圆环 - 公转动画 / Create torus - orbit animation =====
    // 沿圆形路径公转 / Orbit along a circular path
    const torusGeo = new THREE.TorusGeometry(0.5, 0.2, 16, 48);
    const torusMat = new THREE.MeshStandardMaterial({ color: 0xffe66d, roughness: 0.3, metalness: 0.3 });
    const torus = new THREE.Mesh(torusGeo, torusMat);
    torus.position.set(2, 1.5, 0);
    torus.castShadow = true;
    scene.add(torus);
    // 公转半径 / Orbit radius
    const orbitRadius = 2;
    const orbitCenterX = 2;
    const orbitCenterZ = 0;

    // ===== 创建圆柱 - 脉冲缩放动画 / Create cylinder - pulse scale animation =====
    // 周期性地放大缩小 / Periodically grow and shrink
    const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16);
    const cylMat = new THREE.MeshStandardMaterial({ color: 0xa8e6cf, roughness: 0.3, metalness: 0.3 });
    const cylinder = new THREE.Mesh(cylGeo, cylMat);
    cylinder.position.set(5.5, 1, 0);
    cylinder.castShadow = true;
    scene.add(cylinder);

    // ===== 标签精灵 / Label sprites =====
    function createLabel(text, position) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.roundRect(0, 0, 256, 64, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 40);
      const tex = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.copy(position);
      sprite.position.y += 2;
      sprite.scale.set(2.5, 0.625, 1);
      scene.add(sprite);
    }
    createLabel('旋转 / Rotate', cube.position);
    createLabel('弹跳 / Bounce', sphere.position);
    createLabel('公转 / Orbit', new THREE.Vector3(orbitCenterX, 0, orbitCenterZ));
    createLabel('脉冲 / Pulse', cylinder.position);

    // ===== THREE.Clock 用于帧率无关动画 / THREE.Clock for frame-rate independent animation =====
    const clock = new THREE.Clock();
    const timeInfo = document.getElementById('timeInfo');

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);

      // getDelta() 返回自上次调用以来的秒数 / getDelta() returns seconds since last call
      const delta = clock.getDelta();
      // getElapsedTime() 返回时钟启动以来的总秒数 / getElapsedTime() returns total seconds since clock start
      const elapsed = clock.getElapsedTime();

      // --- 立方体旋转（帧率无关）/ Cube rotation (frame-rate independent) ---
      // 使用 elapsed 确保动画速度一致 / Use elapsed to ensure consistent animation speed
      cube.rotation.x = elapsed * 0.8;
      cube.rotation.y = elapsed * 1.2;
      cube.rotation.z = elapsed * 0.5;

      // --- 球体弹跳（sin波）/ Sphere bounce (sin wave) ---
      // sin(elapsed * speed) * amplitude + baseHeight
      sphere.position.y = Math.abs(Math.sin(elapsed * 2.5)) * 2.5 + 0.7;
      // 轻微挤压效果 / Slight squash effect
      const squash = 1 - Math.abs(Math.sin(elapsed * 2.5)) * 0.15;
      sphere.scale.set(1 + (1 - squash) * 0.5, squash, 1 + (1 - squash) * 0.5);

      // --- 圆环公转（cos/sin路径）/ Torus orbit (cos/sin path) ---
      torus.position.x = orbitCenterX + Math.cos(elapsed * 1.5) * orbitRadius;
      torus.position.z = orbitCenterZ + Math.sin(elapsed * 1.5) * orbitRadius;
      torus.position.y = 1.5 + Math.sin(elapsed * 3) * 0.3; // 轻微波动 / Slight wobble
      torus.rotation.x = elapsed * 2;
      torus.rotation.y = elapsed * 1.5;

      // --- 圆柱脉冲缩放 / Cylinder pulse scale ---
      // 使用 sin 在0.7到1.3之间脉冲 / Pulse between 0.7 and 1.3 using sin
      const pulseScale = 1 + Math.sin(elapsed * 3) * 0.3;
      cylinder.scale.set(pulseScale, 1 + Math.sin(elapsed * 2) * 0.2, pulseScale);
      cylinder.rotation.y = elapsed * 0.5;

      // 更新时间信息 / Update time info
      timeInfo.innerHTML =
        `deltaTime: ${delta.toFixed(4)}s<br>` +
        `elapsed: ${elapsed.toFixed(2)}s<br>` +
        `FPS: ${(1 / delta).toFixed(0)}`;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
