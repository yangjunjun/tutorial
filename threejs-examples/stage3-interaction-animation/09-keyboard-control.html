<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>键盘控制 / Keyboard Control - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: none; min-width: 240px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #80cbc4; }
    #info kbd {
      background: #333; padding: 1px 6px; border-radius: 3px;
      border: 1px solid #555; font-size: 12px;
    }
    #info .keys { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
    #info .keys span {
      display: inline-block; width: 28px; height: 28px;
      text-align: center; line-height: 28px; margin: 2px;
      background: #333; border: 1px solid #555; border-radius: 4px;
      font-size: 11px; transition: background 0.1s;
    }
    #info .keys span.pressed { background: #4caf50; border-color: #81c784; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>键盘控制 / Keyboard Control</h2>
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 移动</div>
    <div><kbd>Space</kbd> 跳跃 / Jump</div>
    <div><kbd>Shift</kbd> 加速 / Sprint</div>
    <div class="keys" id="keyDisplay">
      <div style="text-align:center">
        <span id="keyW">W</span>
      </div>
      <div>
        <span id="keyA">A</span>
        <span id="keyS">S</span>
        <span id="keyD">D</span>
        <span id="keySpace" style="width:60px">Space</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2a1a);
    scene.fog = new THREE.FogExp2(0x1a2a1a, 0.015);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ===== 灯光 / Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    scene.add(dirLight);

    // ===== 地面 / Ground =====
    scene.add(new THREE.GridHelper(60, 60, 0x446644, 0x224422));
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2a1a, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // ===== 场景装饰物 / Scene decorations =====
    const decoColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0x82b1ff, 0xb39ddb];
    for (let i = 0; i < 40; i++) {
      const geo = Math.random() > 0.5
        ? new THREE.BoxGeometry(0.8 + Math.random(), 0.8 + Math.random() * 2, 0.8 + Math.random())
        : new THREE.CylinderGeometry(0.3 + Math.random() * 0.5, 0.3 + Math.random() * 0.5, 1 + Math.random() * 2, 8);
      const mat = new THREE.MeshStandardMaterial({
        color: decoColors[Math.floor(Math.random() * decoColors.length)],
        roughness: 0.4, metalness: 0.3
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 50,
        geo.parameters ? (geo.parameters.height || 1) / 2 : 0.5,
        (Math.random() - 0.5) * 50
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    // ===== 玩家角色（胶囊体）/ Player character (capsule) =====
    const playerGroup = new THREE.Group();

    // 身体 / Body
    const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.8, 8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.3, metalness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.0;
    body.castShadow = true;
    playerGroup.add(body);

    // 头部（小球）/ Head (small sphere)
    const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.3, metalness: 0.4 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.9;
    head.castShadow = true;
    playerGroup.add(head);

    // 方向指示（前方小球）/ Direction indicator (small sphere in front)
    const dirGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const dirMat = new THREE.MeshStandardMaterial({ color: 0xff5252, emissive: 0xff5252, emissiveIntensity: 0.3 });
    const dirIndicator = new THREE.Mesh(dirGeo, dirMat);
    dirIndicator.position.set(0, 1.6, 0.45);
    playerGroup.add(dirIndicator);

    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // ===== 物理与控制参数 / Physics & control parameters =====
    const moveSpeed = 8;       // 移动速度 / Movement speed
    const sprintMult = 2.0;    // 加速倍率 / Sprint multiplier
    const acceleration = 25;   // 加速度 / Acceleration
    const deceleration = 15;   // 减速度 / Deceleration
    const gravity = -20;       // 重力 / Gravity
    const jumpForce = 8;       // 跳跃力 / Jump force

    // 玩家状态 / Player state
    const velocity = new THREE.Vector3(0, 0, 0);
    let isOnGround = true;
    let facingAngle = 0; // 朝向角度 / Facing angle

    // ===== 键盘输入 / Keyboard input =====
    const keys = {};
    const keyDisplayElements = {
      w: document.getElementById('keyW'),
      a: document.getElementById('keyA'),
      s: document.getElementById('keyS'),
      d: document.getElementById('keyD'),
      space: document.getElementById('keySpace'),
    };

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      updateKeyDisplay();
    });
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      updateKeyDisplay();
    });

    // 更新按键显示 / Update key display
    function updateKeyDisplay() {
      keyDisplayElements.w.classList.toggle('pressed', !!(keys['KeyW'] || keys['ArrowUp']));
      keyDisplayElements.a.classList.toggle('pressed', !!(keys['KeyA'] || keys['ArrowLeft']));
      keyDisplayElements.s.classList.toggle('pressed', !!(keys['KeyS'] || keys['ArrowDown']));
      keyDisplayElements.d.classList.toggle('pressed', !!(keys['KeyD'] || keys['ArrowRight']));
      keyDisplayElements.space.classList.toggle('pressed', !!keys['Space']);
    }

    // ===== 相机跟随参数 / Camera follow parameters =====
    const cameraOffset = new THREE.Vector3(0, 6, 10);
    const cameraLookOffset = new THREE.Vector3(0, 1, 0);
    const cameraLerpSpeed = 5;

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05); // 限制最大delta / Cap max delta

      // --- 计算移动方向 / Calculate movement direction ---
      let inputX = 0, inputZ = 0;
      if (keys['KeyW'] || keys['ArrowUp'])    inputZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown'])  inputZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft'])  inputX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

      const hasInput = inputX !== 0 || inputZ !== 0;
      if (hasInput) {
        // 归一化方向 / Normalize direction
        const len = Math.sqrt(inputX * inputX + inputZ * inputZ);
        inputX /= len;
        inputZ /= len;
      }

      // 速度倍率（加速跑）/ Speed multiplier (sprint)
      const speedMult = keys['ShiftLeft'] || keys['ShiftRight'] ? sprintMult : 1.0;
      const targetSpeed = moveSpeed * speedMult;

      // --- 平滑加减速 / Smooth acceleration/deceleration ---
      if (hasInput) {
        velocity.x = THREE.MathUtils.lerp(velocity.x, inputX * targetSpeed, acceleration * delta / (acceleration * delta + 1));
        velocity.z = THREE.MathUtils.lerp(velocity.z, inputZ * targetSpeed, acceleration * delta / (acceleration * delta + 1));
        // 更新朝向 / Update facing direction
        facingAngle = Math.atan2(inputX, inputZ);
      } else {
        // 减速 / Decelerate
        velocity.x = THREE.MathUtils.lerp(velocity.x, 0, deceleration * delta / (deceleration * delta + 1));
        velocity.z = THREE.MathUtils.lerp(velocity.z, 0, deceleration * delta / (deceleration * delta + 1));
      }

      // --- 跳跃 / Jump ---
      if (keys['Space'] && isOnGround) {
        velocity.y = jumpForce;
        isOnGround = false;
      }

      // --- 重力 / Gravity ---
      if (!isOnGround) {
        velocity.y += gravity * delta;
      }

      // --- 更新位置 / Update position ---
      playerGroup.position.x += velocity.x * delta;
      playerGroup.position.z += velocity.z * delta;
      playerGroup.position.y += velocity.y * delta;

      // 地面碰撞 / Ground collision
      if (playerGroup.position.y <= 0) {
        playerGroup.position.y = 0;
        velocity.y = 0;
        isOnGround = true;
      }

      // 限制在场地内 / Constrain to arena
      playerGroup.position.x = Math.max(-28, Math.min(28, playerGroup.position.x));
      playerGroup.position.z = Math.max(-28, Math.min(28, playerGroup.position.z));

      // 平滑旋转朝向 / Smooth rotation towards facing direction
      const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), facingAngle);
      playerGroup.quaternion.slerp(targetQuat, 10 * delta);

      // --- 相机跟随 / Camera follow ---
      const idealPos = new THREE.Vector3().copy(playerGroup.position).add(cameraOffset);
      camera.position.lerp(idealPos, cameraLerpSpeed * delta);
      const lookTarget = new THREE.Vector3().copy(playerGroup.position).add(cameraLookOffset);
      camera.lookAt(lookTarget);

      // 灯光跟随玩家 / Light follows player
      dirLight.position.set(playerGroup.position.x + 10, 20, playerGroup.position.z + 10);
      dirLight.target.position.copy(playerGroup.position);
      dirLight.target.updateMatrixWorld();

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
