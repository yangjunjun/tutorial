<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轨道控制器 / OrbitControls - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    /* 信息面板 / Info panel */
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.72); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: auto; min-width: 230px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #4fc3f7; }
    #info label { display: flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 2px; }
    #info .state { color: #aaa; font-size: 12px; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>轨道控制器 / OrbitControls</h2>
    <div>鼠标左键旋转 / Left-drag: Rotate</div>
    <div>滚轮缩放 / Scroll: Zoom</div>
    <div>鼠标右键平移 / Right-drag: Pan</div>
    <hr style="border-color:#333;margin:8px 0" />
    <label><input type="checkbox" id="chkRotate" checked /> 旋转 / Rotate</label>
    <label><input type="checkbox" id="chkZoom" checked /> 缩放 / Zoom</label>
    <label><input type="checkbox" id="chkPan" checked /> 平移 / Pan</label>
    <label><input type="checkbox" id="chkDamping" checked /> 阻尼 / Damping</label>
    <div class="state" id="stateInfo">距离 / Distance: --</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    // 雾效增加深度感 / Fog for depth
    scene.fog = new THREE.FogExp2(0x1a1a2e, 0.025);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(8, 6, 10);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ===== 轨道控制器 / OrbitControls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;       // 惯性阻尼 / Inertia damping
    controls.dampingFactor = 0.08;       // 阻尼系数 / Damping factor
    controls.rotateSpeed = 0.7;          // 旋转速度 / Rotation speed
    controls.zoomSpeed = 1.0;            // 缩放速度 / Zoom speed
    controls.panSpeed = 0.8;             // 平移速度 / Pan speed
    controls.minDistance = 3;            // 最小距离 / Min zoom distance
    controls.maxDistance = 40;           // 最大距离 / Max zoom distance
    // 限制极角，防止摄像机进入地面以下 / Limit polar angle to prevent going below ground
    controls.minPolarAngle = 0.1;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // ===== 灯光 / Lights =====
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    // ===== 地面网格 / Ground grid =====
    const gridHelper = new THREE.GridHelper(30, 30, 0x444466, 0x222244);
    scene.add(gridHelper);
    // 地面 / Ground plane
    const groundGeo = new THREE.PlaneGeometry(30, 30);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== 创建彩色几何体 / Create colorful geometric objects =====
    const geometries = [
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.SphereGeometry(0.6, 32, 32),
      new THREE.ConeGeometry(0.5, 1.2, 16),
      new THREE.TorusGeometry(0.5, 0.2, 16, 48),
      new THREE.OctahedronGeometry(0.6),
      new THREE.DodecahedronGeometry(0.55),
      new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16),
      new THREE.TorusKnotGeometry(0.4, 0.15, 64, 8),
      new THREE.IcosahedronGeometry(0.55),
    ];
    const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8a80, 0x82b1ff, 0xb39ddb, 0xffab91, 0x80cbc4];

    // 在圆形排列中放置物体 / Place objects in a circular arrangement
    const objects = [];
    const count = geometries.length;
    geometries.forEach((geo, i) => {
      const mat = new THREE.MeshStandardMaterial({
        color: colors[i], roughness: 0.35, metalness: 0.3
      });
      const mesh = new THREE.Mesh(geo, mat);
      const angle = (i / count) * Math.PI * 2;
      const radius = 4.5;
      mesh.position.set(Math.cos(angle) * radius, 0.8, Math.sin(angle) * radius);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      objects.push(mesh);
    });

    // 中心装饰物 / Center piece
    const centerGeo = new THREE.TorusKnotGeometry(0.8, 0.28, 100, 16);
    const centerMat = new THREE.MeshStandardMaterial({ color: 0x7c4dff, roughness: 0.2, metalness: 0.7 });
    const centerMesh = new THREE.Mesh(centerGeo, centerMat);
    centerMesh.position.y = 2;
    centerMesh.castShadow = true;
    scene.add(centerMesh);

    // ===== UI 控件绑定 / UI controls binding =====
    const chkRotate = document.getElementById('chkRotate');
    const chkZoom = document.getElementById('chkZoom');
    const chkPan = document.getElementById('chkPan');
    const chkDamping = document.getElementById('chkDamping');
    const stateInfo = document.getElementById('stateInfo');

    chkRotate.addEventListener('change', e => controls.enableRotate = e.target.checked);
    chkZoom.addEventListener('change', e => controls.enableZoom = e.target.checked);
    chkPan.addEventListener('change', e => controls.enablePan = e.target.checked);
    chkDamping.addEventListener('change', e => controls.enableDamping = e.target.checked);

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);
      // 更新控制器（阻尼需要）/ Update controls (required for damping)
      controls.update();

      // 缓慢旋转中心物体 / Slowly rotate center piece
      centerMesh.rotation.y += 0.008;
      centerMesh.rotation.x += 0.004;

      // 轻微旋转所有物体 / Slight rotation for all objects
      objects.forEach(obj => { obj.rotation.y += 0.005; });

      // 更新状态信息 / Update state info
      const dist = camera.position.distanceTo(controls.target);
      stateInfo.textContent =
        `距离 / Distance: ${dist.toFixed(1)}\n` +
        `旋转 / Rotate: ${controls.enableRotate ? '✓' : '✗'}  ` +
        `缩放 / Zoom: ${controls.enableZoom ? '✓' : '✗'}\n` +
        `平移 / Pan: ${controls.enablePan ? '✓' : '✗'}  ` +
        `阻尼 / Damping: ${controls.enableDamping ? '✓' : '✗'}`;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
