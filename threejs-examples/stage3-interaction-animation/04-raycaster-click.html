<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>射线点击 / Raycaster Click Detection - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: none; min-width: 240px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #ffb74d; }
    #info .selected { color: #81c784; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>射线点击 / Raycaster Click</h2>
    <div>点击物体选中 / Click object to select</div>
    <div>点击空白取消 / Click empty to deselect</div>
    <div>拖拽旋转视角 / Drag to orbit</div>
    <div class="selected" id="selectedInfo">未选中 / Nothing selected</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(8, 8, 12);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ===== 轨道控制器 / OrbitControls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1, 0);

    // ===== 灯光 / Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ===== 地面 / Ground =====
    const gridHelper = new THREE.GridHelper(20, 20, 0x444466, 0x222244);
    scene.add(gridHelper);
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== 创建5x5网格的物体 / Create 5x5 grid of objects =====
    const objects = [];
    const gridSize = 5;
    const spacing = 2.5;
    const offset = ((gridSize - 1) * spacing) / 2;
    const colors = [
      0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8a80,
      0x82b1ff, 0xb39ddb, 0xffab91, 0x80cbc4, 0xce93d8,
      0xf48fb1, 0x90caf9, 0xa5d6a7, 0xfff59d, 0xffcc80,
      0xef9a9a, 0x80deea, 0xc5e1a5, 0xffe082, 0xbcaaa4,
      0xe6ee9c, 0x81d4fa, 0xf8bbd0, 0xb2dfdb, 0xd1c4e9
    ];
    const geoTypes = [
      new THREE.BoxGeometry(0.9, 0.9, 0.9),
      new THREE.SphereGeometry(0.55, 24, 24),
    ];

    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const idx = row * gridSize + col;
        const geo = geoTypes[idx % 2];
        const mat = new THREE.MeshStandardMaterial({
          color: colors[idx], roughness: 0.3, metalness: 0.3
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          col * spacing - offset,
          0.6,
          row * spacing - offset
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = {
          name: `物体 / Object [${row},${col}]`,
          row, col,
          originalColor: colors[idx],
          originalScale: 1.0
        };
        scene.add(mesh);
        objects.push(mesh);
      }
    }

    // ===== 射线投射 / Raycaster =====
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedObject = null;
    const selectedInfo = document.getElementById('selectedInfo');

    // 高亮材质属性 / Highlight material properties
    function highlightObject(obj) {
      if (obj) {
        obj.material.emissive.setHex(0x444444);
        obj.material.emissiveIntensity = 0.6;
        obj.scale.setScalar(1.3);
      }
    }
    // 还原材质属性 / Restore material properties
    function unhighlightObject(obj) {
      if (obj) {
        obj.material.emissive.setHex(0x000000);
        obj.material.emissiveIntensity = 0;
        obj.scale.setScalar(obj.userData.originalScale);
      }
    }

    // 点击事件 / Click event
    renderer.domElement.addEventListener('click', (e) => {
      // 计算归一化设备坐标 / Calculate normalized device coordinates
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects);

      // 取消之前的选中 / Deselect previous
      if (selectedObject) {
        unhighlightObject(selectedObject);
        selectedObject = null;
      }

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        selectedObject = hit;
        highlightObject(hit);
        const p = hit.position;
        selectedInfo.innerHTML =
          `<strong>${hit.userData.name}</strong><br>` +
          `位置 / Pos: (${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})<br>` +
          `颜色 / Color: #${hit.userData.originalColor.toString(16).padStart(6, '0')}`;
      } else {
        selectedInfo.textContent = '未选中 / Nothing selected';
      }
    });

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      // 轻微旋转所有物体 / Slight rotation for all objects
      objects.forEach(obj => { obj.rotation.y += 0.003; });
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
