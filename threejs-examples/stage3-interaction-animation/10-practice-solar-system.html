<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>练习：太阳系 / Practice: Solar System - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.78); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: auto; min-width: 260px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #ffb74d; }
    #info .planet-info { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
    #info .planet-info .name { font-size: 16px; font-weight: bold; color: #ffd54f; }
    #info .controls { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
    #info .controls label { display: block; margin-bottom: 4px; }
    #info input[type="range"] {
      width: 100%; accent-color: #ffb74d; cursor: pointer;
    }
    #info .speed-val { color: #ffb74d; font-weight: bold; }
    #info .hint { color: #888; font-size: 11px; margin-top: 4px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>太阳系 / Solar System</h2>
    <div>拖拽旋转 / Drag to orbit</div>
    <div>滚轮缩放 / Scroll to zoom</div>
    <div>点击行星查看信息 / Click planet for info</div>
    <div class="controls">
      <label>动画速度 / Speed: <span class="speed-val" id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1" />
      <div class="hint">拖拽滑块调节 / Drag slider to adjust</div>
    </div>
    <div class="planet-info" id="planetInfo">
      <div class="name">点击行星 / Click a planet</div>
      <div id="planetDetails"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020210);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(30, 25, 40);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ===== 轨道控制器 / OrbitControls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 150;

    // ===== 星星背景 / Starfield background =====
    const starCount = 5000;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      // 在大球体内随机分布 / Random distribution in a large sphere
      const r = 200 + Math.random() * 300;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
      // 随机的微白色变化 / Random slight color variation
      const brightness = 0.7 + Math.random() * 0.3;
      starColors[i * 3]     = brightness;
      starColors[i * 3 + 1] = brightness;
      starColors[i * 3 + 2] = brightness * (0.9 + Math.random() * 0.1);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMat = new THREE.PointsMaterial({
      size: 0.5, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.9
    });
    scene.add(new THREE.Points(starGeo, starMat));

    // ===== 太阳 / Sun =====
    const sunGeo = new THREE.SphereGeometry(3, 48, 48);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // 太阳光晕 / Sun glow (sprite)
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 256; glowCanvas.height = 256;
    const gCtx = glowCanvas.getContext('2d');
    const gradient = gCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gradient.addColorStop(0, 'rgba(255, 200, 50, 0.6)');
    gradient.addColorStop(0.4, 'rgba(255, 160, 20, 0.3)');
    gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
    gCtx.fillStyle = gradient;
    gCtx.fillRect(0, 0, 256, 256);
    const glowTex = new THREE.CanvasTexture(glowCanvas);
    const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending });
    const glowSprite = new THREE.Sprite(glowMat);
    glowSprite.scale.set(12, 12, 1);
    sun.add(glowSprite);

    // 太阳点光源 / Sun point light
    const sunLight = new THREE.PointLight(0xffeedd, 2.5, 300, 0.5);
    sun.add(sunLight);
    // 微弱环境光 / Subtle ambient light
    scene.add(new THREE.AmbientLight(0x222244, 0.3));

    // ===== 行星数据 / Planet data =====
    // 距离和大小经过缩放以便观察 / Distances and sizes scaled for visibility
    const planetData = [
      { name: '水星 Mercury',    color: 0xb0b0b0, size: 0.3,  distance: 5,   speed: 4.15,  rotSpeed: 0.02,  info: '最小的行星 / Smallest planet' },
      { name: '金星 Venus',      color: 0xe8cda0, size: 0.6,  distance: 7,   speed: 1.62,  rotSpeed: -0.01, info: '最热的行星 / Hottest planet' },
      { name: '地球 Earth',      color: 0x4488ff, size: 0.65, distance: 9.5, speed: 1.0,   rotSpeed: 0.05,  info: '我们的家园 / Our home' },
      { name: '火星 Mars',       color: 0xdd4422, size: 0.45, distance: 12,  speed: 0.53,  rotSpeed: 0.048, info: '红色星球 / The Red Planet' },
      { name: '木星 Jupiter',    color: 0xd4a06a, size: 1.8,  distance: 17,  speed: 0.084, rotSpeed: 0.12,  info: '最大的行星 / Largest planet' },
      { name: '土星 Saturn',     color: 0xe8d5a3, size: 1.5,  distance: 22,  speed: 0.034, rotSpeed: 0.11,  info: '有美丽的光环 / Has beautiful rings' },
      { name: '天王星 Uranus',   color: 0x88ccdd, size: 1.0,  distance: 27,  speed: 0.012, rotSpeed: -0.07, info: '侧躺旋转 / Rotates on its side' },
      { name: '海王星 Neptune',  color: 0x3355ff, size: 0.95, distance: 32,  speed: 0.006, rotSpeed: 0.065, info: '最远的行星 / Farthest planet' },
    ];

    const planets = [];
    const planetMeshes = []; // 用于射线检测 / For raycasting

    planetData.forEach(data => {
      // 行星容器 / Planet container (用于公转) / Used for orbit
      const orbitGroup = new THREE.Group();
      scene.add(orbitGroup);

      // 行星球体 / Planet sphere
      const geo = new THREE.SphereGeometry(data.size, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: data.color, roughness: 0.5, metalness: 0.2
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = data.distance;
      mesh.castShadow = true;
      mesh.userData = { planetData: data };
      orbitGroup.add(mesh);
      planetMeshes.push(mesh);

      // 土星环 / Saturn rings
      if (data.name.includes('Saturn')) {
        const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.2, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xd4c490, side: THREE.DoubleSide, transparent: true, opacity: 0.7, roughness: 0.8
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2.5;
        mesh.add(ring);
      }

      // 轨道路径（细环）/ Orbit path (thin ring)
      const orbitRingGeo = new THREE.RingGeometry(data.distance - 0.03, data.distance + 0.03, 128);
      const orbitRingMat = new THREE.MeshBasicMaterial({
        color: 0x444466, side: THREE.DoubleSide, transparent: true, opacity: 0.3
      });
      const orbitRing = new THREE.Mesh(orbitRingGeo, orbitRingMat);
      orbitRing.rotation.x = -Math.PI / 2;
      scene.add(orbitRing);

      planets.push({
        data, mesh, orbitGroup,
        angle: Math.random() * Math.PI * 2 // 随机初始角度 / Random initial angle
      });
    });

    // ===== 射线检测 - 点击行星 / Raycaster - click planet =====
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const planetInfoDiv = document.getElementById('planetInfo');
    const planetDetailsDiv = document.getElementById('planetDetails');
    let selectedPlanet = null;

    renderer.domElement.addEventListener('click', (e) => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(planetMeshes);

      // 取消之前选中 / Deselect previous
      if (selectedPlanet) {
        selectedPlanet.material.emissive.setHex(0x000000);
        selectedPlanet.material.emissiveIntensity = 0;
      }

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        selectedPlanet = hit;
        hit.material.emissive.setHex(hit.userData.planetData.color);
        hit.material.emissiveIntensity = 0.3;

        const pd = hit.userData.planetData;
        planetInfoDiv.querySelector('.name').textContent = pd.name;
        planetDetailsDiv.innerHTML =
          `${pd.info}<br>` +
          `距太阳 / Distance: ${pd.distance} AU<br>` +
          `公转速度 / Orbit speed: ${pd.speed}x<br>` +
          `大小 / Size: ${pd.size}`;
      } else {
        selectedPlanet = null;
        planetInfoDiv.querySelector('.name').textContent = '点击行星 / Click a planet';
        planetDetailsDiv.innerHTML = '';
      }
    });

    // ===== 动画速度控制 / Animation speed control =====
    let speedMultiplier = 1.0;
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    speedSlider.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
    });

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta() * speedMultiplier;
      const elapsed = clock.getElapsedTime();

      // 太阳自转 / Sun rotation
      sun.rotation.y += 0.002 * speedMultiplier;

      // 更新每颗行星 / Update each planet
      planets.forEach(p => {
        // 公转 / Orbital revolution
        p.angle += delta * p.data.speed * 0.3;
        p.orbitGroup.rotation.y = p.angle;

        // 自转 / Axial rotation
        p.mesh.rotation.y += delta * p.data.rotSpeed * 5;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
