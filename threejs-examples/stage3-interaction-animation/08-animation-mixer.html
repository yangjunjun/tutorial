<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>骨骼动画 / AnimationMixer - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.7;
      pointer-events: auto; min-width: 240px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 8px; color: #ffab91; }
    #info button {
      display: block; width: 100%; margin: 3px 0; padding: 6px 10px;
      background: #333; color: #fff; border: 1px solid #555; border-radius: 5px;
      cursor: pointer; font-size: 12px; text-align: left;
      transition: background 0.2s;
    }
    #info button:hover { background: #555; }
    #info button.active { background: #664; border-color: #ff9; }
    #info .status { color: #aaa; font-size: 12px; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>骨骼动画 / AnimationMixer</h2>
    <button id="btnIdle" class="active">待机 / Idle</button>
    <button id="btnWalk">行走 / Walk</button>
    <button id="btnWave">挥手 / Wave</button>
    <button id="btnJump">跳跃 / Jump</button>
    <button id="btnDance">跳舞 / Dance</button>
    <div class="status" id="statusInfo">当前动画 / Current: Idle</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(4, 4, 6);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ===== 轨道控制器 / OrbitControls =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1.5, 0);

    // ===== 灯光 / Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ===== 地面 / Ground =====
    scene.add(new THREE.GridHelper(15, 15, 0x444466, 0x222244));
    const floorGeo = new THREE.PlaneGeometry(15, 15);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // ===== 构建机器人 / Build a robot from BoxGeometry parts =====
    const robotGroup = new THREE.Group();
    robotGroup.name = 'robot';

    // 材质定义 / Material definitions
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: 0.4, metalness: 0.6 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0x90a4ae, roughness: 0.3, metalness: 0.5 });
    const limbMat = new THREE.MeshStandardMaterial({ color: 0x78909c, roughness: 0.4, metalness: 0.5 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, emissive: 0x4fc3f7, emissiveIntensity: 0.5 });

    // 身体 / Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.5), bodyMat);
    body.name = 'body';
    body.position.y = 1.8;
    body.castShadow = true;
    robotGroup.add(body);

    // 头部 / Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.5), headMat);
    head.name = 'head';
    head.position.y = 2.6;
    head.castShadow = true;
    robotGroup.add(head);

    // 眼睛 / Eyes
    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.05), eyeMat);
    eyeL.position.set(-0.12, 2.65, 0.26);
    robotGroup.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.05), eyeMat);
    eyeR.position.set(0.12, 2.65, 0.26);
    robotGroup.add(eyeR);

    // 左臂 / Left arm
    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), limbMat);
    leftArm.name = 'leftArm';
    leftArm.position.set(-0.65, 1.8, 0);
    leftArm.castShadow = true;
    robotGroup.add(leftArm);

    // 右臂 / Right arm
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), limbMat);
    rightArm.name = 'rightArm';
    rightArm.position.set(0.65, 1.8, 0);
    rightArm.castShadow = true;
    robotGroup.add(rightArm);

    // 左腿 / Left leg
    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), limbMat);
    leftLeg.name = 'leftLeg';
    leftLeg.position.set(-0.22, 0.9, 0);
    leftLeg.castShadow = true;
    robotGroup.add(leftLeg);

    // 右腿 / Right leg
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), limbMat);
    rightLeg.name = 'rightLeg';
    rightLeg.position.set(0.22, 0.9, 0);
    rightLeg.castShadow = true;
    robotGroup.add(rightLeg);

    scene.add(robotGroup);

    // ===== 创建动画片段 / Create animation clips =====
    // 使用 KeyframeTrack 定义关键帧动画 / Use KeyframeTrack to define keyframe animations

    // 待机动画 - 轻微上下浮动 / Idle animation - slight float up/down
    const idleClip = new THREE.AnimationClip('idle', 2, [
      new THREE.NumberKeyframeTrack('body.position[y]', [0, 1, 2], [1.8, 1.85, 1.8]),
      new THREE.NumberKeyframeTrack('head.position[y]', [0, 1, 2], [2.6, 2.65, 2.6]),
      new THREE.NumberKeyframeTrack('leftArm.rotation[z]', [0, 1, 2], [0, 0.05, 0]),
      new THREE.NumberKeyframeTrack('rightArm.rotation[z]', [0, 1, 2], [0, -0.05, 0]),
    ]);

    // 行走动画 - 手臂和腿部摆动 / Walk animation - arm and leg swing
    const walkClip = new THREE.AnimationClip('walk', 1, [
      new THREE.NumberKeyframeTrack('leftArm.rotation[x]', [0, 0.25, 0.5, 0.75, 1], [0, -0.6, 0, 0.6, 0]),
      new THREE.NumberKeyframeTrack('rightArm.rotation[x]', [0, 0.25, 0.5, 0.75, 1], [0, 0.6, 0, -0.6, 0]),
      new THREE.NumberKeyframeTrack('leftLeg.rotation[x]', [0, 0.25, 0.5, 0.75, 1], [0, 0.5, 0, -0.5, 0]),
      new THREE.NumberKeyframeTrack('rightLeg.rotation[x]', [0, 0.25, 0.5, 0.75, 1], [0, -0.5, 0, 0.5, 0]),
      new THREE.NumberKeyframeTrack('body.position[y]', [0, 0.25, 0.5, 0.75, 1], [1.8, 1.9, 1.8, 1.9, 1.8]),
      new THREE.NumberKeyframeTrack('head.position[y]', [0, 0.25, 0.5, 0.75, 1], [2.6, 2.7, 2.6, 2.7, 2.6]),
    ]);

    // 挥手动 - 右臂挥动 / Wave animation - right arm waves
    const waveClip = new THREE.AnimationClip('wave', 2, [
      new THREE.NumberKeyframeTrack('rightArm.rotation[z]', [0, 0.3, 0.6, 1.0, 1.4, 1.7, 2], [-2.5, -2.0, -2.5, -2.0, -2.5, -2.0, 0]),
      new THREE.NumberKeyframeTrack('rightArm.rotation[x]', [0, 0.3, 2], [0, 0.3, 0]),
      new THREE.NumberKeyframeTrack('head.rotation[z]', [0, 0.5, 1.5, 2], [0, 0.15, -0.15, 0]),
    ]);

    // 跳跃动画 / Jump animation
    const jumpClip = new THREE.AnimationClip('jump', 1.2, [
      new THREE.NumberKeyframeTrack('body.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [1.8, 1.5, 3.2, 3.0, 1.5, 1.8]),
      new THREE.NumberKeyframeTrack('head.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [2.6, 2.3, 4.0, 3.8, 2.3, 2.6]),
      new THREE.NumberKeyframeTrack('leftArm.rotation[z]', [0, 0.3, 0.6, 1.0, 1.2], [0, 1.2, 2.0, 0.5, 0]),
      new THREE.NumberKeyframeTrack('rightArm.rotation[z]', [0, 0.3, 0.6, 1.0, 1.2], [0, -1.2, -2.0, -0.5, 0]),
      new THREE.NumberKeyframeTrack('leftLeg.rotation[x]', [0, 0.3, 0.6, 1.0, 1.2], [0, 0.4, -0.3, 0.2, 0]),
      new THREE.NumberKeyframeTrack('rightLeg.rotation[x]', [0, 0.3, 0.6, 1.0, 1.2], [0, -0.4, 0.3, -0.2, 0]),
      new THREE.NumberKeyframeTrack('leftArm.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [1.8, 1.5, 3.2, 3.0, 1.5, 1.8]),
      new THREE.NumberKeyframeTrack('rightArm.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [1.8, 1.5, 3.2, 3.0, 1.5, 1.8]),
      new THREE.NumberKeyframeTrack('leftLeg.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [0.9, 0.6, 2.3, 2.1, 0.6, 0.9]),
      new THREE.NumberKeyframeTrack('rightLeg.position[y]', [0, 0.15, 0.5, 0.8, 1.0, 1.2], [0.9, 0.6, 2.3, 2.1, 0.6, 0.9]),
    ]);

    // 跳舞动画 / Dance animation
    const danceClip = new THREE.AnimationClip('dance', 2, [
      new THREE.NumberKeyframeTrack('body.rotation[y]', [0, 0.5, 1.0, 1.5, 2.0], [0, 0.4, 0, -0.4, 0]),
      new THREE.NumberKeyframeTrack('body.position[y]', [0, 0.5, 1.0, 1.5, 2.0], [1.8, 2.1, 1.8, 2.1, 1.8]),
      new THREE.NumberKeyframeTrack('head.position[y]', [0, 0.5, 1.0, 1.5, 2.0], [2.6, 2.9, 2.6, 2.9, 2.6]),
      new THREE.NumberKeyframeTrack('leftArm.rotation[z]', [0, 0.5, 1.0, 1.5, 2.0], [0, 2.5, 0.5, 2.5, 0]),
      new THREE.NumberKeyframeTrack('rightArm.rotation[z]', [0, 0.5, 1.0, 1.5, 2.0], [0, -2.5, -0.5, -2.5, 0]),
      new THREE.NumberKeyframeTrack('leftLeg.rotation[x]', [0, 0.5, 1.0, 1.5, 2.0], [0, -0.5, 0, 0.5, 0]),
      new THREE.NumberKeyframeTrack('rightLeg.rotation[x]', [0, 0.5, 1.0, 1.5, 2.0], [0, 0.5, 0, -0.5, 0]),
      new THREE.NumberKeyframeTrack('head.rotation[z]', [0, 0.5, 1.0, 1.5, 2.0], [0, 0.2, 0, -0.2, 0]),
    ]);

    // ===== AnimationMixer / 动画混合器 =====
    const mixer = new THREE.AnimationMixer(robotGroup);
    const clips = { idle: idleClip, walk: walkClip, wave: waveClip, jump: jumpClip, dance: danceClip };
    const actions = {};
    let currentAction = null;

    // 创建所有动画动作 / Create all animation actions
    Object.entries(clips).forEach(([name, clip]) => {
      const action = mixer.clipAction(clip);
      action.loop = THREE.LoopRepeat;
      actions[name] = action;
    });

    // 跳跃动画只播放一次 / Jump animation plays once
    actions.jump.loop = THREE.LoopOnce;
    actions.jump.clampWhenFinished = true;

    // 启动待机动画 / Start idle animation
    currentAction = actions.idle;
    currentAction.play();

    // 切换动画（带交叉淡入淡出）/ Switch animation (with crossfade)
    function switchAnimation(newName, fadeDuration = 0.4) {
      const newAction = actions[newName];
      if (newAction === currentAction) return;

      newAction.reset();
      newAction.play();

      if (currentAction) {
        // 交叉淡入淡出 / Crossfade transition
        currentAction.crossFadeTo(newAction, fadeDuration, true);
      }

      currentAction = newAction;
      // 更新UI / Update UI
      document.querySelectorAll('#info button').forEach(btn => btn.classList.remove('active'));
      const btnId = 'btn' + newName.charAt(0).toUpperCase() + newName.slice(1);
      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add('active');
      statusInfo.textContent = `当前动画 / Current: ${newName}`;
    }

    // 跳跃结束后自动返回待机 / Auto-return to idle after jump
    mixer.addEventListener('finished', (e) => {
      if (e.action === actions.jump) {
        switchAnimation('idle', 0.3);
      }
    });

    // ===== UI按钮绑定 / UI button binding =====
    const statusInfo = document.getElementById('statusInfo');
    document.getElementById('btnIdle').addEventListener('click', () => switchAnimation('idle'));
    document.getElementById('btnWalk').addEventListener('click', () => switchAnimation('walk'));
    document.getElementById('btnWave').addEventListener('click', () => switchAnimation('wave'));
    document.getElementById('btnJump').addEventListener('click', () => switchAnimation('jump'));
    document.getElementById('btnDance').addEventListener('click', () => switchAnimation('dance'));

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      // 更新动画混合器 / Update animation mixer
      mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
