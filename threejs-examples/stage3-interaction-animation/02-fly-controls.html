<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞行控制器 / FlyControls - Three.js Tutorial Stage 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 14px 18px;
      border-radius: 8px; font-size: 13px; line-height: 1.8;
      pointer-events: none; min-width: 250px; user-select: none;
    }
    #info h2 { font-size: 15px; margin-bottom: 6px; color: #81c784; }
    #info kbd {
      background: #333; padding: 1px 6px; border-radius: 3px;
      border: 1px solid #555; font-size: 12px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 信息面板 / Info panel -->
  <div id="info">
    <h2>飞行控制器 / FlyControls</h2>
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 / Move</div>
    <div><kbd>Q</kbd><kbd>E</kbd> 翻滚 / Roll</div>
    <div><kbd>R</kbd><kbd>F</kbd> 上升/下降 / Up/Down</div>
    <div>鼠标拖动转向 / Mouse drag: Look around</div>
    <div id="posInfo" style="color:#aaa;font-size:12px;margin-top:8px;border-top:1px solid #333;padding-top:8px;">
      位置 / Position: --
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { FlyControls } from 'three/addons/controls/FlyControls.js';

    // ===== 场景 / Scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.012);

    // ===== 相机 / Camera =====
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 5, 20);

    // ===== 渲染器 / Renderer =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ===== 飞行控制器 / FlyControls =====
    const controls = new FlyControls(camera, renderer.domElement);
    controls.movementSpeed = 12;         // 移动速度 / Movement speed
    controls.rollSpeed = Math.PI / 4;   // 翻滚速度 / Roll speed
    controls.autoForward = false;        // 不自动前进 / No auto-forward
    controls.dragToLook = true;          // 拖动查看 / Drag to look

    // ===== 灯光 / Lights =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(20, 30, 20);
    scene.add(dirLight);
    // 点光源营造氛围 / Point lights for atmosphere
    const pointColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0x82b1ff];
    pointColors.forEach((c, i) => {
      const pl = new THREE.PointLight(c, 3, 40);
      const angle = (i / pointColors.length) * Math.PI * 2;
      pl.position.set(Math.cos(angle) * 15, 5 + Math.random() * 10, Math.sin(angle) * 15);
      scene.add(pl);
    });

    // ===== 散布在3D空间中的几何体 / Geometric objects scattered in 3D space =====
    const geometries = [
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.SphereGeometry(1, 24, 24),
      new THREE.TorusGeometry(1, 0.35, 16, 48),
      new THREE.OctahedronGeometry(1.2),
      new THREE.TetrahedronGeometry(1.3),
      new THREE.TorusKnotGeometry(0.8, 0.25, 64, 8),
      new THREE.DodecahedronGeometry(1),
      new THREE.IcosahedronGeometry(1),
      new THREE.ConeGeometry(0.8, 2, 12),
      new THREE.CylinderGeometry(0.6, 0.6, 2, 16),
    ];
    const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8a80, 0x82b1ff, 0xb39ddb, 0xffab91, 0x80cbc4, 0xce93d8];

    // 在3D空间中随机放置物体 / Randomly place objects in 3D space
    const objects = [];
    for (let i = 0; i < 80; i++) {
      const geo = geometries[i % geometries.length];
      const mat = new THREE.MeshStandardMaterial({
        color: colors[i % colors.length],
        roughness: 0.3, metalness: 0.4
      });
      const mesh = new THREE.Mesh(geo, mat);
      // 在大范围内随机分布 / Distribute over a large area
      mesh.position.set(
        (Math.random() - 0.5) * 120,
        (Math.random() - 0.5) * 60 + 5,
        (Math.random() - 0.5) * 120
      );
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      const s = 0.5 + Math.random() * 1.5;
      mesh.scale.set(s, s, s);
      scene.add(mesh);
      objects.push(mesh);
    }

    // 添加星星粒子 / Add star particles
    const starGeo = new THREE.BufferGeometry();
    const starPositions = [];
    for (let i = 0; i < 3000; i++) {
      starPositions.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 400);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, sizeAttenuation: true });
    scene.add(new THREE.Points(starGeo, starMat));

    // ===== 响应式画布 / Responsive canvas =====
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();
    const posInfo = document.getElementById('posInfo');

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // 更新控制器 / Update controls
      controls.update(delta);

      // 缓慢旋转物体 / Slowly rotate objects
      objects.forEach((obj, i) => {
        obj.rotation.x += 0.003 * (i % 2 === 0 ? 1 : -1);
        obj.rotation.y += 0.005;
      });

      // 更新位置信息 / Update position info
      const p = camera.position;
      posInfo.textContent = `位置 / Position: (${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})`;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
