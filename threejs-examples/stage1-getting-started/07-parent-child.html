<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>父子层级 / Parent-Child Hierarchy - Three.js Tutorial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 14px 18px; border-radius: 8px;
      font-size: 14px; line-height: 1.6; max-width: 380px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
    }
    #info h2 { font-size: 16px; margin-bottom: 6px; color: #4fc3f7; }
    .hierarchy { font-family: 'Consolas', monospace; margin: 6px 0; }
    .hierarchy .sun { color: #ffcc00; }
    .hierarchy .earth { color: #4fc3f7; }
    .hierarchy .moon { color: #aaa; }
  </style>
</head>
<body>
  <div id="info">
    <h2>父子层级 / Parent-Child Hierarchy</h2>
    <div class="hierarchy">
      <p><span class="sun">☀ Sun (太阳)</span></p>
      <p>&nbsp;&nbsp;└─ <span class="earth">🌍 Earth (地球)</span></p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└─ <span class="moon">🌙 Moon (月球)</span></p>
    </div>
    <p>子物体的变换基于父物体坐标系</p>
    <p>Child transforms are relative to parent</p>
    <p style="margin-top:4px;color:#aaa;">Object3D 作为轨道枢轴 / Object3D as orbit pivots</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    // ============================================================
    // 父子层级演示：太阳系（太阳→地球→月球）
    // Parent-child hierarchy: Solar system (Sun → Earth → Moon)
    // 使用 Object3D 作为不可见的轨道枢轴
    // Using Object3D as invisible orbit pivot points
    // ============================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 场景 / Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510); // 深空背景 / Deep space

    // 添加星空 / Add starfield
    const starGeo = new THREE.BufferGeometry();
    const starCount = 2000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPos[i] = (Math.random() - 0.5) * 100;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
    scene.add(new THREE.Points(starGeo, starMat));

    // --- 相机 / Camera ---
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(12, 8, 16);

    // --- 渲染器 / Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 轨道控制器 / OrbitControls ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // --- 灯光 / Lights ---
    // 太阳自身的点光 / Point light from the Sun
    const sunLight = new THREE.PointLight(0xffdd44, 50, 50);
    scene.add(sunLight); // 放在原点 / At origin

    scene.add(new THREE.AmbientLight(0x333355, 0.5)); // 微弱环境光 / Dim ambient

    // --- 太阳 / Sun ---
    // 太阳是根级物体 / Sun is the root object
    const sunGeo = new THREE.SphereGeometry(1.5, 32, 32);
    const sunMat = new THREE.MeshStandardMaterial({
      color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 1.0
    });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // --- 地球轨道枢轴 / Earth orbit pivot ---
    // Object3D 是一个空的容器，只有变换属性
    // Object3D is an empty container with only transform properties
    // 旋转此枢轴即可让地球绕太阳公转
    const earthOrbitPivot = new THREE.Object3D();
    sun.add(earthOrbitPivot); // 作为太阳的子物体 / Child of Sun

    // --- 地球 / Earth ---
    // 地球相对于枢轴偏移，形成轨道半径
    const earthGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const earthMat = new THREE.MeshStandardMaterial({
      color: 0x2196f3, metalness: 0.1, roughness: 0.6
    });
    const earth = new THREE.Mesh(earthGeo, earthMat);
    earth.position.set(5, 0, 0); // 轨道半径 / Orbit radius
    earthOrbitPivot.add(earth);   // 地球的变换相对于枢轴

    // --- 月球轨道枢轴 / Moon orbit pivot ---
    // 月球绕地球转，所以枢轴挂在地球下
    const moonOrbitPivot = new THREE.Object3D();
    earth.add(moonOrbitPivot); // 作为地球的子物体 / Child of Earth

    // --- 月球 / Moon ---
    const moonGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const moonMat = new THREE.MeshStandardMaterial({
      color: 0xcccccc, metalness: 0.0, roughness: 0.8
    });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(1.5, 0, 0); // 月球轨道半径 / Moon orbit radius
    moonOrbitPivot.add(moon);

    // --- 轨道线（可视化辅助） / Orbit lines (visual helper) ---
    function createOrbitLine(radius, color, parent) {
      const points = [];
      for (let i = 0; i <= 64; i++) {
        const angle = (i / 64) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 });
      const line = new THREE.Line(lineGeo, lineMat);
      parent.add(line);
    }
    createOrbitLine(5, 0x4488ff, sun);     // 地球轨道 / Earth orbit
    createOrbitLine(1.5, 0x888888, earth); // 月球轨道 / Moon orbit

    // --- 响应窗口变化 / Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 动画循环 / Animation loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 太阳自转 / Sun rotation
      sun.rotation.y += 0.003;

      // 地球公转（旋转枢轴） / Earth orbits (rotate pivot)
      earthOrbitPivot.rotation.y += 0.01;

      // 地球自转 / Earth self-rotation
      earth.rotation.y += 0.02;

      // 月球公转（旋转枢轴） / Moon orbits (rotate pivot)
      moonOrbitPivot.rotation.y += 0.03;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
