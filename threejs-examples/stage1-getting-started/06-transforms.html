<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变换 / Transforms - Three.js Tutorial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 14px 18px; border-radius: 8px;
      font-size: 14px; line-height: 1.8; max-width: 380px;
      backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
    }
    #info h2 { font-size: 16px; margin-bottom: 6px; color: #4fc3f7; }
    .prop { font-family: 'Consolas', monospace; color: #aed581; }
    .val { color: #ffcc80; }
    #mode-label { color: #4fc3f7; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>
  <div id="info">
    <h2>变换 / Transforms</h2>
    <p>当前模式 / Mode: <span id="mode-label">Position 位移</span></p>
    <hr style="border-color:rgba(255,255,255,0.1);margin:6px 0;">
    <p><span class="prop">position.x</span> = <span class="val" id="px">0</span></p>
    <p><span class="prop">position.y</span> = <span class="val" id="py">0</span></p>
    <p><span class="prop">position.z</span> = <span class="val" id="pz">0</span></p>
    <hr style="border-color:rgba(255,255,255,0.1);margin:6px 0;">
    <p><span class="prop">rotation.x</span> = <span class="val" id="rx">0</span></p>
    <p><span class="prop">rotation.y</span> = <span class="val" id="ry">0</span></p>
    <p><span class="prop">rotation.z</span> = <span class="val" id="rz">0</span></p>
    <hr style="border-color:rgba(255,255,255,0.1);margin:6px 0;">
    <p><span class="prop">scale.x</span> = <span class="val" id="sx">1</span></p>
    <p><span class="prop">scale.y</span> = <span class="val" id="sy">1</span></p>
    <p><span class="prop">scale.z</span> = <span class="val" id="sz">1</span></p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    // ============================================================
    // 变换演示：位移、旋转、缩放
    // Transforms: position, rotation, scale
    // 三个阶段循环演示 / Cycles through three demo phases
    // ============================================================
    import * as THREE from 'three';

    // --- 场景 / Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // --- 相机 / Camera ---
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4, 3.5, 6);
    camera.lookAt(0, 1, 0);

    // --- 渲染器 / Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 网格和坐标轴 / Grid + axes ---
    scene.add(new THREE.GridHelper(10, 10, 0x333355, 0x222244));
    scene.add(new THREE.AxesHelper(3));

    // --- 灯光 / Lights ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    // --- 主变换物体 / Main transform demo object ---
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const cubeMat = new THREE.MeshStandardMaterial({
      color: 0x4fc3f7, metalness: 0.3, roughness: 0.4
    });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    // 参考线框 / Wireframe reference at origin
    const wireGeo = new THREE.BoxGeometry(1, 1, 1);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x444466, wireframe: true, transparent: true, opacity: 0.3
    });
    const wire = new THREE.Mesh(wireGeo, wireMat);
    wire.position.set(0, 0.5, 0);
    scene.add(wire);

    // --- UI 元素 / UI elements ---
    const modeLabel = document.getElementById('mode-label');
    const els = {
      px: document.getElementById('px'), py: document.getElementById('py'), pz: document.getElementById('pz'),
      rx: document.getElementById('rx'), ry: document.getElementById('ry'), rz: document.getElementById('rz'),
      sx: document.getElementById('sx'), sy: document.getElementById('sy'), sz: document.getElementById('sz'),
    };

    // --- 动画模式 / Animation modes ---
    // 阶段: 0=位移, 1=旋转, 2=缩放, 3=综合
    // Phases: 0=position, 1=rotation, 2=scale, 3=combined
    const phaseDuration = 4; // 每阶段秒数 / Seconds per phase
    const phases = [
      { name: 'Position 位移' },
      { name: 'Rotation 旋转' },
      { name: 'Scale 缩放' },
      { name: 'Combined 综合' },
    ];

    // --- 响应窗口变化 / Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 动画循环 / Animation loop ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // 确定当前阶段 / Determine current phase
      const phaseIndex = Math.floor((t / phaseDuration) % phases.length);
      const localT = (t % phaseDuration) / phaseDuration; // 0~1 归一化

      // 重置变换 / Reset transforms
      cube.position.set(0, 0.5, 0);
      cube.rotation.set(0, 0, 0);
      cube.scale.set(1, 1, 1);

      switch (phaseIndex) {
        case 0: // 位移 / Position — 沿X轴来回滑动
          cube.position.x = Math.sin(localT * Math.PI * 2) * 3;
          cube.position.y = 0.5 + Math.sin(localT * Math.PI * 4) * 0.5;
          modeLabel.textContent = phases[0].name;
          break;
        case 1: // 旋转 / Rotation — 三轴旋转演示 Euler 角
          cube.rotation.x = localT * Math.PI * 2; // X轴完整旋转
          cube.rotation.y = localT * Math.PI;     // Y轴半旋转
          cube.position.y = 0.5;
          modeLabel.textContent = phases[1].name;
          break;
        case 2: // 缩放 / Scale — 脉冲缩放
          cube.scale.x = 1 + Math.sin(localT * Math.PI * 2) * 0.8;
          cube.scale.y = 1 + Math.cos(localT * Math.PI * 2) * 0.8;
          cube.scale.z = 1 + Math.sin(localT * Math.PI * 2 + 1) * 0.5;
          cube.position.y = 0.5;
          modeLabel.textContent = phases[2].name;
          break;
        case 3: // 综合 / Combined — 同时应用所有变换
          cube.position.x = Math.sin(localT * Math.PI * 2) * 2;
          cube.rotation.y = localT * Math.PI * 2;
          cube.rotation.z = Math.sin(localT * Math.PI * 4) * 0.3;
          const s = 1 + Math.sin(localT * Math.PI * 2) * 0.4;
          cube.scale.set(s, s, s);
          cube.position.y = 0.5 + Math.sin(localT * Math.PI * 4) * 0.3;
          modeLabel.textContent = phases[3].name;
          break;
      }

      // 更新面板数值 / Update info panel values
      els.px.textContent = cube.position.x.toFixed(2);
      els.py.textContent = cube.position.y.toFixed(2);
      els.pz.textContent = cube.position.z.toFixed(2);
      els.rx.textContent = cube.rotation.x.toFixed(2);
      els.ry.textContent = cube.rotation.y.toFixed(2);
      els.rz.textContent = cube.rotation.z.toFixed(2);
      els.sx.textContent = cube.scale.x.toFixed(2);
      els.sy.textContent = cube.scale.y.toFixed(2);
      els.sz.textContent = cube.scale.z.toFixed(2);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
