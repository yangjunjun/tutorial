<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - 性能监控 / Performance Monitoring</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
        /* 信息面板样式 / Info panel styles */
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            min-width: 280px;
            z-index: 100;
        }
        #info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4fc3f7;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .metric-label { color: #aaa; }
        .metric-value { color: #4fc3f7; font-weight: bold; }
        .warning { color: #ff9800; }
        .good { color: #4caf50; }
        /* 按钮样式 / Button styles */
        .btn-group { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-add { background: #4caf50; color: #fff; }
        .btn-remove { background: #f44336; color: #fff; }
        .btn-shadow { background: #ff9800; color: #fff; }
        .btn-shadow.active { background: #4caf50; }
    </style>
</head>
<body>
    <!-- 信息面板 / Info Panel -->
    <div id="info-panel">
        <h2>性能监控 / Performance Monitoring</h2>
        <div class="metric-row">
            <span class="metric-label">Draw Calls:</span>
            <span class="metric-value" id="draw-calls">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Triangles:</span>
            <span class="metric-value" id="triangles">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Geometries:</span>
            <span class="metric-value" id="geometries">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Textures:</span>
            <span class="metric-value" id="textures">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Programs:</span>
            <span class="metric-value" id="programs">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Objects:</span>
            <span class="metric-value" id="objects">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Frame Time:</span>
            <span class="metric-value" id="frame-time">0 ms</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Shadows:</span>
            <span class="metric-value" id="shadow-status">OFF</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-add" id="btn-add">+ Add 10 Objects</button>
            <button class="btn btn-remove" id="btn-remove">- Remove 10</button>
            <button class="btn btn-shadow" id="btn-shadow">Toggle Shadows</button>
        </div>
    </div>

    <!-- Stats.js 性能监控面板 / Stats.js performance panel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // 场景初始化 / Scene Initialization
        // ============================================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 20, 60);

        // 相机设置 / Camera setup
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(15, 12, 15);

        // 渲染器设置 / Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false; // 默认关闭阴影 / Shadows off by default
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 轨道控制器 / Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ============================================
        // Stats.js 设置 / Stats.js Setup
        // ============================================

        // 创建 FPS 面板 / Create FPS panel
        const stats = new Stats();
        stats.showPanel(0); // 0: FPS, 1: MS, 2: MB
        stats.dom.style.cssText = 'position:absolute;top:10px;right:10px;z-index:100;';
        document.body.appendChild(stats.dom);

        // ============================================
        // 灯光设置 / Lighting Setup
        // ============================================

        // 环境光 / Ambient light
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        // 方向光（带阴影）/ Directional light (with shadows)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        scene.add(directionalLight);

        // 点光源 / Point light
        const pointLight = new THREE.PointLight(0xff6b6b, 0.8, 30);
        pointLight.position.set(-5, 8, -5);
        scene.add(pointLight);

        // ============================================
        // 地面 / Ground Plane
        // ============================================

        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 网格辅助 / Grid helper
        const gridHelper = new THREE.GridHelper(50, 50, 0x444466, 0x333355);
        scene.add(gridHelper);

        // ============================================
        // 动态物体管理 / Dynamic Objects Management
        // ============================================

        const dynamicObjects = []; // 存储动态物体 / Store dynamic objects
        const geometries = [
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.SphereGeometry(0.6, 16, 16),
            new THREE.ConeGeometry(0.5, 1, 8),
            new THREE.TorusGeometry(0.4, 0.15, 8, 16),
            new THREE.OctahedronGeometry(0.6)
        ];

        // 随机颜色生成器 / Random color generator
        function randomColor() {
            const colors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf7dc6f, 0xbb8fce, 0x85c1e2];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // 创建随机物体 / Create random object
        function createObject() {
            const geometry = geometries[Math.floor(Math.random() * geometries.length)];
            const material = new THREE.MeshStandardMaterial({
                color: randomColor(),
                roughness: 0.4 + Math.random() * 0.4,
                metalness: 0.1 + Math.random() * 0.5
            });
            const mesh = new THREE.Mesh(geometry, material);

            // 随机位置 / Random position
            mesh.position.set(
                (Math.random() - 0.5) * 30,
                0.5 + Math.random() * 5,
                (Math.random() - 0.5) * 30
            );

            // 随机旋转速度 / Random rotation speed
            mesh.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };

            // 浮动动画参数 / Floating animation parameters
            mesh.userData.floatOffset = Math.random() * Math.PI * 2;
            mesh.userData.floatSpeed = 0.5 + Math.random() * 1.5;
            mesh.userData.baseY = mesh.position.y;

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);
            dynamicObjects.push(mesh);
            return mesh;
        }

        // 移除物体 / Remove object
        function removeObject() {
            if (dynamicObjects.length > 0) {
                const obj = dynamicObjects.pop();
                scene.remove(obj);
                // 正确释放内存 / Properly release memory
                obj.geometry.dispose();
                obj.material.dispose();
            }
        }

        // 初始创建一些物体 / Create initial objects
        for (let i = 0; i < 20; i++) {
            createObject();
        }

        // ============================================
        // UI 事件处理 / UI Event Handlers
        // ============================================

        let shadowsEnabled = false;

        document.getElementById('btn-add').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) createObject();
        });

        document.getElementById('btn-remove').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) removeObject();
        });

        document.getElementById('btn-shadow').addEventListener('click', (e) => {
            shadowsEnabled = !shadowsEnabled;
            renderer.shadowMap.enabled = shadowsEnabled;
            e.target.classList.toggle('active', shadowsEnabled);

            // 需要更新所有材质 / Need to update all materials
            scene.traverse((child) => {
                if (child.material) {
                    child.material.needsUpdate = true;
                }
            });
        });

        // ============================================
        // 性能指标更新 / Performance Metrics Update
        // ============================================

        function updateMetrics(frameTime) {
            const info = renderer.info;
            document.getElementById('draw-calls').textContent = info.render.calls;
            document.getElementById('triangles').textContent = info.render.triangles.toLocaleString();
            document.getElementById('geometries').textContent = info.memory.geometries;
            document.getElementById('textures').textContent = info.memory.textures;
            document.getElementById('programs').textContent = info.programs?.length || 0;
            document.getElementById('objects').textContent = dynamicObjects.length;

            // 帧时间分析 / Frame time analysis
            const ftEl = document.getElementById('frame-time');
            ftEl.textContent = frameTime.toFixed(2) + ' ms';
            ftEl.className = 'metric-value ' + (frameTime > 16.67 ? 'warning' : 'good');

            document.getElementById('shadow-status').textContent = shadowsEnabled ? 'ON (expensive)' : 'OFF';
            document.getElementById('shadow-status').className = 'metric-value ' + (shadowsEnabled ? 'warning' : 'good');
        }

        // ============================================
        // 动画循环 / Animation Loop
        // ============================================

        const clock = new THREE.Clock();
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            stats.begin(); // 开始帧计时 / Start frame timing

            const elapsedTime = clock.getElapsedTime();
            const currentTime = performance.now();
            const frameTime = currentTime - lastTime;
            lastTime = currentTime;

            // 动画更新所有动态物体 / Animate all dynamic objects
            dynamicObjects.forEach((obj) => {
                // 旋转动画 / Rotation animation
                obj.rotation.x += obj.userData.rotationSpeed.x;
                obj.rotation.y += obj.userData.rotationSpeed.y;
                obj.rotation.z += obj.userData.rotationSpeed.z;

                // 浮动动画 / Floating animation
                obj.position.y = obj.userData.baseY +
                    Math.sin(elapsedTime * obj.userData.floatSpeed + obj.userData.floatOffset) * 0.5;
            });

            // 点光源动画 / Point light animation
            pointLight.position.x = Math.sin(elapsedTime * 0.5) * 10;
            pointLight.position.z = Math.cos(elapsedTime * 0.5) * 10;

            controls.update();
            renderer.render(scene, camera);

            stats.end(); // 结束帧计时 / End frame timing

            // 每10帧更新一次指标 / Update metrics every 10 frames
            if (Math.floor(elapsedTime * 60) % 10 === 0) {
                updateMetrics(frameTime);
            }
        }

        // ============================================
        // 响应式处理 / Responsive Handling
        // ============================================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动动画 / Start animation
        animate();

        // ============================================
        // 性能提示 / Performance Tips
        // ============================================
        console.log('%c性能监控提示 / Performance Monitoring Tips:', 'color: #4fc3f7; font-weight: bold; font-size: 14px;');
        console.log('1. Draw Calls 是最常见的性能瓶颈 / Draw calls are the most common bottleneck');
        console.log('2. 阴影会显著增加渲染成本 / Shadows significantly increase rendering cost');
        console.log('3. 使用 renderer.info 监控资源使用 / Use renderer.info to monitor resource usage');
        console.log('4. Stats.js 面板可切换 FPS/MS/MB 视图 / Stats.js panel can switch FPS/MS/MB views');

    </script>
</body>
</html>
