<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 - 实例化渲染 / InstancedMesh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
        /* 信息面板样式 / Info panel styles */
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            min-width: 300px;
            z-index: 100;
        }
        #info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4fc3f7;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .metric-label { color: #aaa; }
        .metric-value { color: #4fc3f7; font-weight: bold; }
        .good { color: #4caf50; }
        .bad { color: #f44336; }
        .highlight { color: #ffeb3b; }
        /* 控件样式 / Control styles */
        .controls { margin-top: 12px; }
        .btn-group { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn {
            padding: 8px 14px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-regular { background: #f44336; color: #fff; }
        .btn-regular.active { border-color: #fff; }
        .btn-instanced { background: #4caf50; color: #fff; }
        .btn-instanced.active { border-color: #fff; }
        .slider-group { margin-top: 10px; }
        .slider-group label { color: #aaa; font-size: 12px; }
        .slider-group input[type="range"] {
            width: 100%;
            margin-top: 5px;
            accent-color: #4fc3f7;
        }
        #fps-display {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #4caf50;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- 信息面板 / Info Panel -->
    <div id="info-panel">
        <h2>实例化渲染 / InstancedMesh</h2>
        <div class="metric-row">
            <span class="metric-label">Mode:</span>
            <span class="metric-value" id="current-mode">Instanced</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Instance Count:</span>
            <span class="metric-value" id="instance-count">5000</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Draw Calls:</span>
            <span class="metric-value" id="draw-calls">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Triangles:</span>
            <span class="metric-value" id="triangles">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Selected:</span>
            <span class="metric-value highlight" id="selected">None</span>
        </div>
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-regular" id="btn-regular">Regular Meshes</button>
                <button class="btn btn-instanced active" id="btn-instanced">InstancedMesh</button>
            </div>
            <div class="slider-group">
                <label>Count: <span id="count-label">5000</span></label>
                <input type="range" id="count-slider" min="100" max="50000" value="5000" step="100">
            </div>
        </div>
    </div>

    <!-- FPS 显示 / FPS Display -->
    <div id="fps-display">FPS: --</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // 场景初始化 / Scene Initialization
        // ============================================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(30, 25, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ============================================
        // 灯光 / Lighting
        // ============================================

        scene.add(new THREE.AmbientLight(0x404060, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(20, 30, 20);
        scene.add(dirLight);

        // 地面网格 / Ground grid
        const gridHelper = new THREE.GridHelper(100, 50, 0x444466, 0x333355);
        scene.add(gridHelper);

        // ============================================
        // 模式管理 / Mode Management
        // ============================================

        let currentMode = 'instanced'; // 'regular' or 'instanced'
        let instanceCount = 5000;
        let regularMeshes = [];
        let instancedMesh = null;

        // 共享几何体和材质 / Shared geometry and material
        const cubeGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const cubeMaterial = new THREE.MeshStandardMaterial({
            roughness: 0.4,
            metalness: 0.3
        });

        // 计算网格布局 / Calculate grid layout
        function getGridPosition(index, count) {
            const gridSize = Math.ceil(Math.sqrt(count));
            const spacing = 1.2;
            const x = (index % gridSize - gridSize / 2) * spacing;
            const z = (Math.floor(index / gridSize) - gridSize / 2) * spacing;
            return { x, z };
        }

        // ============================================
        // 普通网格模式 / Regular Mesh Mode
        // ============================================

        function createRegularMeshes(count) {
            // 清理旧物体 / Clean up old objects
            regularMeshes.forEach(mesh => {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            });
            regularMeshes = [];

            // 创建独立网格 / Create individual meshes
            for (let i = 0; i < count; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(i / count * 0.6 + 0.5, 0.7, 0.5),
                    roughness: 0.4,
                    metalness: 0.3
                });
                const mesh = new THREE.Mesh(cubeGeometry, material);
                const pos = getGridPosition(i, count);
                mesh.position.set(pos.x, 0.5, pos.z);
                mesh.userData.index = i;
                scene.add(mesh);
                regularMeshes.push(mesh);
            }
        }

        // ============================================
        // 实例化网格模式 / Instanced Mesh Mode
        // ============================================

        function createInstancedMesh(count) {
            // 清理旧的实例化网格 / Clean up old instanced mesh
            if (instancedMesh) {
                scene.remove(instancedMesh);
                instancedMesh.geometry.dispose();
                instancedMesh.material.dispose();
            }

            // 创建实例化网格 / Create instanced mesh
            // 注意：使用共享几何体，但每个实例有独立变换
            // Note: Uses shared geometry but each instance has independent transform
            instancedMesh = new THREE.InstancedMesh(cubeGeometry, cubeMaterial, count);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // 动态更新优化

            // 设置每个实例的变换和颜色 / Set transform and color for each instance
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();

            for (let i = 0; i < count; i++) {
                const pos = getGridPosition(i, count);
                dummy.position.set(pos.x, 0.5, pos.z);
                dummy.rotation.set(0, 0, 0);
                dummy.scale.set(1, 1, 1);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);

                // 设置实例颜色 / Set instance color
                color.setHSL(i / count * 0.6 + 0.5, 0.7, 0.5);
                instancedMesh.setColorAt(i, color);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;
            scene.add(instancedMesh);
        }

        // ============================================
        // 模式切换 / Mode Switching
        // ============================================

        function switchMode(mode) {
            currentMode = mode;

            // 清理所有物体 / Clean up all objects
            regularMeshes.forEach(mesh => {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            });
            regularMeshes = [];

            if (instancedMesh) {
                scene.remove(instancedMesh);
                instancedMesh.geometry.dispose();
                instancedMesh.material.dispose();
                instancedMesh = null;
            }

            // 创建新模式 / Create new mode
            if (mode === 'regular') {
                createRegularMeshes(instanceCount);
            } else {
                createInstancedMesh(instanceCount);
            }

            // 更新 UI / Update UI
            document.getElementById('current-mode').textContent =
                mode === 'regular' ? 'Regular (Slow)' : 'Instanced (Fast)';
            document.getElementById('current-mode').className =
                'metric-value ' + (mode === 'regular' ? 'bad' : 'good');
            document.getElementById('btn-regular').classList.toggle('active', mode === 'regular');
            document.getElementById('btn-instanced').classList.toggle('active', mode === 'instanced');
        }

        // ============================================
        // 光线投射 / Raycasting
        // ============================================

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedInstanceId = -1;
        const highlightColor = new THREE.Color(0xffff00);
        const originalColors = new Map();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (currentMode === 'instanced' && instancedMesh) {
                const intersects = raycaster.intersectObject(instancedMesh);
                if (intersects.length > 0) {
                    const instanceId = intersects[0].instanceId;

                    // 恢复之前选中的实例 / Restore previously selected instance
                    if (selectedInstanceId >= 0 && originalColors.has(selectedInstanceId)) {
                        instancedMesh.setColorAt(selectedInstanceId, originalColors.get(selectedInstanceId));
                    }

                    // 保存原始颜色并高亮 / Save original color and highlight
                    const originalColor = new THREE.Color();
                    instancedMesh.getColorAt(instanceId, originalColor);
                    originalColors.set(instanceId, originalColor.clone());
                    instancedMesh.setColorAt(instanceId, highlightColor);
                    instancedMesh.instanceColor.needsUpdate = true;

                    selectedInstanceId = instanceId;
                    document.getElementById('selected').textContent = `Instance #${instanceId}`;
                }
            } else if (currentMode === 'regular') {
                const intersects = raycaster.intersectObjects(regularMeshes);
                if (intersects.length > 0) {
                    const mesh = intersects[0].object;
                    document.getElementById('selected').textContent = `Mesh #${mesh.userData.index}`;
                }
            }
        });

        // ============================================
        // UI 事件 / UI Events
        // ============================================

        document.getElementById('btn-regular').addEventListener('click', () => switchMode('regular'));
        document.getElementById('btn-instanced').addEventListener('click', () => switchMode('instanced'));

        const countSlider = document.getElementById('count-slider');
        countSlider.addEventListener('input', (e) => {
            instanceCount = parseInt(e.target.value);
            document.getElementById('count-label').textContent = instanceCount;
            document.getElementById('instance-count').textContent = instanceCount;
        });
        countSlider.addEventListener('change', () => {
            switchMode(currentMode);
        });

        // ============================================
        // 动画循环 / Animation Loop
        // ============================================

        const clock = new THREE.Clock();
        const dummy = new THREE.Object3D();

        // FPS 计算 / FPS calculation
        let frameCount = 0;
        let lastFpsTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 波浪动画 / Wave animation
            if (currentMode === 'instanced' && instancedMesh) {
                for (let i = 0; i < instanceCount; i++) {
                    const pos = getGridPosition(i, instanceCount);
                    // 波浪效果 / Wave effect
                    const wave = Math.sin(pos.x * 0.3 + elapsedTime * 2) *
                                 Math.cos(pos.z * 0.3 + elapsedTime * 2) * 2;

                    dummy.position.set(pos.x, 0.5 + wave, pos.z);
                    dummy.rotation.set(0, elapsedTime * 0.5, 0);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                }
                instancedMesh.instanceMatrix.needsUpdate = true;
            } else if (currentMode === 'regular') {
                regularMeshes.forEach((mesh, i) => {
                    const pos = getGridPosition(i, instanceCount);
                    const wave = Math.sin(pos.x * 0.3 + elapsedTime * 2) *
                                 Math.cos(pos.z * 0.3 + elapsedTime * 2) * 2;
                    mesh.position.y = 0.5 + wave;
                    mesh.rotation.y = elapsedTime * 0.5;
                });
            }

            controls.update();
            renderer.render(scene, camera);

            // FPS 计算 / FPS calculation
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
                const fpsEl = document.getElementById('fps-display');
                fpsEl.textContent = `FPS: ${fps}`;
                fpsEl.style.color = fps >= 50 ? '#4caf50' : fps >= 30 ? '#ff9800' : '#f44336';
                frameCount = 0;
                lastFpsTime = now;

                // 更新渲染信息 / Update render info
                document.getElementById('draw-calls').textContent = renderer.info.render.calls;
                document.getElementById('triangles').textContent =
                    renderer.info.render.triangles.toLocaleString();
            }
        }

        // ============================================
        // 响应式处理 / Responsive Handling
        // ============================================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始化 / Initialize
        switchMode('instanced');
        animate();

        console.log('%c实例化渲染提示 / InstancedMesh Tips:', 'color: #4caf50; font-weight: bold; font-size: 14px;');
        console.log('1. InstancedMesh 使用单次 draw call 渲染多个实例 / InstancedMesh renders multiple instances in a single draw call');
        console.log('2. 使用 setMatrixAt() 更新实例变换 / Use setMatrixAt() to update instance transforms');
        console.log('3. 使用 setColorAt() 设置每个实例的颜色 / Use setColorAt() to set per-instance colors');
        console.log('4. 点击实例可以获取 instanceId / Click on instances to get instanceId');

    </script>
</body>
</html>
