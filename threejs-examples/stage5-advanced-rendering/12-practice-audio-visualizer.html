<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习：音乐可视化 / Practice: Audio Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #050510; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.85); color: #fff;
            padding: 14px 18px; border-radius: 8px;
            max-width: 360px; font-size: 13px; line-height: 1.5;
            z-index: 10;
        }
        #info h2 { margin: 0 0 6px; font-size: 15px; color: #f6a; }
        #info p { margin: 3px 0; }
        .ctrl-btn {
            display: inline-block; padding: 6px 14px; margin: 4px 4px 0 0;
            border: 1px solid #f6a; background: transparent; color: #f6a;
            border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #f6a; color: #000; }
        .ctrl-btn.active { background: #f6a; color: #000; }
        .slider-group { margin: 6px 0; }
        .slider-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .slider-group input[type=range] {
            width: 100%; height: 4px; -webkit-appearance: none;
            background: #444; border-radius: 2px; outline: none;
        }
        .slider-group input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #f6a; border-radius: 50%; cursor: pointer;
        }
        .val { float: right; color: #f6a; font-family: monospace; }
        #fileInput {
            margin-top: 6px; padding: 4px; font-size: 11px; color: #aaa;
            width: 100%;
        }
        #statusMsg { margin-top: 4px; color: #888; font-size: 11px; }
    </style>
</head>
<body>
<div id="info">
    <h2>练习：音乐可视化 / Practice: Audio Visualizer</h2>
    <p>使用 Web Audio API 获取频率数据，驱动3D可视化场景。</p>
    <p style="color:#888;">Web Audio API frequency data drives 3D visualization.</p>
    <div style="margin-top:8px;">
        <button class="ctrl-btn" id="btnMic">麦克风 Mic</button>
        <button class="ctrl-btn" id="btnDemo">演示模式 Demo</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*" title="选择音频文件 / Choose audio file">
    <div class="slider-group">
        <label>音量 Volume <span class="val" id="vVolume">0.70</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </div>
    <div class="slider-group">
        <label>柱子数量 Bars <span class="val" id="vBars">64</span></label>
        <input type="range" id="bars" min="16" max="128" step="1" value="64">
    </div>
    <div class="slider-group">
        <label>高度缩放 Height Scale <span class="val" id="vHeight">3.0</span></label>
        <input type="range" id="heightScale" min="1" max="10" step="0.1" value="3.0">
    </div>
    <p id="statusMsg">选择音频源开始 / Select an audio source to begin</p>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============ 场景设置 / Scene Setup ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// ============ 灯光 / Lighting ============
scene.add(new THREE.AmbientLight(0x222244, 0.5));
const pointLight1 = new THREE.PointLight(0xff6688, 2, 20);
pointLight1.position.set(5, 5, 5);
scene.add(pointLight1);
const pointLight2 = new THREE.PointLight(0x6688ff, 2, 20);
pointLight2.position.set(-5, 5, -5);
scene.add(pointLight2);

// ============ 后处理 - 泛光 / Post-Processing - Bloom ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.0, 0.4, 0.3
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ============ 音频设置 / Audio Setup ============
let audioContext, analyser, dataArray, source;
let audioElement = null;
let isAudioActive = false;
const statusMsg = document.getElementById('statusMsg');

// 音频参数 / Audio parameters
let barCount = 64;
let heightScale = 3.0;
let volumeValue = 0.7;

// 初始化音频上下文 / Initialize audio context
function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256; // FFT 大小决定频率分辨率 / FFT size determines frequency resolution
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
}

// 连接麦克风 / Connect microphone
async function connectMicrophone() {
    try {
        initAudio();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (source) source.disconnect();
        source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        // 不连接到 destination 以避免回声 / Don't connect to destination to avoid echo
        isAudioActive = true;
        statusMsg.textContent = '麦克风已连接 / Microphone connected';
        document.getElementById('btnMic').classList.add('active');
        document.getElementById('btnDemo').classList.remove('active');
    } catch (err) {
        statusMsg.textContent = '麦克风访问被拒绝 / Microphone access denied';
        console.error('Microphone error:', err);
    }
}

// 加载音频文件 / Load audio file
function loadAudioFile(file) {
    initAudio();
    if (audioElement) {
        audioElement.pause();
        audioElement.remove();
    }
    audioElement = new Audio();
    audioElement.src = URL.createObjectURL(file);
    audioElement.crossOrigin = 'anonymous';

    if (source) source.disconnect();
    source = audioContext.createMediaElementSource(audioElement);

    // 创建增益节点控制音量 / Create gain node for volume control
    const gainNode = audioContext.createGain();
    gainNode.gain.value = volumeValue;
    source.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioContext.destination);

    audioElement.play();
    isAudioActive = true;
    statusMsg.textContent = `正在播放: ${file.name} / Playing: ${file.name}`;
    document.getElementById('btnMic').classList.remove('active');
    document.getElementById('btnDemo').classList.remove('active');

    // 保存增益节点引用 / Store gain node reference
    window._gainNode = gainNode;
}

// ============ 3D 可视化元素 / 3D Visualization Elements ============

// 中央球体 - 随低频脉动 / Central sphere - pulses with bass
const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
const sphereMat = new THREE.MeshStandardMaterial({
    color: 0xff6688,
    emissive: 0xff2244,
    emissiveIntensity: 0.5,
    roughness: 0.2,
    metalness: 0.8
});
const centralSphere = new THREE.Mesh(sphereGeo, sphereMat);
centralSphere.position.y = 1;
scene.add(centralSphere);

// 频率柱状图 - 环形排列 / Frequency bars - circular arrangement
const barsGroup = new THREE.Group();
scene.add(barsGroup);

let barMeshes = [];
function createBars() {
    // 清除旧的柱子 / Clear old bars
    barMeshes.forEach(m => {
        barsGroup.remove(m);
        m.geometry.dispose();
        m.material.dispose();
    });
    barMeshes = [];

    const radius = 5; // 环形半径 / Ring radius
    for (let i = 0; i < barCount; i++) {
        const angle = (i / barCount) * Math.PI * 2;
        // 柱子几何体 / Bar geometry
        const geo = new THREE.BoxGeometry(0.2, 1, 0.2);
        geo.translate(0, 0.5, 0); // 底部对齐 / Align to bottom

        // 颜色映射：低频暖色，高频冷色
        // Color mapping: warm for low freq, cool for high freq
        const hue = (i / barCount) * 0.7; // 0=红, 0.7=蓝紫
        const color = new THREE.Color().setHSL(hue, 0.9, 0.5);
        const emissiveColor = new THREE.Color().setHSL(hue, 1.0, 0.3);

        const mat = new THREE.MeshStandardMaterial({
            color: color,
            emissive: emissiveColor,
            emissiveIntensity: 1.0,
            roughness: 0.3,
            metalness: 0.7
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
            Math.cos(angle) * radius,
            0,
            Math.sin(angle) * radius
        );
        mesh.lookAt(0, 0, 0); // 面向中心 / Face center
        mesh.rotation.x = 0;
        mesh.rotation.z = 0;
        barsGroup.add(mesh);
        barMeshes.push(mesh);
    }
}
createBars();

// 粒子系统 - 环绕轨道 / Particle system - orbiting
const particleCount = 2000;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);
const particlePhases = new Float32Array(particleCount); // 相位 / Phase

for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 4;
    particlePositions[i * 3] = Math.cos(angle) * r;
    particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 4;
    particlePositions[i * 3 + 2] = Math.sin(angle) * r;

    const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.6);
    particleColors[i * 3] = color.r;
    particleColors[i * 3 + 1] = color.g;
    particleColors[i * 3 + 2] = color.b;
    particlePhases[i] = Math.random() * Math.PI * 2;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
const particleMat = new THREE.PointsMaterial({
    size: 0.05,
    vertexColors: true,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// 地板 / Floor
const floorGeo = new THREE.CircleGeometry(12, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

// ============ 演示模式 - 模拟音频数据 / Demo Mode - Simulated Audio Data ============
let demoMode = false;
function getDemoFrequencyData(t) {
    const data = new Uint8Array(128);
    for (let i = 0; i < 128; i++) {
        const freq = i / 128;
        // 模拟音乐频谱：低频强，高频弱 + 节拍
        // Simulate music spectrum: strong bass, weak treble + beat
        const bass = Math.max(0, Math.sin(t * 4) * 0.5 + 0.5) * (1 - freq) * 200;
        const mid = Math.sin(t * 6 + freq * 5) * 40 * Math.exp(-Math.pow(freq - 0.3, 2) * 20);
        const high = Math.sin(t * 10 + freq * 20) * 20 * freq;
        const beat = Math.pow(Math.max(0, Math.sin(t * 2 * Math.PI)), 8) * (1 - freq) * 150;
        data[i] = Math.min(255, Math.max(0, bass + mid + high + beat + Math.random() * 20));
    }
    return data;
}

// ============ UI 事件 / UI Events ============
document.getElementById('btnMic').addEventListener('click', connectMicrophone);

document.getElementById('btnDemo').addEventListener('click', () => {
    demoMode = !demoMode;
    isAudioActive = demoMode;
    document.getElementById('btnDemo').classList.toggle('active', demoMode);
    document.getElementById('btnMic').classList.remove('active');
    statusMsg.textContent = demoMode ? '演示模式 / Demo mode' : '已停止 / Stopped';
});

document.getElementById('fileInput').addEventListener('change', (e) => {
    if (e.target.files[0]) {
        demoMode = false;
        loadAudioFile(e.target.files[0]);
    }
});

document.getElementById('volume').addEventListener('input', (e) => {
    volumeValue = parseFloat(e.target.value);
    document.getElementById('vVolume').textContent = volumeValue.toFixed(2);
    if (window._gainNode) window._gainNode.gain.value = volumeValue;
});

document.getElementById('bars').addEventListener('input', (e) => {
    barCount = parseInt(e.target.value);
    document.getElementById('vBars').textContent = barCount;
    createBars();
});

document.getElementById('heightScale').addEventListener('input', (e) => {
    heightScale = parseFloat(e.target.value);
    document.getElementById('vHeight').textContent = heightScale.toFixed(1);
});

// ============ 窗口自适应 / Resize Handler ============
window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
});

// ============ 动画循环 / Animation Loop ============
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // 获取频率数据 / Get frequency data
    let freqData;
    if (demoMode) {
        freqData = getDemoFrequencyData(t);
    } else if (isAudioActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        freqData = dataArray;
    } else {
        freqData = new Uint8Array(128).fill(0);
    }

    // 计算低频平均值（用于球体脉动）/ Average bass (for sphere pulsing)
    let bassAvg = 0;
    for (let i = 0; i < 10; i++) bassAvg += freqData[i];
    bassAvg = bassAvg / 10 / 255;

    // 更新中央球体 / Update central sphere
    const sphereScale = 1 + bassAvg * 1.5;
    centralSphere.scale.set(sphereScale, sphereScale, sphereScale);
    sphereMat.emissiveIntensity = 0.3 + bassAvg * 2.0;
    centralSphere.rotation.y = t * 0.3;

    // 更新频率柱状图 / Update frequency bars
    const step = Math.floor(freqData.length / barCount);
    for (let i = 0; i < barMeshes.length; i++) {
        const idx = Math.min(i * step, freqData.length - 1);
        const value = freqData[idx] / 255;
        const height = value * heightScale + 0.05;

        // 更新柱子高度 / Update bar height
        barMeshes[i].scale.y = height;

        // 更新发光强度 / Update emissive intensity
        barMeshes[i].material.emissiveIntensity = value * 2.0;
    }

    // 更新粒子 / Update particles
    const posArr = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
        const phase = particlePhases[i];
        const freqIdx = Math.floor((i / particleCount) * freqData.length);
        const freqVal = freqData[freqIdx] / 255;

        // 粒子随音乐跳动 / Particles bounce with music
        const angle = t * 0.2 + phase;
        const r = 6 + Math.sin(angle + phase) * 2 + freqVal * 2;
        posArr[i * 3] = Math.cos(angle) * r;
        posArr[i * 3 + 1] = Math.sin(t * 2 + phase) * (1 + freqVal * 2);
        posArr[i * 3 + 2] = Math.sin(angle) * r;
    }
    particles.geometry.attributes.position.needsUpdate = true;

    // 粒子材质大小随节拍 / Particle size pulses with beat
    particleMat.size = 0.04 + bassAvg * 0.1;

    // 灯光颜色变化 / Light color variation
    const hue1 = (t * 0.05) % 1;
    pointLight1.color.setHSL(hue1, 0.9, 0.5);
    pointLight2.color.setHSL((hue1 + 0.5) % 1, 0.9, 0.5);

    controls.update();
    composer.render();
}

animate();
</script>
</body>
</html>
