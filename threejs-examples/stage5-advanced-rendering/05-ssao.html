<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境遮蔽 / Screen Space Ambient Occlusion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 14px 18px; border-radius: 8px;
            max-width: 320px; font-size: 13px; line-height: 1.6;
            z-index: 10;
        }
        #info h2 { margin: 0 0 6px; font-size: 15px; color: #8cf; }
        .slider-group { margin: 6px 0; }
        .slider-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .slider-group input[type=range] {
            width: 100%; height: 4px; -webkit-appearance: none;
            background: #444; border-radius: 2px; outline: none;
        }
        .slider-group input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #8cf; border-radius: 50%; cursor: pointer;
        }
        .val { float: right; color: #8cf; font-family: monospace; }
        .toggle-btn {
            padding: 6px 14px; margin: 4px 4px 0 0;
            border: 1px solid #8cf; background: transparent; color: #8cf;
            border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .toggle-btn:hover, .toggle-btn.active { background: #8cf; color: #000; }
    </style>
</head>
<body>
<div id="info">
    <h2>环境遮蔽 / SSAO</h2>
    <p>SSAO（屏幕空间环境遮蔽）在缝隙、角落和物体接触处添加暗部，增强深度感知。</p>
    <p style="color:#888;">SSAO darkens crevices and contact areas to enhance depth perception.</p>
    <div style="margin-top:8px;">
        <button class="toggle-btn active" id="btnSSAO">SSAO 开启</button>
        <button class="toggle-btn" id="btnToggle">切换对比</button>
    </div>
    <div class="slider-group">
        <label>半径 Radius <span class="val" id="vRadius">0.50</span></label>
        <input type="range" id="radius" min="0.1" max="2" step="0.01" value="0.5">
    </div>
    <div class="slider-group">
        <label>强度 Intensity <span class="val" id="vIntensity">1.50</span></label>
        <input type="range" id="intensity" min="0" max="5" step="0.1" value="1.5">
    </div>
    <div class="slider-group">
        <label>核心大小 Kernel Size <span class="val" id="vKernel">16</span></label>
        <input type="range" id="kernelSize" min="4" max="64" step="1" value="16">
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============ 场景设置 / Scene Setup ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x888899);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 6, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ============ 灯光 - 使用均匀照明以突出 SSAO 效果 / Even lighting to highlight SSAO ============
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaabbff, 0.4);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

// ============ 创建建筑场景（有缝隙和角落）/ Architectural scene with crevices ============
const wallMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9, metalness: 0.0 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0x6688aa, roughness: 0.7, metalness: 0.1 });

// 地板 / Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), wallMat.clone());
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 堆叠的盒子 - 在接触处产生遮蔽 / Stacked boxes - AO at contact points
for (let i = 0; i < 4; i++) {
    const size = 1.5 - i * 0.2;
    const box = new THREE.Mesh(new THREE.BoxGeometry(size, 0.5, size), wallMat.clone());
    box.position.set(-2, 0.25 + i * 0.5, -2);
    scene.add(box);
}

// 墙角 / Wall corner
const wall1 = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 0.2), wallMat.clone());
wall1.position.set(0, 1.5, -3);
scene.add(wall1);
const wall2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 6), wallMat.clone());
wall2.position.set(-3, 1.5, 0);
scene.add(wall2);

// 台阶 / Steps
for (let i = 0; i < 5; i++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 0.6), accentMat.clone());
    step.position.set(2, 0.15 + i * 0.3, -2 + i * 0.6);
    scene.add(step);
}

// 柱子群 / Column group
for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2, 16), wallMat.clone());
        col.position.set(1 + i * 1.2, 1, 2 + j * 1.2);
        scene.add(col);
        // 柱基 / Column base
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.5), wallMat.clone());
        base.position.set(1 + i * 1.2, 0.05, 2 + j * 1.2);
        scene.add(base);
    }
}

// 拱形结构 / Arch structure
const archGroup = new THREE.Group();
const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2, 0.3), wallMat.clone());
pillarL.position.set(-0.8, 1, 0);
archGroup.add(pillarL);
const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2, 0.3), wallMat.clone());
pillarR.position.set(0.8, 1, 0);
archGroup.add(pillarR);
const lintel = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 0.3), wallMat.clone());
lintel.position.set(0, 2.15, 0);
archGroup.add(lintel);
archGroup.position.set(0, 0, 2);
scene.add(archGroup);

// 凹陷区域 / Recessed areas
const recess = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.95 }));
recess.position.set(-1.5, 1.2, -2.8);
scene.add(recess);

// ============ 后处理 - SSAO / Post-Processing - SSAO ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// SSAO 通道 / SSAO pass
const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 0.5;
ssaoPass.minDistance = 0.001;
ssaoPass.maxDistance = 0.1;
composer.addPass(ssaoPass);
composer.addPass(new OutputPass());

let ssaoEnabled = true;

// ============ UI 控制 / UI Controls ============
document.getElementById('btnSSAO').addEventListener('click', () => {
    ssaoEnabled = !ssaoEnabled;
    ssaoPass.enabled = ssaoEnabled;
    const btn = document.getElementById('btnSSAO');
    btn.textContent = ssaoEnabled ? 'SSAO 开启' : 'SSAO 关闭';
    btn.classList.toggle('active', ssaoEnabled);
});

// 快速切换对比 / Quick toggle comparison
document.getElementById('btnToggle').addEventListener('click', () => {
    ssaoEnabled = !ssaoEnabled;
    ssaoPass.enabled = ssaoEnabled;
    const btn = document.getElementById('btnSSAO');
    btn.textContent = ssaoEnabled ? 'SSAO 开启' : 'SSAO 关闭';
    btn.classList.toggle('active', ssaoEnabled);
});

document.getElementById('radius').addEventListener('input', (e) => {
    ssaoPass.kernelRadius = parseFloat(e.target.value);
    document.getElementById('vRadius').textContent = parseFloat(e.target.value).toFixed(2);
});
document.getElementById('intensity').addEventListener('input', (e) => {
    // SSAOPass 没有直接的 intensity 属性，通过 kernelRadius 间接控制
    // SSAOPass lacks direct intensity; control via kernelRadius indirectly
    ssaoPass.minDistance = parseFloat(e.target.value) * 0.001;
    document.getElementById('vIntensity').textContent = parseFloat(e.target.value).toFixed(2);
});
document.getElementById('kernelSize').addEventListener('input', (e) => {
    const size = parseInt(e.target.value);
    // 重新生成核心样本 / Regenerate kernel samples
    ssaoPass.kernelSize = size;
    document.getElementById('vKernel').textContent = size;
});

// ============ 窗口自适应 / Resize Handler ============
window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
});

// ============ 动画循环 / Animation Loop ============
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    composer.render();
}

animate();
</script>
</body>
</html>
