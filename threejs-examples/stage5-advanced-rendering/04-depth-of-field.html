<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景深 / Depth of Field (BokehPass)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 14px 18px; border-radius: 8px;
            max-width: 320px; font-size: 13px; line-height: 1.6;
            z-index: 10;
        }
        #info h2 { margin: 0 0 6px; font-size: 15px; color: #fa6; }
        .slider-group { margin: 6px 0; }
        .slider-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .slider-group input[type=range] {
            width: 100%; height: 4px; -webkit-appearance: none;
            background: #444; border-radius: 2px; outline: none;
        }
        .slider-group input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #fa6; border-radius: 50%; cursor: pointer;
        }
        .val { float: right; color: #fa6; font-family: monospace; }
        #clickHint { color: #666; font-size: 11px; margin-top: 6px; font-style: italic; }
    </style>
</head>
<body>
<div id="info">
    <h2>景深效果 / Depth of Field</h2>
    <p>BokehPass 模拟相机景深效果：焦点处清晰，前后模糊。</p>
    <p style="color:#888;">Simulates camera depth of field: sharp at focus, blurred elsewhere.</p>
    <div class="slider-group">
        <label>焦点距离 Focus <span class="val" id="vFocus">10.0</span></label>
        <input type="range" id="focus" min="1" max="30" step="0.1" value="10">
    </div>
    <div class="slider-group">
        <label>光圈 Aperture <span class="val" id="vAperture">0.002</span></label>
        <input type="range" id="aperture" min="0.0001" max="0.01" step="0.0001" value="0.002">
    </div>
    <div class="slider-group">
        <label>最大模糊 Max Blur <span class="val" id="vMaxBlur">0.010</span></label>
        <input type="range" id="maxblur" min="0.001" max="0.03" step="0.001" value="0.01">
    </div>
    <p id="clickHint">点击物体设置焦点 / Click an object to set focus point</p>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============ 场景设置 / Scene Setup ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 20, 40);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ============ 灯光 / Lighting ============
scene.add(new THREE.AmbientLight(0x404060, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0xff8844, 1, 20);
pointLight.position.set(-3, 5, 0);
scene.add(pointLight);

// ============ 创建不同距离的物体 / Objects at Various Distances ============
const clickableObjects = [];

// 地板 / Floor
const floorMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 前景物体（近处）/ Foreground objects (near)
const nearColors = [0xff4466, 0xff6644, 0xff8844];
for (let i = 0; i < 5; i++) {
    const geo = new THREE.BoxGeometry(0.8, 0.8 + Math.random() * 0.5, 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: nearColors[i % 3], roughness: 0.3, metalness: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(-3 + i * 1.5, 0.5, 3 + Math.random());
    scene.add(mesh);
    clickableObjects.push(mesh);
}

// 中景物体（中距离）/ Midground objects (middle)
const midColors = [0x44ff66, 0x44ffaa, 0x88ff44];
for (let i = 0; i < 5; i++) {
    const geo = new THREE.CylinderGeometry(0.3, 0.4, 1.2 + Math.random() * 0.6, 16);
    const mat = new THREE.MeshStandardMaterial({ color: midColors[i % 3], roughness: 0.3, metalness: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(-3 + i * 1.5, 0.7, 0);
    scene.add(mesh);
    clickableObjects.push(mesh);
}

// 远景物体（远处）/ Background objects (far)
const farColors = [0x4466ff, 0x6644ff, 0x4488ff];
for (let i = 0; i < 5; i++) {
    const geo = new THREE.SphereGeometry(0.5 + Math.random() * 0.3, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: farColors[i % 3], roughness: 0.3, metalness: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(-3 + i * 1.5, 0.6, -4 - Math.random() * 2);
    scene.add(mesh);
    clickableObjects.push(mesh);
}

// 最远处的大物体 / Farthest large objects
for (let i = 0; i < 3; i++) {
    const geo = new THREE.TorusKnotGeometry(0.6, 0.2, 64, 16);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffaaff, roughness: 0.2, metalness: 0.8 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(-4 + i * 4, 1.5, -8 - i);
    scene.add(mesh);
    clickableObjects.push(mesh);
}

// 焦点指示器 / Focus indicator
const focusIndicator = new THREE.Mesh(
    new THREE.RingGeometry(0.3, 0.4, 32),
    new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
);
focusIndicator.rotation.x = -Math.PI / 2;
focusIndicator.visible = false;
scene.add(focusIndicator);

// ============ 后处理 - 景深 / Post-Processing - DOF ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// BokehPass: 焦平面距离, 光圈大小, 最大模糊
// BokehPass: focal plane distance, aperture size, max blur
const bokehPass = new BokehPass(scene, camera, {
    focus: 10.0,
    aperture: 0.002,
    maxblur: 0.01
});
composer.addPass(bokehPass);
composer.addPass(new OutputPass());

// ============ 点击设置焦点 / Click to Set Focus ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(clickableObjects);
    if (intersects.length > 0) {
        // 计算到交点的距离 / Calculate distance to intersection
        const dist = intersects[0].distance;
        bokehPass.uniforms['focus'].value = dist;
        document.getElementById('focus').value = dist;
        document.getElementById('vFocus').textContent = dist.toFixed(1);

        // 显示焦点指示器 / Show focus indicator
        focusIndicator.position.copy(intersects[0].point);
        focusIndicator.position.y = 0.05;
        focusIndicator.visible = true;
        setTimeout(() => { focusIndicator.visible = false; }, 2000);
    }
});

// ============ UI 滑块 / UI Sliders ============
document.getElementById('focus').addEventListener('input', (e) => {
    bokehPass.uniforms['focus'].value = parseFloat(e.target.value);
    document.getElementById('vFocus').textContent = parseFloat(e.target.value).toFixed(1);
});
document.getElementById('aperture').addEventListener('input', (e) => {
    bokehPass.uniforms['aperture'].value = parseFloat(e.target.value);
    document.getElementById('vAperture').textContent = parseFloat(e.target.value).toFixed(4);
});
document.getElementById('maxblur').addEventListener('input', (e) => {
    bokehPass.uniforms['maxblur'].value = parseFloat(e.target.value);
    document.getElementById('vMaxBlur').textContent = parseFloat(e.target.value).toFixed(3);
});

// ============ 窗口自适应 / Resize Handler ============
window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
});

// ============ 动画循环 / Animation Loop ============
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // 轻微动画化远景物体 / Gently animate far objects
    clickableObjects.forEach((obj, i) => {
        obj.rotation.y += 0.003 * ((i % 3) + 1);
    });

    controls.update();
    composer.render();
}

animate();
</script>
</body>
</html>
