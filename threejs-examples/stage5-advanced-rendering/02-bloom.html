<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泛光效果 / Bloom Effect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 14px 18px; border-radius: 8px;
            max-width: 320px; font-size: 13px; line-height: 1.6;
            z-index: 10;
        }
        #info h2 { margin: 0 0 6px; font-size: 15px; color: #f8a; }
        #info p { margin: 2px 0; }
        .slider-group { margin: 6px 0; }
        .slider-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .slider-group input[type=range] {
            width: 100%; height: 4px; -webkit-appearance: none;
            background: #444; border-radius: 2px; outline: none;
        }
        .slider-group input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #f8a; border-radius: 50%; cursor: pointer;
        }
        .val { float: right; color: #f8a; font-family: monospace; }
    </style>
</head>
<body>
<!-- 信息面板 / Info panel -->
<div id="info">
    <h2>泛光效果 / Bloom Effect</h2>
    <p>UnrealBloomPass 让高亮度区域产生发光效果，模拟真实相机中的光晕。</p>
    <p style="color:#888;">Bloom makes bright areas glow, simulating camera lens flare.</p>
    <!-- 参数滑块 / Parameter sliders -->
    <div class="slider-group">
        <label>阈值 Threshold <span class="val" id="vThreshold">0.30</span></label>
        <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.30">
    </div>
    <div class="slider-group">
        <label>强度 Strength <span class="val" id="vStrength">1.50</span></label>
        <input type="range" id="strength" min="0" max="3" step="0.01" value="1.50">
    </div>
    <div class="slider-group">
        <label>半径 Radius <span class="val" id="vRadius">0.40</span></label>
        <input type="range" id="radius" min="0" max="1" step="0.01" value="0.40">
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============ 场景初始化 / Scene Init ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ============ 创建发光物体 / Create Emissive Objects ============
// 发光球体组 / Glowing spheres group
const emissiveObjects = [];
const emissiveColors = [0xff2266, 0x22ff88, 0x2266ff, 0xff8822, 0xff22ff, 0x22ffff];

// 霓虹环 / Neon rings
for (let i = 0; i < 6; i++) {
    const geo = new THREE.TorusGeometry(1.5 + i * 0.3, 0.04, 16, 64);
    const mat = new THREE.MeshStandardMaterial({
        color: emissiveColors[i],
        emissive: emissiveColors[i],
        emissiveIntensity: 2.0,
        roughness: 0.1,
        metalness: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.PI / 2 + (i - 3) * 0.15;
    mesh.position.y = 1.5;
    scene.add(mesh);
    emissiveObjects.push({ mesh, mat, baseIntensity: 2.0, phase: i * 0.5 });
}

// 发光球体 / Glowing spheres
for (let i = 0; i < 20; i++) {
    const radius = 0.1 + Math.random() * 0.2;
    const geo = new THREE.SphereGeometry(radius, 16, 16);
    const color = new THREE.Color().setHSL(Math.random(), 1.0, 0.5);
    const mat = new THREE.MeshStandardMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 3.0,
        roughness: 0.0,
        metalness: 1.0
    });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = Math.random() * Math.PI * 2;
    const dist = 2 + Math.random() * 4;
    mesh.position.set(
        Math.cos(angle) * dist,
        0.5 + Math.random() * 3,
        Math.sin(angle) * dist
    );
    scene.add(mesh);
    emissiveObjects.push({
        mesh, mat, baseIntensity: 3.0, phase: Math.random() * 10,
        orbitAngle: angle, orbitDist: dist, orbitSpeed: 0.2 + Math.random() * 0.5,
        baseY: mesh.position.y
    });
}

// 暗色参考物体（不会发光）/ Dark reference objects (won't bloom)
for (let i = 0; i < 8; i++) {
    const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const mat = new THREE.MeshStandardMaterial({
        color: 0x333333, roughness: 0.9, metalness: 0.1
    });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = (i / 8) * Math.PI * 2;
    mesh.position.set(Math.cos(angle) * 5, 0.25, Math.sin(angle) * 5);
    scene.add(mesh);
}

// 地板 / Floor
const floorGeo = new THREE.PlaneGeometry(30, 30);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.9 });
scene.add(new THREE.Mesh(floorGeo, floorMat).rotateX(-Math.PI / 2));

// 微弱环境光 / Dim ambient light
scene.add(new THREE.AmbientLight(0x222233, 0.3));

// ============ 后处理 - 泛光 / Post-Processing - Bloom ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// UnrealBloomPass 参数: 分辨率, 强度, 半径, 阈值
// UnrealBloomPass params: resolution, strength, radius, threshold
const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.5,  // strength 强度
    0.4,  // radius 半径
    0.3   // threshold 阈值
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ============ UI 控件 / UI Controls ============
const sliderThreshold = document.getElementById('threshold');
const sliderStrength = document.getElementById('strength');
const sliderRadius = document.getElementById('radius');

sliderThreshold.addEventListener('input', (e) => {
    bloomPass.threshold = parseFloat(e.target.value);
    document.getElementById('vThreshold').textContent = parseFloat(e.target.value).toFixed(2);
});
sliderStrength.addEventListener('input', (e) => {
    bloomPass.strength = parseFloat(e.target.value);
    document.getElementById('vStrength').textContent = parseFloat(e.target.value).toFixed(2);
});
sliderRadius.addEventListener('input', (e) => {
    bloomPass.radius = parseFloat(e.target.value);
    document.getElementById('vRadius').textContent = parseFloat(e.target.value).toFixed(2);
});

// ============ 窗口自适应 / Resize Handler ============
window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
});

// ============ 动画循环 / Animation Loop ============
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // 动画化发光物体 / Animate emissive objects
    emissiveObjects.forEach((obj) => {
        // 脉动发光强度 / Pulsing emissive intensity
        obj.mat.emissiveIntensity = obj.baseIntensity * (0.7 + 0.3 * Math.sin(t * 2 + obj.phase));

        // 轨道运动（球体）/ Orbital motion (spheres)
        if (obj.orbitAngle !== undefined) {
            obj.orbitAngle += obj.orbitSpeed * 0.01;
            obj.mesh.position.x = Math.cos(obj.orbitAngle) * obj.orbitDist;
            obj.mesh.position.z = Math.sin(obj.orbitAngle) * obj.orbitDist;
            obj.mesh.position.y = obj.baseY + Math.sin(t * 1.5 + obj.phase) * 0.5;
        }
    });

    controls.update();
    composer.render();
}

animate();
</script>
</body>
</html>
