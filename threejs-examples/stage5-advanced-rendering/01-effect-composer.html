<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后处理基础 / Effect Composer Basics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        /* 信息面板 / Info panel */
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 14px 18px; border-radius: 8px;
            max-width: 340px; font-size: 13px; line-height: 1.6;
            pointer-events: auto; z-index: 10;
        }
        #info h2 { margin: 0 0 8px; font-size: 15px; color: #6cf; }
        #info .pipeline { margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; font-family: monospace; font-size: 12px; }
        #controls { margin-top: 10px; }
        #controls button {
            padding: 6px 14px; margin: 4px 4px 0 0; border: 1px solid #6cf;
            background: transparent; color: #6cf; border-radius: 4px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        #controls button:hover, #controls button.active { background: #6cf; color: #000; }
    </style>
</head>
<body>
<!-- 信息面板 / Info panel -->
<div id="info">
    <h2>后处理基础 / Effect Composer Basics</h2>
    <p>EffectComposer 是 Three.js 后处理的核心，它将渲染过程分成多个 Pass（通道），每个 Pass 可以对画面进行处理。</p>
    <p style="color:#aaa;">EffectComposer is the core of Three.js post-processing, splitting rendering into multiple passes.</p>
    <!-- 渲染管线可视化 / Render pipeline visualization -->
    <div class="pipeline">
        Scene → RenderPass → [Effect Passes] → Output<br>
        场景 → 渲染通道 → [效果通道] → 输出
    </div>
    <div id="controls">
        <button id="btnDirect">直接渲染 / Direct</button>
        <button id="btnComposer" class="active">合成器渲染 / Composer</button>
    </div>
    <p id="status" style="margin-top:8px; color:#ff0;">当前: 合成器渲染 (Composer)</p>
</div>

<!-- Three.js CDN 导入映射 / Import map for Three.js CDN -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
// 导入依赖 / Import dependencies
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============ 场景设置 / Scene Setup ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 10, 30);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// 轨道控制器 / Orbit controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// ============ 灯光 / Lighting ============
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0xff6688, 2, 10);
pointLight1.position.set(-3, 2, 2);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x6688ff, 2, 10);
pointLight2.position.set(3, 2, -2);
scene.add(pointLight2);

// ============ 创建场景物体 / Create Scene Objects ============
// 地板 / Floor
const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 网格辅助 / Grid helper
const grid = new THREE.GridHelper(20, 20, 0x444466, 0x222233);
scene.add(grid);

// 彩色物体数组 / Array of colorful objects
const objects = [];
const colors = [0xff4466, 0x44ff88, 0x4488ff, 0xffaa22, 0xff44ff, 0x44ffff];
const geometries = [
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.SphereGeometry(0.6, 32, 32),
    new THREE.TorusGeometry(0.5, 0.2, 16, 32),
    new THREE.ConeGeometry(0.5, 1, 16),
    new THREE.TorusKnotGeometry(0.4, 0.15, 64, 16),
    new THREE.OctahedronGeometry(0.6)
];

// 创建多个彩色物体 / Create multiple colorful objects
for (let i = 0; i < 12; i++) {
    const geo = geometries[i % geometries.length];
    const mat = new THREE.MeshStandardMaterial({
        color: colors[i % colors.length],
        roughness: 0.3,
        metalness: 0.6
    });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = (i / 12) * Math.PI * 2;
    const radius = 2.5 + (i % 2) * 1.5;
    mesh.position.set(
        Math.cos(angle) * radius,
        0.6 + Math.sin(i * 0.8) * 0.5,
        Math.sin(angle) * radius
    );
    mesh.rotation.set(Math.random(), Math.random(), Math.random());
    scene.add(mesh);
    objects.push(mesh);
}

// 中央发光球体 / Central glowing sphere
const glowGeo = new THREE.SphereGeometry(0.8, 32, 32);
const glowMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0x6688ff,
    emissiveIntensity: 0.8,
    roughness: 0.1,
    metalness: 0.9
});
const glowSphere = new THREE.Mesh(glowGeo, glowMat);
glowSphere.position.set(0, 1.5, 0);
scene.add(glowSphere);

// ============ 后处理设置 / Post-Processing Setup ============
// 创建效果合成器 / Create Effect Composer
const composer = new EffectComposer(renderer);

// 渲染通道 - 渲染场景 / Render pass - renders the scene
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

// 输出通道 - 处理色调映射和色彩空间 / Output pass - handles tone mapping and color space
const outputPass = new OutputPass();
composer.addPass(outputPass);

// ============ 渲染模式切换 / Render Mode Toggle ============
let useComposer = true; // 是否使用合成器 / Whether to use composer

const btnDirect = document.getElementById('btnDirect');
const btnComposer = document.getElementById('btnComposer');
const statusEl = document.getElementById('status');

btnDirect.addEventListener('click', () => {
    useComposer = false;
    btnDirect.classList.add('active');
    btnComposer.classList.remove('active');
    statusEl.textContent = '当前: 直接渲染 (Direct Render)';
    statusEl.style.color = '#0f0';
});

btnComposer.addEventListener('click', () => {
    useComposer = true;
    btnComposer.classList.add('active');
    btnDirect.classList.remove('active');
    statusEl.textContent = '当前: 合成器渲染 (Composer)';
    statusEl.style.color = '#ff0';
});

// ============ 窗口大小自适应 / Responsive Resize ============
window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    // 同步更新合成器尺寸 / Sync composer size
    composer.setSize(w, h);
});

// ============ 动画循环 / Animation Loop ============
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // 动画化物体 / Animate objects
    objects.forEach((obj, i) => {
        obj.rotation.x += 0.005 * (i % 3 + 1);
        obj.rotation.y += 0.008 * ((i + 1) % 3 + 1);
        obj.position.y = 0.6 + Math.sin(t * 0.8 + i * 0.5) * 0.3;
    });

    // 中央球体脉动 / Central sphere pulsing
    const scale = 1 + Math.sin(t * 2) * 0.1;
    glowSphere.scale.set(scale, scale, scale);
    glowMat.emissiveIntensity = 0.5 + Math.sin(t * 3) * 0.3;

    // 点光源旋转 / Rotate point lights
    pointLight1.position.x = Math.cos(t * 0.5) * 4;
    pointLight1.position.z = Math.sin(t * 0.5) * 4;
    pointLight2.position.x = Math.cos(t * 0.5 + Math.PI) * 4;
    pointLight2.position.z = Math.sin(t * 0.5 + Math.PI) * 4;

    controls.update();

    // 根据模式渲染 / Render based on mode
    if (useComposer) {
        // 使用效果合成器渲染 / Render with effect composer
        composer.render();
    } else {
        // 直接渲染 / Direct render
        renderer.render(scene, camera);
    }
}

animate();
</script>
</body>
</html>
