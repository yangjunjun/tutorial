<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - 基础材质 / MeshBasicMaterial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8); color: #fff;
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; max-width: 340px;
      pointer-events: auto; z-index: 10;
    }
    #info h2 { margin: 0 0 6px; font-size: 15px; color: #4fc3f7; }
    .ctrl-group { margin-top: 6px; }
    .ctrl-group label { display: block; margin-bottom: 2px; font-size: 12px; color: #aaa; }
    input[type="range"] { width: 100%; margin: 2px 0 4px; }
    .val { color: #4fc3f7; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .btn {
      padding: 3px 8px; border: 1px solid #555; border-radius: 4px;
      background: #333; color: #fff; cursor: pointer; font-size: 11px;
    }
    .btn:hover { background: #555; }
    .btn.active { border-color: #4fc3f7; background: #1a3a4a; }
    input[type="color"] { width: 50px; height: 26px; border: none; cursor: pointer; }
    .chk { margin: 4px 0; font-size: 12px; color: #ccc; }
  </style>
</head>
<body>
  <div id="info">
    <h2>基础材质 / MeshBasicMaterial</h2>
    <p>MeshBasicMaterial 不受光照影响，只显示纯色或纹理。<br>
       MeshBasicMaterial is not affected by lights — it shows a flat color or texture.</p>
    <p style="color:#ffeb3b; font-size:12px;">注意：场景中没有光源，但物体仍然可见！<br>
       Notice: there are no lights, but objects are still visible!</p>

    <div class="ctrl-group">
      <label>颜色 / Color:</label>
      <input type="color" id="colorPicker" value="#3498db">
    </div>
    <div class="ctrl-group">
      <label>线框 / Wireframe:</label>
      <div class="btn-row">
        <button class="btn active" id="wireOff" onclick="setWire(false)">关闭/Off</button>
        <button class="btn" id="wireOn" onclick="setWire(true)">开启/On</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>透明度 / Opacity: <span class="val" id="opVal">1.00</span></label>
      <input type="range" id="opSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="ctrl-group">
      <label>渲染面 / Side:</label>
      <div class="btn-row">
        <button class="btn active" onclick="setSide('front')">FrontSide</button>
        <button class="btn" onclick="setSide('back')">BackSide</button>
        <button class="btn" onclick="setSide('double')">DoubleSide</button>
      </div>
    </div>
    <div class="chk">
      <label><input type="checkbox" id="transparentChk"> 启用透明 / Enable Transparency</label>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基础场景（无灯光）/ Basic scene (no lights) =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 4, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ===== 注意：不添加任何光源！/ Note: NO lights added! =====
    // MeshBasicMaterial 不需要光源 / MeshBasicMaterial doesn't need lights

    // ===== 创建多个物体 / Create multiple objects =====
    // 使用共享材质的引用方便统一修改 / Use shared material properties for easy updates
    const material = new THREE.MeshBasicMaterial({ color: 0x3498db });
    const meshes = [];

    // 立方体 / Cube
    const cube = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), material);
    cube.position.set(-2.5, 0.6, 0);
    scene.add(cube); meshes.push(cube);

    // 球体 / Sphere
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), material.clone());
    sphere.position.set(0, 0.7, 0);
    scene.add(sphere); meshes.push(sphere);

    // 圆环 / Torus
    const torus = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.25, 16, 48), material.clone());
    torus.position.set(2.5, 0.7, 0);
    scene.add(torus); meshes.push(torus);

    // 大平面（展示双面效果）/ Large plane (to show double-side effect)
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(3, 2, 4, 4),
      material.clone()
    );
    plane.position.set(0, 1, -2.5);
    plane.rotation.x = -0.3;
    scene.add(plane); meshes.push(plane);

    // 地面参考（使用不同颜色）/ Ground reference (different color)
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshBasicMaterial({ color: 0x333344 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 收集所有可修改的材质 / Collect all modifiable materials
    function getAllMaterials() {
      return meshes.map(m => m.material);
    }

    // ===== UI 控制 / UI Controls =====
    document.getElementById('colorPicker').addEventListener('input', e => {
      getAllMaterials().forEach(mat => mat.color.set(e.target.value));
    });

    window.setWire = function(val) {
      getAllMaterials().forEach(mat => mat.wireframe = val);
      document.getElementById('wireOff').classList.toggle('active', !val);
      document.getElementById('wireOn').classList.toggle('active', val);
    };

    document.getElementById('opSlider').addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      document.getElementById('opVal').textContent = v.toFixed(2);
      getAllMaterials().forEach(mat => mat.opacity = v);
    });

    document.getElementById('transparentChk').addEventListener('change', e => {
      const en = e.target.checked;
      getAllMaterials().forEach(mat => {
        mat.transparent = en;
        mat.depthWrite = !en;
      });
    });

    window.setSide = function(side) {
      const map = { front: THREE.FrontSide, back: THREE.BackSide, double: THREE.DoubleSide };
      getAllMaterials().forEach(mat => mat.side = map[side]);
      event.target.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    // ===== 响应式 / Responsive =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.008;
      torus.rotation.x += 0.01;
      torus.rotation.y += 0.005;
      plane.rotation.y += 0.005;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
