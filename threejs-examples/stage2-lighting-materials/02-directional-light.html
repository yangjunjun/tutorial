<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 - 平行光 / DirectionalLight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.6; max-width: 320px;
      pointer-events: auto; z-index: 10;
    }
    #info h2 { margin: 0 0 6px; font-size: 15px; color: #4fc3f7; }
    .ctrl-group { margin-top: 8px; }
    .ctrl-group label { display: block; margin-bottom: 4px; font-size: 12px; color: #aaa; }
    .btn {
      padding: 4px 10px; border: 1px solid #555; border-radius: 4px;
      background: #333; color: #fff; cursor: pointer; font-size: 12px;
    }
    .btn:hover { background: #555; }
    .btn.active { border-color: #4fc3f7; background: #1a3a4a; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    input[type="range"] { width: 100%; }
  </style>
</head>
<body>
  <div id="info">
    <h2>平行光 / DirectionalLight</h2>
    <p>平行光模拟太阳光，光线沿同一方向照射，可以产生阴影。<br>
       DirectionalLight simulates sunlight — all rays travel in the same direction, casting shadows.</p>
    <div class="ctrl-group">
      <label>光源位置 / Light Position:</label>
      <div class="btn-row">
        <button class="btn active" onclick="setLightPos(5,8,5)">右上/Front-Right</button>
        <button class="btn" onclick="setLightPos(-5,8,5)">左上/Front-Left</button>
        <button class="btn" onclick="setLightPos(0,10,0)">正上/Top</button>
        <button class="btn" onclick="setLightPos(5,3,0)">低角/Low Angle</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>强度 / Intensity: <span id="intVal">1.5</span></label>
      <input type="range" id="intSlider" min="0" max="4" step="0.1" value="1.5">
    </div>
    <div class="ctrl-group">
      <label>
        <input type="checkbox" id="showHelper" checked> 显示辅助线 / Show Helpers
      </label>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基础场景 / Basic scene setup =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // 天空色 / Sky color

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true; // 启用阴影 / Enable shadows
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ===== 平行光 / Directional Light =====
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true; // 开启阴影投射 / Enable shadow casting

    // 配置阴影相机 / Configure shadow camera
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    // 弱环境光补光 / Weak ambient fill light
    const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(ambientLight);

    // ===== 辅助器 / Helpers =====
    // 平行光方向辅助器（黄色线框）/ DirectionalLightHelper (yellow wireframe)
    const dirHelper = new THREE.DirectionalLightHelper(dirLight, 2, 0xffaa00);
    scene.add(dirHelper);

    // 阴影相机辅助器 / Shadow camera helper
    const shadowHelper = new THREE.CameraHelper(dirLight.shadow.camera);
    scene.add(shadowHelper);

    // ===== 地面 / Ground plane =====
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x8fbc8f, roughness: 0.9 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true; // 接收阴影 / Receive shadows
    scene.add(ground);

    // ===== 场景物体 / Scene objects =====
    function makeObj(geo, color, pos) {
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      mesh.castShadow = true;   // 投射阴影 / Cast shadows
      mesh.receiveShadow = true; // 接收阴影 / Receive shadows
      scene.add(mesh);
      return mesh;
    }

    const cube = makeObj(new THREE.BoxGeometry(1, 1, 1), 0xe74c3c, new THREE.Vector3(-2, 0.5, 0));
    const sphere = makeObj(new THREE.SphereGeometry(0.6, 32, 32), 0x3498db, new THREE.Vector3(0, 0.6, 0));
    const torusKnot = makeObj(new THREE.TorusKnotGeometry(0.4, 0.15, 80, 16), 0x2ecc71, new THREE.Vector3(2, 0.8, 0));
    const cylinder = makeObj(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 32), 0xf39c12, new THREE.Vector3(0, 0.75, -2));
    const cone = makeObj(new THREE.ConeGeometry(0.5, 1.2, 32), 0x9b59b6, new THREE.Vector3(1, 0.6, 2));

    // ===== UI 控制 / UI Controls =====
    const intSlider = document.getElementById('intSlider');
    const intVal = document.getElementById('intVal');
    const showHelper = document.getElementById('showHelper');

    // 设置光源位置 / Set light position
    window.setLightPos = function(x, y, z) {
      dirLight.position.set(x, y, z);
      dirHelper.update(); // 更新辅助器 / Update helper
      document.querySelectorAll('.btn-row .btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    intSlider.addEventListener('input', () => {
      dirLight.intensity = parseFloat(intSlider.value);
      intVal.textContent = parseFloat(intSlider.value).toFixed(1);
    });

    showHelper.addEventListener('change', () => {
      dirHelper.visible = showHelper.checked;
      shadowHelper.visible = showHelper.checked;
    });

    // ===== 响应式 / Responsive =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.005;
      torusKnot.rotation.y += 0.008;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
