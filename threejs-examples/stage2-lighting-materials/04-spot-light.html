<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - 聚光灯 / SpotLight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.6; max-width: 320px;
      pointer-events: auto; z-index: 10;
    }
    #info h2 { margin: 0 0 6px; font-size: 15px; color: #4fc3f7; }
    .ctrl-group { margin-top: 6px; }
    .ctrl-group label { display: block; margin-bottom: 2px; font-size: 12px; color: #aaa; }
    input[type="range"] { width: 100%; margin: 2px 0 4px; }
    .val { color: #4fc3f7; }
    .chk-row { margin-top: 6px; }
    .chk-row label { color: #ccc; font-size: 12px; }
  </style>
</head>
<body>
  <div id="info">
    <h2>聚光灯 / SpotLight</h2>
    <p>聚光灯从一点沿锥形方向发射光线，可控制角度和半影。<br>
       SpotLight emits a cone of light in a specific direction, with controllable angle and penumbra.</p>
    <div class="ctrl-group">
      <label>角度 / Angle: <span class="val" id="angleVal">0.5</span> rad</label>
      <input type="range" id="angleSlider" min="0.1" max="1.5" step="0.05" value="0.5">
    </div>
    <div class="ctrl-group">
      <label>半影 / Penumbra: <span class="val" id="penVal">0.3</span></label>
      <input type="range" id="penSlider" min="0" max="1" step="0.05" value="0.3">
    </div>
    <div class="ctrl-group">
      <label>距离 / Distance: <span class="val" id="distVal">20</span></label>
      <input type="range" id="distSlider" min="5" max="40" step="1" value="20">
    </div>
    <div class="ctrl-group">
      <label>强度 / Intensity: <span class="val" id="intVal">3</span></label>
      <input type="range" id="intSlider" min="0" max="8" step="0.1" value="3">
    </div>
    <div class="chk-row">
      <label><input type="checkbox" id="animToggle" checked> 自动扫描 / Auto Sweep</label>
    </div>
    <div class="chk-row">
      <label><input type="checkbox" id="helperToggle" checked> 显示辅助器 / Show Helper</label>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基础场景 / Basic scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d1a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ===== 聚光灯 / SpotLight =====
    const spotLight = new THREE.SpotLight(0xffffff, 3, 20, 0.5, 0.3, 2);
    spotLight.position.set(0, 8, 0);
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.set(1024, 1024);
    scene.add(spotLight);

    // 聚光灯目标点 / Spotlight target
    spotLight.target.position.set(0, 0, 0);
    scene.add(spotLight.target);

    // 聚光灯辅助器 / SpotLight helper
    const spotHelper = new THREE.SpotLightHelper(spotLight, 0xffaa00);
    scene.add(spotHelper);

    // 弱环境光 / Weak ambient
    scene.add(new THREE.AmbientLight(0x222233, 0.4));

    // ===== 地面 / Ground =====
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== 一组物体 / Group of objects =====
    const objData = [
      { geo: new THREE.BoxGeometry(0.8, 0.8, 0.8), color: 0xe74c3c, pos: [-2, 0.4, 0] },
      { geo: new THREE.SphereGeometry(0.5, 32, 32), color: 0x3498db, pos: [0, 0.5, 0] },
      { geo: new THREE.TorusKnotGeometry(0.35, 0.12, 80, 12), color: 0x2ecc71, pos: [2, 0.6, 0] },
      { geo: new THREE.CylinderGeometry(0.35, 0.35, 1, 24), color: 0xf1c40f, pos: [-1, 0.5, -2] },
      { geo: new THREE.ConeGeometry(0.45, 1, 24), color: 0x9b59b6, pos: [1, 0.5, 2] },
      { geo: new THREE.DodecahedronGeometry(0.45), color: 0xe67e22, pos: [0, 0.45, -1.5] },
    ];
    const meshes = objData.map(d => {
      const m = new THREE.Mesh(d.geo, new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.4 }));
      m.position.set(...d.pos);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    });

    // ===== UI 控制 / UI controls =====
    let autoSweep = true;
    const bind = (sId, vId, cb, fmt) => {
      const s = document.getElementById(sId), v = document.getElementById(vId);
      s.addEventListener('input', () => {
        const val = parseFloat(s.value);
        v.textContent = fmt ? fmt(val) : val;
        cb(val);
        spotHelper.update();
      });
    };
    bind('angleSlider', 'angleVal', v => spotLight.angle = v, v => v.toFixed(2));
    bind('penSlider', 'penVal', v => spotLight.penumbra = v, v => v.toFixed(2));
    bind('distSlider', 'distVal', v => spotLight.distance = v, v => v.toFixed(0));
    bind('intSlider', 'intVal', v => spotLight.intensity = v, v => v.toFixed(1));

    document.getElementById('animToggle').addEventListener('change', e => autoSweep = e.target.checked);
    document.getElementById('helperToggle').addEventListener('change', e => spotHelper.visible = e.target.checked);

    // ===== 响应式 / Responsive =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // 聚光灯扫描动画 / Spotlight sweep animation
      if (autoSweep) {
        spotLight.target.position.x = Math.sin(t * 0.5) * 3;
        spotLight.target.position.z = Math.cos(t * 0.5) * 3;
        spotHelper.update();
      }

      // 旋转物体 / Rotate objects
      meshes.forEach(m => { m.rotation.y += 0.005; });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
