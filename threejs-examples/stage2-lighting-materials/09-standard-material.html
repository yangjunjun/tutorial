<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - 标准材质(PBR) / MeshStandardMaterial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8); color: #fff;
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; max-width: 340px;
      pointer-events: auto; z-index: 10; max-height: 90vh; overflow-y: auto;
    }
    #info h2 { margin: 0 0 6px; font-size: 15px; color: #4fc3f7; }
    .ctrl-group { margin-top: 6px; }
    .ctrl-group label { display: block; margin-bottom: 2px; font-size: 12px; color: #aaa; }
    input[type="range"] { width: 100%; margin: 2px 0 4px; }
    .val { color: #4fc3f7; }
    input[type="color"] { width: 50px; height: 26px; border: none; cursor: pointer; }
    .section { border-top: 1px solid #333; padding-top: 6px; margin-top: 8px; }
    .preset-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .preset {
      padding: 3px 8px; border: 1px solid #555; border-radius: 4px;
      background: #333; color: #fff; cursor: pointer; font-size: 11px;
    }
    .preset:hover { background: #555; }
  </style>
</head>
<body>
  <div id="info">
    <h2>标准材质(PBR) / MeshStandardMaterial</h2>
    <p>基于物理的渲染(PBR)材质，使用 roughness 和 metalness 控制外观。<br>
       Physically-Based Rendering material. Uses roughness and metalness to control appearance.</p>

    <div class="ctrl-group">
      <label>预设 / Presets:</label>
      <div class="preset-row">
        <button class="preset" onclick="applyPreset('rubber')">橡胶/Rubber</button>
        <button class="preset" onclick="applyPreset('chrome')">铬/Chrome</button>
        <button class="preset" onclick="applyPreset('gold')">金/Gold</button>
        <button class="preset" onclick="applyPreset('plastic')">塑料/Plastic</button>
      </div>
    </div>

    <div class="section">
      <div class="ctrl-group">
        <label>颜色 / Color: <input type="color" id="colorPicker" value="#88ccff"></label>
      </div>
      <div class="ctrl-group">
        <label>粗糙度 / Roughness: <span class="val" id="roughVal">0.50</span></label>
        <input type="range" id="roughSlider" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="ctrl-group">
        <label>金属度 / Metalness: <span class="val" id="metalVal">0.00</span></label>
        <input type="range" id="metalSlider" min="0" max="1" step="0.01" value="0">
      </div>
    </div>

    <div class="section">
      <div class="ctrl-group">
        <label>自发光色 / Emissive: <input type="color" id="emissivePicker" value="#000000"></label>
      </div>
      <div class="ctrl-group">
        <label>自发光强度 / Emissive Intensity: <span class="val" id="emIntVal">0.0</span></label>
        <input type="range" id="emIntSlider" min="0" max="3" step="0.1" value="0">
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基础场景 / Basic scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ===== 良好的环境光照 / Good environment lighting =====
    // 半球光 + 平行光提供丰富的反射 / Hemisphere + directional for rich reflections
    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362d1b, 0.5);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(3, 5, 3);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0x6688cc, 0.8);
    dirLight2.position.set(-3, 3, -2);
    scene.add(dirLight2);

    // 简单环境贴图（使用 PMREMGenerator 从场景生成）/ Simple env map
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    // 创建简单的渐变环境 / Create simple gradient environment
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x88aacc);
    // 添加一些彩色光源到环境场景 / Add colored lights to env scene
    envScene.add(new THREE.PointLight(0xff4444, 10, 20).translateX(5).translateY(5));
    envScene.add(new THREE.PointLight(0x4444ff, 10, 20).translateX(-5).translateY(3));
    envScene.add(new THREE.PointLight(0x44ff44, 10, 20).translateZ(5).translateY(2));
    const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envMap;

    // ===== 大球体 / Large sphere =====
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x88ccff,
      roughness: 0.5,
      metalness: 0.0,
      emissive: 0x000000,
      emissiveIntensity: 0,
    });
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 64, 64), sphereMat);
    sphere.position.set(0, 1.5, 0);
    scene.add(sphere);

    // 地面 / Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.7 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // ===== UI 绑定 / UI bindings =====
    const colorPicker = document.getElementById('colorPicker');
    const roughSlider = document.getElementById('roughSlider');
    const metalSlider = document.getElementById('metalSlider');
    const emissivePicker = document.getElementById('emissivePicker');
    const emIntSlider = document.getElementById('emIntSlider');

    function updateMaterial() {
      sphereMat.color.set(colorPicker.value);
      sphereMat.roughness = parseFloat(roughSlider.value);
      sphereMat.metalness = parseFloat(metalSlider.value);
      sphereMat.emissive.set(emissivePicker.value);
      sphereMat.emissiveIntensity = parseFloat(emIntSlider.value);
      document.getElementById('roughVal').textContent = sphereMat.roughness.toFixed(2);
      document.getElementById('metalVal').textContent = sphereMat.metalness.toFixed(2);
      document.getElementById('emIntVal').textContent = sphereMat.emissiveIntensity.toFixed(1);
    }

    [colorPicker, roughSlider, metalSlider, emissivePicker, emIntSlider].forEach(el => {
      el.addEventListener('input', updateMaterial);
    });

    // 预设 / Presets
    window.applyPreset = function(name) {
      const presets = {
        rubber:  { color: '#222222', rough: 0.9, metal: 0.0, emissive: '#000000', emInt: 0 },
        chrome:  { color: '#cccccc', rough: 0.05, metal: 1.0, emissive: '#000000', emInt: 0 },
        gold:    { color: '#ffcc00', rough: 0.2, metal: 1.0, emissive: '#000000', emInt: 0 },
        plastic: { color: '#ff4444', rough: 0.4, metal: 0.0, emissive: '#000000', emInt: 0 },
      };
      const p = presets[name];
      colorPicker.value = p.color;
      roughSlider.value = p.rough;
      metalSlider.value = p.metal;
      emissivePicker.value = p.emissive;
      emIntSlider.value = p.emInt;
      updateMaterial();
    };

    // ===== 响应式 / Responsive =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.003;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
