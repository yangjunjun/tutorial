<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 - 阴影系统 / Shadow System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8); color: #fff;
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; max-width: 340px;
      pointer-events: auto; z-index: 10; max-height: 90vh; overflow-y: auto;
    }
    #info h2 { margin: 0 0 6px; font-size: 15px; color: #4fc3f7; }
    .ctrl-group { margin-top: 6px; }
    .ctrl-group label { display: block; margin-bottom: 2px; font-size: 12px; color: #aaa; }
    input[type="range"] { width: 100%; margin: 2px 0 4px; }
    .val { color: #4fc3f7; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .btn {
      padding: 3px 8px; border: 1px solid #555; border-radius: 4px;
      background: #333; color: #fff; cursor: pointer; font-size: 11px;
    }
    .btn:hover { background: #555; }
    .btn.active { border-color: #4fc3f7; background: #1a3a4a; }
    .section { border-top: 1px solid #333; padding-top: 6px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="info">
    <h2>阴影系统 / Shadow System</h2>
    <p>Three.js 阴影通过 shadow map 实现。调整参数查看效果变化。<br>
       Three.js shadows use shadow maps. Adjust parameters to see how they affect quality.</p>

    <div class="ctrl-group">
      <label>阴影贴图大小 / Shadow Map Size:</label>
      <div class="btn-row">
        <button class="btn" onclick="setMapSize(512)">512</button>
        <button class="btn active" onclick="setMapSize(2048)">2048</button>
        <button class="btn" onclick="setMapSize(4096)">4096</button>
      </div>
    </div>

    <div class="section">
      <div class="ctrl-group">
        <label>Shadow Bias: <span class="val" id="biasVal">-0.0005</span></label>
        <input type="range" id="biasSlider" min="-0.01" max="0.01" step="0.0001" value="-0.0005">
      </div>
      <div class="ctrl-group">
        <label>Normal Bias: <span class="val" id="nBiasVal">0</span></label>
        <input type="range" id="nBiasSlider" min="-0.05" max="0.05" step="0.001" value="0">
      </div>
      <div class="ctrl-group">
        <label>光源高度 / Light Height: <span class="val" id="heightVal">8</span></label>
        <input type="range" id="heightSlider" min="2" max="15" step="0.5" value="8">
      </div>
      <div class="ctrl-group">
        <label>光源角度 / Light Angle: <span class="val" id="angleVal">45</span>&deg;</label>
        <input type="range" id="angleSlider" min="0" max="360" step="5" value="45">
      </div>
    </div>

    <div class="section">
      <div class="ctrl-group">
        <label>阴影类型 / Shadow Type:</label>
        <div class="btn-row">
          <button class="btn" onclick="setShadowType('basic')">Basic</button>
          <button class="btn active" onclick="setShadowType('pcfsoft')">PCFSoft</button>
          <button class="btn" onclick="setShadowType('pcf')">PCF</button>
          <button class="btn" onclick="setShadowType('vsm')">VSM</button>
        </div>
      </div>
      <div class="ctrl-group">
        <label><input type="checkbox" id="showHelper" checked> 显示辅助器 / Show Helpers</label>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基础场景 / Basic scene =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ===== 平行光 + 阴影 / Directional light with shadows =====
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;

    // 阴影相机配置 / Shadow camera configuration
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -8;
    dirLight.shadow.camera.right = 8;
    dirLight.shadow.camera.top = 8;
    dirLight.shadow.camera.bottom = -8;
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0;
    scene.add(dirLight);

    // 弱环境补光 / Weak ambient fill
    scene.add(new THREE.AmbientLight(0x404060, 0.4));

    // 辅助器 / Helpers
    const dirHelper = new THREE.DirectionalLightHelper(dirLight, 1.5, 0xffaa00);
    scene.add(dirHelper);
    const shadowHelper = new THREE.CameraHelper(dirLight.shadow.camera);
    scene.add(shadowHelper);

    // ===== 地面 / Ground =====
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== 投射阴影的物体 / Shadow-casting objects =====
    function makeObj(geo, color, pos) {
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.4 }));
      m.position.copy(pos);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }

    const sphere = makeObj(
      new THREE.SphereGeometry(0.7, 32, 32), 0xe74c3c, new THREE.Vector3(-2, 0.7, 0)
    );
    const cube = makeObj(
      new THREE.BoxGeometry(1, 1, 1), 0x3498db, new THREE.Vector3(0, 0.5, 0)
    );
    const torusKnot = makeObj(
      new THREE.TorusKnotGeometry(0.5, 0.18, 80, 16), 0x2ecc71, new THREE.Vector3(2, 1, 0)
    );
    // 悬浮球（展示阴影投射）/ Floating sphere (shadow casting)
    const floatingSphere = makeObj(
      new THREE.SphereGeometry(0.4, 24, 24), 0xf1c40f, new THREE.Vector3(0, 2.5, -1)
    );

    // ===== UI 控制 / UI Controls =====
    const bind = (sId, vId, cb, fmt) => {
      const s = document.getElementById(sId);
      const v = document.getElementById(vId);
      s.addEventListener('input', () => {
        const val = parseFloat(s.value);
        v.textContent = fmt ? fmt(val) : val;
        cb(val);
      });
    };

    bind('biasSlider', 'biasVal', v => dirLight.shadow.bias = v, v => v.toFixed(4));
    bind('nBiasSlider', 'nBiasVal', v => dirLight.shadow.normalBias = v, v => v.toFixed(3));
    bind('heightSlider', 'heightVal', v => {
      dirLight.position.y = v;
      dirHelper.update();
    }, v => v.toFixed(1));
    bind('angleSlider', 'angleVal', v => {
      const rad = (v * Math.PI) / 180;
      const dist = 7;
      dirLight.position.x = Math.cos(rad) * dist;
      dirLight.position.z = Math.sin(rad) * dist;
      dirHelper.update();
    }, v => v.toFixed(0));

    // 修改阴影贴图大小 / Change shadow map size
    window.setMapSize = function(size) {
      dirLight.shadow.mapSize.width = size;
      dirLight.shadow.mapSize.height = size;
      // 需要重新生成阴影贴图 / Regenerate shadow map
      dirLight.shadow.map?.dispose();
      dirLight.shadow.map = null;
      document.querySelectorAll('.btn-row')[0].querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    // 修改阴影类型 / Change shadow type
    window.setShadowType = function(type) {
      const map = { basic: THREE.BasicShadowMap, pcf: THREE.PCFShadowMap, pcfsoft: THREE.PCFSoftShadowMap, vsm: THREE.VSMShadowMap };
      renderer.shadowMap.type = map[type];
      // 需要更新所有材质 / Materials need update
      scene.traverse(obj => {
        if (obj.material) obj.material.needsUpdate = true;
      });
      document.querySelectorAll('.btn-row')[1].querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    document.getElementById('showHelper').addEventListener('change', e => {
      dirHelper.visible = e.target.checked;
      shadowHelper.visible = e.target.checked;
    });

    // ===== 响应式 / Responsive =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== 动画循环 / Animation loop =====
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // 悬浮球上下移动 / Floating sphere bobs up and down
      floatingSphere.position.y = 2.5 + Math.sin(t * 1.5) * 0.5;

      cube.rotation.y += 0.005;
      torusKnot.rotation.y += 0.008;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
